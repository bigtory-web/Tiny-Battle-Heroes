<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전투 테스트베드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12131f; --panel:#1c1e30; --panel-2:#262940; --line:#363a5a; --text:#eef0fa; --muted:#a3a8c6;
  --gold:#ffd34d; --green:#7ee08a; --red:#ff6b6b; --blue:#7fb8ff;
  --display:'Black Han Sans','Gothic A1',sans-serif; --body:'Gothic A1',system-ui,sans-serif;
  --navH:64px; --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100%;position:relative;background:radial-gradient(circle at 50% 0,#252a4a 0,transparent 55%)}

/* 상단 바 */
.top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top,0px)) 16px 10px;background:rgba(18,19,31,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font:400 19px var(--display);margin-right:auto}
.tag{font:400 15px var(--display);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--gold)}

/* 탭 내용 */
.page{padding:12px 16px calc(var(--navH) + var(--sb) + 20px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font:400 17px var(--display);display:flex;align-items:center;gap:8px}
.card h2 small{font:600 12px var(--body);color:var(--muted);margin-left:auto}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font:700 11px var(--body);padding:2px 8px;border-radius:8px;background:#5a2b2b;color:#ffb3a8}
.badge.boss{background:#5a4a1b;color:var(--gold)}

/* 하단 탭 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:4;background:#171828;border-top:1px solid var(--line);padding-bottom:var(--sb)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--navH)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 11px var(--body);color:var(--muted);position:relative}
.nav button .i{font-size:22px;line-height:1;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--gold)}
.nav button.on .i{filter:none;opacity:1}
.nav button.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.dot{position:absolute;top:10px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--red)}

/* 캠페인 */
.stageCard{text-align:center;padding:18px 14px}
.chap{font:700 12px var(--body);color:var(--muted)}
.bigStage{font:400 44px/1.1 var(--display);margin:2px 0 6px}
.enemies{display:flex;gap:6px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
.mini{width:52px;text-align:center;font-size:10px;color:var(--muted)}
.mini .av{width:46px;height:46px;border-radius:50%;margin:0 auto 2px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#2a2d48;border:3px solid var(--el)}
.mini.boss .av{box-shadow:0 0 12px var(--gold)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:12px;background:var(--panel-2);border-radius:12px;padding:8px 12px}
.vs b{font:400 18px var(--display)} .vs .me{color:var(--green)} .vs .them{color:#ff9a8a;text-align:right}
.vs span{font-size:11px;color:var(--muted)}
.go{font:400 20px var(--display);padding:14px 22px;border-radius:14px;border:0;background:linear-gradient(180deg,#ffdc6e,#e3a21a);color:#2a1d05;box-shadow:0 4px 0 #8a5a0a;width:100%}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5a0a}
.go:disabled{filter:grayscale(1);opacity:.5}
.ghost{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-size:13px;font-weight:700}
.shdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stName{font:400 19px var(--display);display:flex;align-items:center;gap:6px;color:var(--gold);white-space:nowrap}
.top{gap:6px}
.top h1{margin-right:0!important;font-size:17px;white-space:nowrap}
.top .tag,.top .idleChip{white-space:nowrap;flex:none}
.top .tag{padding:5px 9px;font-size:14px}
.top .badge{font-size:10px;padding:1px 5px}
.stName{min-width:0;overflow:hidden}
.top .sp{flex:1}
.top .idleChip{margin-left:0;padding:5px 10px;font-size:13px}
.top .idleChip b{font-size:13px}
.vsbar .me.over{color:var(--red)}
.vsbar .p{white-space:nowrap}
.idleChip{margin-left:auto;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid #4e8a4e;background:#25402a;font-size:16px}
.idleChip b{font:400 15px var(--display);color:var(--gold)}
.idleChip:disabled{opacity:.5}
.frow{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.frow .ffilter{margin:0;flex:1}
.frow .ghost{flex:none;padding:8px 12px}
.fightWrap{position:sticky;bottom:calc(var(--navH) + var(--sb) + 10px);margin-top:14px;z-index:2}
.chest{display:flex;align-items:center;gap:12px}
.chest .ic{font-size:38px}
.chest b{display:block;font:400 22px var(--display);color:var(--gold)}
.chest .ghost{margin-left:auto;background:#3a6a3a;border-color:#4e8a4e;color:#d9ffd4}
.chest .ghost:disabled{background:var(--panel-2);border-color:var(--line);color:var(--muted)}
.prog{height:8px;border-radius:4px;background:#0e0f1a;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#e3a21a,#ffdc6e)}

/* 영웅 탭 */
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.filters button{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:700 12px var(--body);color:var(--muted)}
.filters button.on{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
.hlist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.hrow .av{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;background:#1b1d30;border:3px solid var(--el);position:relative}
.hrow .av em{position:absolute;bottom:-4px;right:-6px;font:700 9px var(--body);font-style:normal;background:var(--gold);color:#2a1d05;border-radius:6px;padding:0 4px}
.hrow .info{flex:1;min-width:0}
.hrow .nm{font:400 15px var(--display)}
.hrow .meta{font:700 11px var(--body);color:var(--muted)}
.hrow .st{font-size:11px;color:#c9cdfa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{flex:none;width:86px;padding:8px 4px;border-radius:12px;border:0;background:#3a6a3a;color:#d9ffd4;font:700 12px/1.2 var(--body)}
.up small{display:block;font-weight:600;font-size:11px;color:var(--gold)}
.up:disabled{background:#33354c;color:#77799a}
.up:disabled small{color:#77799a}

/* 편성 (전체 화면) */
.sheet{position:fixed;inset:0;z-index:6;background:var(--bg);overflow:auto}
.sheet .in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#252a4a 0,transparent 55%)}
.shead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top,0px)) 12px 10px;background:rgba(18,19,31,.94);border-bottom:1px solid var(--line)}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:18px}
.shead .t{font:400 18px var(--display);margin-right:auto}
.sbody{padding:12px 16px;flex:1}
.sfoot{position:sticky;bottom:0;padding:10px 16px calc(10px + var(--sb));background:rgba(18,19,31,.94);border-top:1px solid var(--line)}
.vsbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 4px 8px}
.vsbar .p{font:400 20px var(--display)} .vsbar .me{color:var(--green)} .vsbar .them{color:#ff9a8a;text-align:right}
.vsbar .vs{font:400 30px var(--display);color:var(--gold);text-shadow:0 3px 0 #7a4a00;background:none;padding:0;margin:0;display:block}
.field{position:relative;aspect-ratio:480/520;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#26304d,#1a2a1d)}
.field::before{content:'';position:absolute;left:50%;top:6%;bottom:6%;width:2px;background:rgba(255,255,255,.06)}
.unit{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.slot,.foe{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;padding:0;position:relative}
.slot{border:2px dashed rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:rgba(255,255,255,.35);font-size:22px}
.slot.on{border:3px solid var(--el);background:#232845;color:inherit;font-size:28px}
.foe{border:3px solid var(--el);background:#3a1f28}
.foe.boss{width:68px;height:68px;box-shadow:0 0 14px var(--gold)}
.foe .av{transform:scaleX(-1)}
.unit .lv{margin-top:-6px;font:700 10px var(--body);color:var(--text);background:rgba(0,0,0,.75);border-radius:6px;padding:0 6px;position:relative}
.ffilter{display:flex;gap:6px;margin:12px 0 8px;overflow-x:auto}
.ffilter button{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font:700 11px var(--body);color:var(--muted);padding:0}
.ffilter button.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 2px rgba(255,211,77,.25)}
.ffilter button .d{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto;background:var(--el)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,52px);gap:6px;justify-content:center}
.chip{aspect-ratio:1;border:2px solid var(--el);background:#1b1d30;border-radius:12px;padding:0;display:flex;align-items:center;justify-content:center;position:relative;font-size:24px}
.chip .lv{position:absolute;top:2px;right:4px;font:700 9px var(--body);color:var(--text);text-shadow:0 1px 2px #000}
.chip .nm{position:absolute;bottom:2px;left:0;right:0;text-align:center;font:700 9px var(--body);color:var(--muted)}
.chip.inteam::before{content:'';position:absolute;inset:0;border-radius:10px;background:rgba(0,0,0,.55)}
.chip.inteam::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--green);font:800 30px var(--body);text-shadow:0 2px 0 #000}

/* 초상화 이미지 (전신 그림의 얼굴·상체 쪽을 원 안에 보여줘요) */
.av.pic{display:block;width:100%;height:100%;border-radius:inherit;background-repeat:no-repeat;background-size:150%;background-position:50% 6%;font-size:0}
.slot .av.pic,.foe .av.pic,.hrow .av .pic{border-radius:50%}
.chip .av.pic{border-radius:10px}
/* 편성 화면의 전장: 원 대신 서 있는 전신 그림, 발밑 타원 = 진영 색 */
.slot.on,.foe{width:70px;height:78px;border:0;border-radius:0;background:none;box-shadow:none;align-items:flex-end}
.foe.boss{width:84px;height:92px;box-shadow:none;filter:drop-shadow(0 0 8px var(--gold))}
.slot.on::after,.foe::after{content:'';position:absolute;left:14%;right:14%;bottom:-2px;height:12px;border-radius:50%;border:2px solid var(--el);background:rgba(0,0,0,.35);z-index:-1}
.slot.on .av.pic,.foe .av.pic{border-radius:0;background-size:contain;background-position:50% 100%}
.slot.on .av:not(.pic),.foe .av:not(.pic){font-size:34px}
.unit{z-index:0}
.unit .lv{margin-top:4px}
.chip .cst{position:absolute;bottom:2px;left:3px;font:800 9px var(--body);color:#2a1d05;background:var(--gold);border-radius:5px;padding:0 3px;z-index:1}
.chip .lv{z-index:1}
.stars{color:var(--gold);letter-spacing:-2px;font-size:10px;text-shadow:0 1px 2px #000}
.chip .stars{position:absolute;top:1px;left:3px;z-index:1}
.capRow{display:flex;justify-content:space-between;font:700 12px var(--body);color:var(--muted);margin:10px 2px 0}
.capRow b{color:var(--text)} .capRow b.over{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(var(--navH) + var(--sb) + 80px);transform:translateX(-50%);z-index:9;background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font:700 13px var(--body);pointer-events:none;max-width:90%;text-align:center}
.gain{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px;border-radius:12px;background:var(--panel-2)}
.gain .big{width:64px;height:64px;border-radius:50%;border:3px solid var(--el);flex:none;overflow:hidden;background:#1b1d30;display:flex;align-items:center;justify-content:center;font-size:30px}
.gain b{font:400 17px var(--display)}
.pend{border-color:var(--gold)}
.pend .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:10px}
.pend .opts button{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:6px 4px;font:700 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:4px}
.pend .opts .ph{width:44px;height:44px;border-radius:50%;border:2px solid var(--el);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;background:#1b1d30}
.pend .opts button.new{border-color:var(--gold)}

/* 영입 룰렛 (오른쪽에서 밀려 들어와요) */
.roul{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.5);display:flex;justify-content:flex-end;align-items:center}
.rbox{--el:var(--gold);width:min(230px,64vw);margin-right:max(12px,calc(50vw - 248px));background:var(--panel);border:3px solid var(--el);border-radius:20px;padding:12px;text-align:center;animation:rin .35s ease-out;box-shadow:0 0 24px rgba(0,0,0,.6)}
.rbox.pop{animation:rpop .35s ease-out}
@keyframes rin{from{transform:translateX(130%)}}
@keyframes rpop{50%{transform:scale(1.06)}}
.rt{font:700 12px var(--body);color:var(--muted)}
.rpic{height:180px;background:no-repeat 50% 100%/contain;display:flex;align-items:center;justify-content:center;font-size:84px}
.rname{font:400 22px var(--display);margin-top:4px}
.rmeta{min-height:18px}
.rstrip{display:flex;justify-content:center;gap:4px;margin:8px 0 2px;flex-wrap:wrap}
.rstrip span{width:30px;height:30px;border-radius:50%;border:2px solid var(--el);overflow:hidden;opacity:.45;display:flex;align-items:center;justify-content:center;font-size:15px;background:#1b1d30}
.rstrip span .av.pic{background-size:150%;background-position:50% 6%}
.rstrip span.on{opacity:1;box-shadow:0 0 0 2px var(--gold)}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rbtns .go{font-size:17px;padding:10px 6px}

/* 전투 */
#battleView{z-index:7}
.stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;height:auto}
.res h3{margin:0;font:400 30px var(--display)}
.res h3.win{color:var(--gold)} .res h3.lose{color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.barc{display:inline-block;height:6px;border-radius:3px;background:var(--gold);vertical-align:middle;margin-left:4px}
.btns{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:12px}
.btns .go{font-size:17px;padding:12px 8px}

/* 도구 */
select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:13px;width:100%}
.mods{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <header class="top"><h1 id="topTitle">캠페인</h1><span class="stName" id="stWrap"><span id="stTitle">1-1</span><span id="stBadges"></span></span><span class="sp"></span><button class="idleChip" id="idleBtn" aria-label="방치 보상 받기">💰 <b id="idleAmt">0 G</b></button><span class="tag" id="goldTag">0 G</span></header>

  <!-- 캠페인 탭 -->
  <main class="page" id="tab-camp">
    <div class="vsbar"><span class="p me" id="costBox">코스트 <span id="fMy">0/3</span></span><span class="vs">VS</span><span class="p them"><span id="fEn">0</span> ⚔</span></div>
    <div class="card pend" id="pendBox" hidden></div>
    <div class="field" id="field"></div>
    <div class="frow"><span class="muted" style="flex:1">영웅을 눌러 넣고 빼요</span><button class="ghost" id="autoBtn">자동</button></div>
    <div class="roster" id="roster"></div>
    <div class="fightWrap"><button class="go" id="fightBtn">전투</button></div>
  </main>

  <!-- 영웅 탭 -->
  <main class="page" id="tab-hero" hidden>
    <div class="filters" id="filters"></div>
    <div class="hlist" id="hlist"></div>
  </main>

  <!-- 도구 탭 -->
  <main class="page" id="tab-tool" hidden>
    <section class="card">
      <h2>전투 요소 바꾸기 <small>다음 전투부터 적용</small></h2>
      <div class="mods" id="mods"></div>
    </section>
    <section class="card">
      <h2>봇 캠페인</h2>
      <div class="muted">지금 요소 설정으로 봇이 1명으로 시작해 영입·합성하며 1-1부터 3-10까지 진행해요. 판마다 영입 운이 달라서 결과가 달라져요.</div>
      <button class="ghost" id="simBtn" style="margin-top:8px">돌려 보기</button>
      <div id="simBox" class="muted" style="margin-top:8px"></div>
    </section>
    <section class="card">
      <h2>테스트</h2>
      <div class="row"><button class="ghost" id="goldBtn">골드 +5,000</button><button class="ghost" id="resetBtn">처음부터</button></div>
    </section>
  </main>

  <nav class="nav"><div class="in">
    <button data-tab="camp" class="on"><span class="i">🗺️</span>캠페인<span class="dot" id="campDot" hidden></span></button>
    <button data-tab="hero"><span class="i">🦸</span>영웅<span class="dot" id="heroDot" hidden></span></button>
    <button data-tab="tool"><span class="i">⚙️</span>도구</button>
  </div></nav>
</div>


<!-- 전투 -->
<div class="sheet" id="battleView" hidden><div class="in">
  <div class="shead"><span class="t" id="bTitle"></span><button class="ghost" id="spdBtn">1×</button><button class="ghost" id="skipBtn">건너뛰기</button></div>
  <div class="sbody">
    <div class="stage"><canvas id="cv" width="480" height="420" aria-label="전투 화면"></canvas></div>
    <div class="card res" id="res" hidden style="margin-top:12px"></div>
  </div>
</div></div>

<!-- 영입 룰렛 -->
<div class="roul" id="roul" hidden><div class="rbox">
  <div class="rt">영입 후보</div>
  <div class="rpic"></div>
  <div class="rname"></div>
  <div class="rmeta muted"></div>
  <div class="rstrip"></div>
  <div class="rbtns" hidden><button class="go" id="rYes">영입</button><button class="ghost" id="rNo">보내기</button></div>
</div></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  'use strict';
  var D = IDLE_DATA, E = IdleEngine;
  var $ = function(id){ return document.getElementById(id); };
  var AV = { bear: '🐻', knight: '🛡️', blades: '⚔️', wolf: '🐺', shadow: '🥷', hawk: '🦅', rain: '🏹', frost: '❄️', flame: '🔥', storm: '⚡', song: '🌿', drum: '🥁' };
  var ELC = { fire: '#ff7a45', water: '#4fa3ff', forest: '#5fcf6a', light: '#ffe066', dark: '#b07cff' };
  var ULTN = { taunt: '도발', teamShield: '수호의 방패', strike: '강타', multi: '연속 베기', backstab: '그림자 습격', snipe: '저격', chain: '연쇄 번개', healAll: '숲의 노래', haste: '북소리' };
  var AOEN = { rain: '화살비', frost: '눈보라', flame: '대폭발' };
  function ultName(h){ return h.ult.kind === 'aoe' ? (AOEN[h.id] || '광역') : ULTN[h.ult.kind]; }
  function g(n){ n = Math.floor(n); return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M G' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'K G' : n.toLocaleString() + ' G'; }

  // ───── 초상화 이미지: 불러온 것만 쓰고, 없으면 이모지 ─────
  var IMGS = {};
  D.heroes.forEach(function(h){ var im = new Image(); im.onload = function(){ IMGS[h.id] = im; if (S) renderAll(); }; im.src = 'img/s/' + h.id + '.png'; });
  function av(id){ return IMGS[id] ? '<span class="av pic" style="background-image:url(img/s/' + id + '.png)"></span>' : '<span class="av">' + AV[id] + '</span>'; }
  function stars(n){ return '<span class="stars">' + '★'.repeat(n || 1) + '</span>'; }

  // ───── 상태 저장 ─────
  var R = D.recruit, KEY = 'idle-testbed-v2', S;
  function fresh(){ var s = { gold: 0, stage: 0, owned: {}, levels: {}, team: [null, null, null, null, null], idleAt: Date.now(), modules: {}, pending: null };
    s.owned[R.startHero] = { star: 1, pieces: 0 }; s.levels[R.startHero] = D.startLevel; s.team[0] = R.startHero; return s; }
  try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!S || !S.owned) S = fresh();
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  function hero(id){ return E.heroById(D, id); }
  function star(id){ return (S.owned[id] || {}).star || 1; }
  function smul(id){ var s = E.starMul(D, star(id)); return { hp: s, atk: s }; }
  function ownedIds(){ return Object.keys(S.owned); }
  function bagIds(){ return ownedIds().filter(function(id){ return S.team.indexOf(id) < 0; }); }
  function cap(){ return E.costCap(D, S.stage); }
  function usedCost(){ return S.team.filter(Boolean).reduce(function(s, id){ return s + hero(id).cost; }, 0); }
  function roster(){ return ownedIds().map(function(id){ return { id: id, level: S.levels[id], star: star(id) }; }); }
  var toastT = 0;
  function toast(msg){ var t = $('toast'); if (!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 1800); }
  function teamSpec(){ return S.team.map(function(id, slot){ return id ? { id: id, level: S.levels[id], star: star(id), slot: slot, mul: smul(id) } : null; }).filter(Boolean); }
  function pow(h, lv, mul){ var gr = 1 + D.growth.perLevel * (lv - 1), m = mul || {}; return Math.sqrt(h.hp * gr * (m.hp || 1) * h.atk * gr * (m.atk || 1) / h.interval); }
  function powerOf(id){ return Math.round(pow(hero(id), S.levels[id], smul(id))); }
  function myPower(){ return S.team.filter(Boolean).reduce(function(s, id){ return s + powerOf(id); }, 0); }
  function enemyPower(st){ return Math.round(st.team.reduce(function(s, u){ return s + pow(hero(u.id), u.level, u.mul); }, 0)); }
  function miniHtml(st){ return st.team.map(function(u){ var h = hero(u.id); return '<div class="mini' + (u.boss ? ' boss' : '') + '"><div class="av" style="--el:' + ELC[h.el] + '">' + AV[h.id] + '</div>' + h.name + ' ' + u.level + '</div>'; }).join(''); }

  // ───── 탭 ─────
  var TITLES = { camp: '캠페인', hero: '영웅', tool: '검증 도구' };
  document.querySelector('.nav').addEventListener('click', function(e){
    var b = e.target.closest('[data-tab]'); if (!b) return; showTab(b.dataset.tab);
  });
  function showTab(t){
    ['camp', 'hero', 'tool'].forEach(function(k){ $('tab-' + k).hidden = k !== t; });
    document.querySelectorAll('.nav [data-tab]').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === t); });
    $('topTitle').textContent = TITLES[t]; $('stWrap').hidden = $('idleBtn').hidden = t !== 'camp'; window.scrollTo(0, 0);
  }

  // ───── 캠페인 탭 ─────
  function idleRate(){ return D.campaign.idle.base * Math.pow(D.campaign.idle.growth, S.stage); }
  function idleGold(){ var mins = Math.min(D.campaign.idle.maxHours * 60, (Date.now() - S.idleAt) / 60000); return Math.floor(idleRate() * mins); }
  function renderCampaign(){
    var total = E.stageCount(D);
    if (S.stage >= total){ $('stTitle').textContent = '완료!'; $('stBadges').innerHTML = ''; return; }
    var st = E.stageTeam(D, S.stage);
    $('stTitle').textContent = st.name;
    $('stBadges').innerHTML = st.boss ? '<span class="badge boss">보스</span>' : st.wall ? '<span class="badge">강한 적</span>' : '';
  }
  function renderIdle(){
    var v = idleGold();
    $('idleAmt').textContent = g(v); $('idleBtn').title = '방치 보상 · 분당 ' + Math.round(idleRate()) + ' G · 최대 ' + D.campaign.idle.maxHours + '시간';
    $('idleBtn').disabled = v < 1; $('campDot').hidden = v < 1;
  }
  $('idleBtn').addEventListener('click', function(){ S.gold += idleGold(); S.idleAt = Date.now(); save(); renderAll(); });

  // ───── 영웅 탭 ─────
  var filter = 'all';
  function renderFilters(){
    var keys = ['all'].concat(Object.keys(D.roles));
    $('filters').innerHTML = keys.map(function(k){ return '<button data-f="' + k + '"' + (k === filter ? ' class="on"' : '') + '>' + (k === 'all' ? '전체' : D.roles[k]) + '</button>'; }).join('');
  }
  $('filters').addEventListener('click', function(e){ var b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; renderFilters(); renderHeroes(); });
  function canUp(id){ var lv = S.levels[id]; return lv < D.levelCost.maxLevel && S.gold >= E.levelCost(D, lv); }
  function renderHeroes(){
    var list = D.heroes.filter(function(h){ return S.owned[h.id] && (filter === 'all' || h.role === filter); }).slice()
      .sort(function(a, b){ var ia = S.team.indexOf(a.id) >= 0, ib = S.team.indexOf(b.id) >= 0; return (ib - ia) || (powerOf(b.id) - powerOf(a.id)); });
    var head = '<div class="muted" style="margin-bottom:4px">가진 영웅 ' + ownedIds().length + '명 · 전장 ' + S.team.filter(Boolean).length + ' · 백팩 ' + bagIds().length + '/' + R.bag + '</div>';
    $('hlist').innerHTML = head + (list.length ? '' : '<div class="muted">이 역할의 영웅이 아직 없어요. 스테이지를 깨면 싸운 적 중 1명이 동료가 돼요.</div>') + list.map(function(h){
      var inT = S.team.indexOf(h.id) >= 0, lv = S.levels[h.id], cost = E.levelCost(D, lv), max = lv >= D.levelCost.maxLevel, gr = 1 + D.growth.perLevel * (lv - 1), o = S.owned[h.id], sm = E.starMul(D, o.star);
      var merge = o.star >= R.maxStar ? '최고 별' : '합성 ' + o.pieces + '/' + (R.mergeCount - 1);
      return '<div class="hrow" style="--el:' + ELC[h.el] + '"><span class="av">' + av(h.id) + (inT ? '<em>출전</em>' : '') + '</span>' +
        '<div class="info"><div class="nm">' + h.name + ' ' + stars(o.star) + ' <span class="meta">Lv ' + lv + ' · 코스트 ' + h.cost + '</span></div>' +
        '<div class="meta">' + D.roles[h.role] + ' · ' + D.elements.names[h.el] + ' · ' + (h.range === 'melee' ? '근접' : '원거리') + ' · ' + merge + ' · 전투력 ' + powerOf(h.id).toLocaleString() + '</div>' +
        '<div class="st">체력 ' + Math.round(h.hp * gr * sm).toLocaleString() + ' · 공격 ' + Math.round(h.atk * gr * sm) + ' · 궁극기 ' + ultName(h) + '</div></div>' +
        '<button class="up" data-up="' + h.id + '"' + (max || S.gold < cost ? ' disabled' : '') + '>' + (max ? '최고 레벨' : '레벨업<small>' + g(cost) + '</small>') + '</button></div>';
    }).join('');
    $('heroDot').hidden = !S.team.some(function(id){ return id && canUp(id); });
  }
  $('hlist').addEventListener('click', function(e){
    var up = e.target.closest('[data-up]'); if (!up) return;
    var id = up.dataset.up, c = E.levelCost(D, S.levels[id]);
    if (S.gold >= c){ S.gold -= c; S.levels[id]++; save(); renderAll(); }
  });

  // ───── 편성 화면 ─────
  function openForm(){ showTab('camp'); renderForm(); }
  function renderForm(){
    var done = S.stage >= E.stageCount(D), st = done ? { team: [] } : E.stageTeam(D, S.stage);
    function at(side, i, inner){ var p = POS[side][i]; return '<div class="unit" style="left:' + (100 * p[0] / W) + '%;top:' + (100 * p[1] / H) + '%">' + inner + '</div>'; }
    function foeHtml(u){ if (!u) return ''; var h = hero(u.id); return '<div class="foe' + (u.boss ? ' boss' : '') + '" style="--el:' + ELC[h.el] + '" title="' + h.name + '">' + av(h.id) + '</div><span class="lv">Lv ' + u.level + '</span>'; }
    var bySlot = []; st.team.forEach(function(u){ bySlot[u.slot] = u; });

    function slotHtml(i){
      var id = S.team[i];
      if (!id) return '<button class="slot" data-slot="' + i + '" aria-label="빈 자리">+</button>';
      var h = hero(id);
      return '<button class="slot on" data-slot="' + i + '" style="--el:' + ELC[h.el] + '" title="' + h.name + '">' + av(id) + '</button><span class="lv">' + stars(star(id)) + ' Lv ' + S.levels[id] + '</span>';
    }
    $('field').innerHTML = [0, 1, 2, 3, 4].map(function(i){ return at('A', i, slotHtml(i)); }).join('') +
      [0, 1, 2, 3, 4].map(function(i){ return bySlot[i] ? at('E', i, foeHtml(bySlot[i])) : ''; }).join('');
    var list = D.heroes.filter(function(h){ return S.owned[h.id]; }).slice().sort(function(a, b){ return powerOf(b.id) - powerOf(a.id); });
    $('roster').innerHTML = list.map(function(h){
      var inT = S.team.indexOf(h.id) >= 0;
      return '<button class="chip' + (inT ? ' inteam' : '') + '" data-id="' + h.id + '" title="' + h.name + ' · 코스트 ' + h.cost + '" style="--el:' + ELC[h.el] + '">' + av(h.id) + stars(star(h.id)) + '<span class="lv">' + S.levels[h.id] + '</span><span class="cst">' + h.cost + '</span></button>';
    }).join('');
    var used = usedCost(), c = cap();
    $('fMy').textContent = used + '/' + c; $('costBox').classList.toggle('over', used > c);
    $('fEn').textContent = enemyPower(st).toLocaleString();
    var over = used > c; $('fightBtn').disabled = done || teamSpec().length === 0 || !!S.pending || !!S.offer || over; $('fightBtn').textContent = done ? '캠페인 완료' : S.pending ? '영입할 영웅을 먼저 정해 주세요' : over ? '코스트를 넘었어요' : st.name + ' 전투';
    renderPending();
  }

  // ───── 영입: 백팩이 꽉 찼을 때 고르기 ─────
  function pendHtml(){
    var id = S.pending, h = hero(id), bag = bagIds();
    return '<h2>백팩이 꽉 찼어요</h2><div class="muted">새 영웅 ' + h.name + '(코스트 ' + h.cost + ')을 받으려면 백팩에서 1명을 버려야 해요. 버린 영웅은 레벨과 별이 사라져요.</div>' +
      '<div class="opts"><button class="new" data-keep="0" style="--el:' + ELC[h.el] + '"><span class="ph">' + av(id) + '</span>새 영웅 버리기</button>' +
      bag.map(function(b){ var bh = hero(b); return '<button data-drop="' + b + '" style="--el:' + ELC[bh.el] + '"><span class="ph">' + av(b) + '</span>' + bh.name + ' ' + stars(star(b)) + '<br>Lv ' + S.levels[b] + ' 버리기</button>'; }).join('') + '</div>';
  }
  function renderPending(){ var box = $('pendBox'); box.hidden = !S.pending; if (S.pending) box.innerHTML = pendHtml(); }
  document.addEventListener('click', function(e){
    var k = e.target.closest('[data-keep],[data-drop]'); if (!k || !S.pending) return;
    var id = S.pending;
    if (k.dataset.drop){ var d = k.dataset.drop; delete S.owned[d]; delete S.levels[d]; E.addHero(D, S.owned, id); S.levels[id] = D.startLevel; toast(hero(d).name + ' 대신 ' + hero(id).name + '이(가) 백팩에 들어왔어요'); }
    else toast(hero(id).name + '을(를) 보냈어요');
    S.pending = null; save(); renderAll();
    var rp = $('resPend'); if (rp) rp.remove();
  });
  // ───── 영입 룰렛: 이긴 판의 적들이 오른쪽에서 돌다가 1명에 멈추고, 영입할지 보낼지 골라요 ─────
  function offerNote(id){
    var o = S.owned[id];
    if (o) return o.star >= R.maxStar ? '이미 최고 별이에요' : o.pieces + 1 >= R.mergeCount - 1 ? '받으면 합성! 별 ' + (o.star + 1) + '개가 돼요' : '받으면 합성 조각 ' + (o.pieces + 1) + '/' + (R.mergeCount - 1);
    return bagIds().length >= R.bag ? '새 영웅 · 백팩이 꽉 차서 1명을 버려야 해요' : '새 영웅 · 코스트 ' + hero(id).cost;
  }
  var roulT = 0;
  function showOffer(id){
    var h = hero(id), box = $('roul');
    box.querySelector('.rbox').style.setProperty('--el', ELC[h.el]);
    box.querySelector('.rpic').innerHTML = IMGS[id] ? '' : AV[id];
    box.querySelector('.rpic').style.backgroundImage = IMGS[id] ? 'url(img/s/' + id + '.png)' : 'none';
    box.querySelector('.rname').innerHTML = h.name + (S.owned[id] ? ' ' + stars(star(id)) : '');
    box.querySelectorAll('.rstrip span').forEach(function(sp){ sp.classList.toggle('on', sp.dataset.id === id); });
  }
  function startRoulette(ids, target){
    var box = $('roul'), uniq = ids.filter(function(x, i){ return ids.indexOf(x) === i; });
    box.querySelector('.rstrip').innerHTML = uniq.map(function(x){ return '<span data-id="' + x + '" style="--el:' + ELC[hero(x).el] + '">' + av(x) + '</span>'; }).join('');
    box.hidden = false; box.querySelector('.rbtns').hidden = true; box.querySelector('.rmeta').textContent = '두구두구…';
    var n = uniq.length, ti = uniq.indexOf(target), steps = 14 + ((ti - 14) % n + n) % n, i = 0;
    clearTimeout(roulT);
    (function tick(){
      showOffer(uniq[i % n]);
      if (i >= steps){ box.querySelector('.rmeta').textContent = offerNote(target); box.querySelector('.rbtns').hidden = false; box.querySelector('.rbox').classList.add('pop'); return; }
      var k = i / steps; i++; roulT = setTimeout(tick, 55 + k * k * 320);
    })();
  }
  function decideOffer(take){
    var id = S.offer; if (!id) return;
    S.offer = null; $('roul').hidden = true; $('roul').querySelector('.rbox').classList.remove('pop');
    var html = take ? recruitFrom(id) : '<div class="gain"><div class="muted">' + hero(id).name + '을(를) 보냈어요</div></div>';
    save(); renderAll();
    var gb = $('gainBox'); if (gb) gb.innerHTML = html;
  }
  // 영입 확정. 반환: 결과 화면에 넣을 html
  function recruitFrom(id){
    var h = hero(id), had = !!S.owned[id], msg;
    if (had){
      var k = E.addHero(D, S.owned, id), o = S.owned[id];
      msg = k === 'star' ? '같은 영웅이 모여 합성! ' + stars(o.star) + '이 되었어요' : k === 'max' ? '이미 최고 별이라 더 합성할 수 없어요' : '합성 조각 ' + o.pieces + '/' + (R.mergeCount - 1);
    } else if (bagIds().length >= R.bag){ S.pending = id; msg = '백팩이 꽉 찼어요. 아래에서 골라 주세요'; }
    else {
      E.addHero(D, S.owned, id); S.levels[id] = D.startLevel;
      var free = S.team.indexOf(null);
      if (free >= 0 && usedCost() + h.cost <= cap()){ S.team[free] = id; var re = E.autoFormation(D, S.team.filter(Boolean).map(function(x){ return { id: x, level: S.levels[x], star: star(x) }; }), 99); S.team = [null, null, null, null, null]; re.forEach(function(x){ S.team[x.slot] = x.id; }); msg = '새 동료! 바로 전장에 올렸어요'; }
      else msg = '새 동료! 백팩에 넣었어요';
    }
    return '<div class="gain" style="--el:' + ELC[h.el] + '"><span class="big">' + av(id) + '</span><div><div class="muted">영입</div><b>' + h.name + '</b> <span class="meta">코스트 ' + h.cost + '</span><div class="muted">' + msg + '</div></div></div>' +
      (S.pending ? '<div class="card pend" id="resPend" style="margin-top:10px">' + pendHtml() + '</div>' : '');
  }
  $('roster').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if (!c) return;
    var hid = c.dataset.id, at = S.team.indexOf(hid);
    if (at >= 0) return unequip(at);
    var h = hero(hid), front = h.role === 'tank' || h.role === 'warrior', order = front ? [0, 1, 2, 3, 4] : [2, 3, 4, 0, 1], free = order.filter(function(i){ return !S.team[i]; })[0];
    if (free == null) return toast('전장 5칸이 꽉 찼어요');
    if (usedCost() + h.cost > cap()) return toast('코스트가 모자라요 (' + usedCost() + ' + ' + h.cost + ' > ' + cap() + ')');
    S.team[free] = hid;
    save(); renderForm();
  });
  function unequip(slot){
    if (bagIds().length >= R.bag) return toast('백팩이 꽉 차서 내릴 수 없어요');
    S.team[slot] = null; save(); renderForm();
  }
  $('field').addEventListener('click', function(e){ var b = e.target.closest('.slot.on'); if (!b) return; unequip(+b.dataset.slot); });
  $('autoBtn').addEventListener('click', function(){
    var f = E.autoFormation(D, roster(), cap());
    if (ownedIds().length - f.length > R.bag) return toast('백팩이 꽉 차서 자동 편성을 할 수 없어요');
    S.team = [null, null, null, null, null]; f.forEach(function(x){ S.team[x.slot] = x.id; }); save(); renderForm();
  });
  $('fightBtn').addEventListener('click', startBattle);

  // ───── 전투 ─────
  var cv = $('cv'), ctx = cv.getContext('2d'), W = 480, H = 420, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  var bt = null, speed = 1, acc = 0, logI = 0, last = 0, fxs = [], shots = [], pops = [], banners = [], flash = 0, lunges = {}, curStage = 0, done = false, raf = 0;
  var POS = { A: [[175, 165], [175, 290], [70, 125], [70, 235], [70, 345]] };
  POS.E = POS.A.map(function(p){ return [W - p[0], p[1]]; });
  function posOf(u){ return POS[u.side][u.slot]; }
  function unitByUid(uid){ var all = bt.A.concat(bt.E); for (var i = 0; i < all.length; i++) if (all[i].uid === uid) return all[i]; return null; }

  function startBattle(){
    if (!teamSpec().length || S.stage >= E.stageCount(D)) return;
    curStage = S.stage;
    var st = E.stageTeam(D, curStage);
    bt = E.createBattle(D, teamSpec(), st.team, { seed: (Math.random() * 1e9) | 0, modules: S.modules, record: true });
    logI = 0; acc = 0; fxs = []; shots = []; pops = []; banners = []; lunges = {}; flash = 0; done = false;
    $('bTitle').textContent = st.name + (st.boss ? ' 보스전' : '');
    $('res').hidden = true; $('battleView').hidden = false; $('battleView').scrollTop = 0;
    $('skipBtn').disabled = false;
    cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(loop);
  }
  $('spdBtn').addEventListener('click', function(){ speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; this.textContent = speed + '×'; });
  $('skipBtn').addEventListener('click', function(){ if (!bt || done) return; while (!bt.result) bt.step(); logI = bt.log.length; done = true; draw(0); finishBattle(); });

  function loop(now){
    if (!bt) return;
    var el = Math.min(.1, (now - last) / 1000); last = now;
    if (!bt.result){ acc += el * speed; while (acc >= D.battle.dt && !bt.result){ bt.step(); acc -= D.battle.dt; } }
    while (logI < bt.log.length){ onEvent(bt.log[logI++]); }
    draw(el);
    if (bt.result && !done){ done = true; setTimeout(finishBattle, 700); }
    raf = requestAnimationFrame(loop);
  }
  function onEvent(ev){
    if (ev.kind === 'hit'){
      var a = unitByUid(ev.from), b = unitByUid(ev.to); if (!a || !b) return;
      if (a.range === 'melee') lunges[a.uid] = .18;
      else shots.push({ from: posOf(a), to: posOf(b), t: 0, c: ELC[a.el] });
      var p = posOf(b); pops.push({ x: p[0] + (Math.random() - .5) * 20, y: p[1] - 30, s: '' + ev.amt, c: a.side === 'A' ? '#fff' : '#ffb3a8', life: .7, max: .7, size: ev.amt > a.atk * 2 ? 20 : 14 });
      fxs.push({ x: p[0], y: p[1], t: .15, c: '#fff' });
    } else if (ev.kind === 'heal'){
      var hu = unitByUid(ev.to), hp = posOf(hu); if (ev.amt > 0) pops.push({ x: hp[0], y: hp[1] - 34, s: '+' + ev.amt, c: '#7ee08a', life: .8, max: .8, size: 15 });
    } else if (ev.kind === 'ult'){
      var u = unitByUid(ev.uid); banners.push({ s: u.name + ' · ' + ultName(u.h), side: u.side, life: 1.1, max: 1.1 });
      fxs.push({ x: posOf(u)[0], y: posOf(u)[1], t: .5, c: ELC[u.el], big: 1 });
      if (ev.ult === 'aoe' || ev.ult === 'chain') flash = .25;
    } else if (ev.kind === 'die'){
      var du = unitByUid(ev.uid), dp = posOf(du); for (var i = 0; i < 12; i++){ var a2 = Math.random() * 6.28; fxs.push({ x: dp[0] + Math.cos(a2) * 10, y: dp[1] + Math.sin(a2) * 10, vx: Math.cos(a2) * 80, vy: Math.sin(a2) * 80, t: .5, c: '#888', dot: 1 }); }
    }
  }
  function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function draw(el){
    var bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#26304d'); bg.addColorStop(1, '#1a2a1d');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fillRect(W / 2 - 1, 30, 2, H - 40);
    ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(W / 2 - 40, 8, 80, 26, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '400 16px "Black Han Sans", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.max(0, D.battle.timeLimit - bt.time).toFixed(0) + '초', W / 2, 21);
    if (flash > 0){ flash -= el; ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, flash) + ')'; ctx.fillRect(0, 0, W, H); }
    drawOrder(bt.A, 'A'); drawOrder(bt.E, 'E');
    bt.A.concat(bt.E).forEach(function(u){ drawUnit(u, el); });
    shots = shots.filter(function(s){ s.t += el * 5; if (s.t >= 1) return false; var x = s.from[0] + (s.to[0] - s.from[0]) * s.t, y = s.from[1] + (s.to[1] - s.from[1]) * s.t - Math.sin(s.t * Math.PI) * 20;
      ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(x, y, 4, 0, 6.29); ctx.fill(); return true; });
    fxs = fxs.filter(function(f){ f.t -= el; if (f.t <= 0) return false;
      if (f.dot){ f.x += f.vx * el; f.y += f.vy * el; ctx.globalAlpha = f.t / .5; ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, 6.29); ctx.fill(); ctx.globalAlpha = 1; return true; }
      ctx.globalAlpha = f.t / (f.big ? .5 : .15); ctx.strokeStyle = f.c; ctx.lineWidth = f.big ? 5 : 3; ctx.beginPath(); ctx.arc(f.x, f.y, f.big ? 30 + (1 - f.t / .5) * 30 : 22, 0, 6.29); ctx.stroke(); ctx.globalAlpha = 1; return true; });
    pops = pops.filter(function(p){ p.life -= el; if (p.life <= 0) return false; var k = 1 - p.life / p.max; ctx.globalAlpha = Math.min(1, p.life / p.max * 2);
      ctx.font = '400 ' + p.size + 'px "Black Han Sans", sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(p.s, p.x, p.y - k * 24); ctx.fillStyle = p.c; ctx.fillText(p.s, p.x, p.y - k * 24); ctx.globalAlpha = 1; return true; });
    banners = banners.filter(function(b, i){ b.life -= el; if (b.life <= 0) return false; var y = H - 30 - i * 30;
      ctx.globalAlpha = Math.min(1, b.life / b.max * 3); ctx.fillStyle = b.side === 'A' ? 'rgba(40,70,140,.85)' : 'rgba(140,40,40,.85)'; rr(b.side === 'A' ? 10 : W - 230, y - 13, 220, 26, 10); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '400 14px "Black Han Sans", sans-serif'; ctx.textAlign = 'center'; ctx.fillText(b.s + '!', b.side === 'A' ? 120 : W - 120, y); ctx.globalAlpha = 1; return true; });
  }
  // 상단 공격 순서: 상대가 먼저 노리는 순서대로 (엔진의 공격 대상 규칙과 같은 순서). 1번에 과녁 표시
  function targetOrder(list){
    var tg = S.modules.targeting || D.modules.targeting.pick;
    var al = list.filter(function(u){ return u.alive; }), dead = list.filter(function(u){ return !u.alive; });
    al.sort(function(a, b){
      if ((b.taunt > 0) !== (a.taunt > 0)) return (b.taunt > 0) - (a.taunt > 0);
      if (tg === 'lowest') return a.hp / a.maxHp - b.hp / b.maxHp;
      if (tg === 'random') return a.slot - b.slot;
      return (b.front - a.front) || (a.slot - b.slot);
    });
    return al.concat(dead);
  }
  function drawFace(u, x, y, r, flip){
    var im = IMGS[u.id]; ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.clip(); ctx.fillStyle = '#1b1d30'; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.translate(x, y); if (flip) ctx.scale(-1, 1);
    if (im){ var sw = im.width / 1.5; ctx.drawImage(im, (im.width - sw) / 2, im.height * 0.04, sw, sw, -r, -r, r * 2, r * 2); }
    else { ctx.font = Math.round(r * 1.2) + 'px "Apple Color Emoji","Segoe UI Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(AV[u.id], 0, 1); }
    ctx.restore();
  }
  function drawOrder(list, side){
    var order = targetOrder(list), r = 12, gap = 30, y = 24;
    order.forEach(function(u, i){
      var x = side === 'A' ? 22 + i * gap : W - 22 - i * gap;
      ctx.globalAlpha = u.alive ? 1 : .3;
      drawFace(u, x, y, r, side === 'E');
      ctx.lineWidth = 2; ctx.strokeStyle = ELC[u.el]; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.stroke();
      if (u.alive){ ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - r, y + r + 2, r * 2, 3); ctx.fillStyle = side === 'A' ? '#7ee08a' : '#ff6b6b'; ctx.fillRect(x - r, y + r + 2, r * 2 * u.hp / u.maxHp, 3); }
      if (i === 0 && u.alive){ ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 6.29); ctx.stroke(); }
      ctx.globalAlpha = 1;
    });
  }
  // 전투 유닛: 원 없이 서 있는 전신 그림. 발밑 타원 = 진영 색, 아래에 체력·에너지 막대
  function drawUnit(u, el){
    var p = posOf(u), x = p[0], y = p[1], dir = u.side === 'A' ? 1 : -1, im = IMGS[u.id];
    var S = u.boss ? 108 : 86, foot = y + 30;
    if (lunges[u.uid] > 0){ lunges[u.uid] -= el; x += dir * Math.sin((1 - Math.max(0, lunges[u.uid]) / .18) * Math.PI) * 26; }
    ctx.globalAlpha = u.alive ? 1 : .25;
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(x, foot, S * .34, 8, 0, 0, 6.29); ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = ELC[u.el]; ctx.stroke();
    if (u.shield > 1 && u.alive){ ctx.strokeStyle = 'rgba(127,184,255,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x, foot - S * .45, S * .42, S * .55, 0, 0, 6.29); ctx.stroke(); }
    ctx.save(); ctx.translate(x, foot); if (dir < 0) ctx.scale(-1, 1);
    if (u.energy >= 99.9 && u.alive){ ctx.shadowColor = '#ffd34d'; ctx.shadowBlur = 18; }
    if (im) ctx.drawImage(im, -S / 2, -S + S * .04, S, S);
    else { ctx.font = (u.boss ? 44 : 34) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(AV[u.id], 0, -4); }
    ctx.restore();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var bw = 60, by = foot + 8;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - bw / 2, by, bw, 6);
    ctx.fillStyle = u.side === 'A' ? '#7ee08a' : '#ff6b6b'; ctx.fillRect(x - bw / 2, by, bw * Math.max(0, u.hp / u.maxHp), 6);
    if (u.shield > 1){ ctx.fillStyle = 'rgba(127,184,255,.9)'; ctx.fillRect(x - bw / 2, by, Math.min(bw, bw * u.shield / u.maxHp), 3); }
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - bw / 2, by + 8, bw, 3);
    ctx.fillStyle = '#ffd34d'; ctx.fillRect(x - bw / 2, by + 8, bw * Math.min(1, u.energy / 100), 3);
    ctx.fillStyle = '#d7dbf5'; ctx.font = '700 10px "Gothic A1", sans-serif'; ctx.fillText(u.name + ' Lv' + u.level, x, by + 19);
    var icons = (u.taunt > 0 ? '😠' : '') + (u.slow > 0 ? '❄️' : '') + (u.haste > 0 ? '💨' : '');
    if (icons && u.alive){ ctx.font = '13px sans-serif'; ctx.fillText(icons, x, foot - S - 2); }
    ctx.globalAlpha = 1;
  }
  function closeBattle(){ cancelAnimationFrame(raf); bt = null; $('battleView').hidden = true; }
  function finishBattle(){
    if (!bt) return;
    $('skipBtn').disabled = true;
    var r = bt.finish(), st = E.stageTeam(D, curStage), html = '', reward = 0, gain = '';
    if (r.win){
      reward = Math.round(D.campaign.reward.base * Math.pow(D.campaign.reward.growth, curStage));
      if (curStage === S.stage){ var capBefore = cap(); S.gold += reward; S.stage++; S.offer = st.team[Math.floor(Math.random() * st.team.length)].id; offerIds = st.team.map(function(u){ return u.id; }); gain = '<div id="gainBox"></div>'; if (cap() > capBefore) gain += '<div class="muted" style="margin-top:6px">코스트 상한이 ' + cap() + '(으)로 올랐어요</div>'; }
      html += '<h3 class="win">승리!</h3><div class="muted">' + st.name + ' 클리어 · ' + r.time + '초 · 보상 ' + g(reward) + '</div>' + gain;
    } else html += '<h3 class="lose">' + (r.result === 'timeout' ? '시간 초과' : '패배') + '</h3><div class="muted">' + r.time + '초 · 적 체력 ' + Math.round(r.enemyLeft * 100) + '% 남음. 영웅 탭에서 레벨업하거나 편성을 바꿔 보세요</div>';
    var A = r.units.filter(function(u){ return u.side === 'A'; }), maxD = Math.max.apply(null, A.map(function(u){ return u.dealt; }).concat([1]));
    html += '<table><tr><th>영웅</th><th>가한 피해</th><th>받은 피해</th><th>회복</th><th>궁</th></tr>' + A.map(function(u){
      return '<tr><td>' + AV[u.id] + ' ' + u.name + (u.alive ? '' : ' 💀') + '</td><td>' + u.dealt.toLocaleString() + '<span class="barc" style="width:' + Math.round(30 * u.dealt / maxD) + 'px"></span></td><td>' + u.taken.toLocaleString() + '</td><td>' + u.healed.toLocaleString() + '</td><td>' + u.ults + '</td></tr>'; }).join('') + '</table>';
    var more = S.stage < E.stageCount(D);
    html += '<div class="btns"><button class="go" id="again"' + (more ? '' : ' disabled') + '>' + (r.win ? '다음 스테이지' : '다시 도전') + '</button><button class="ghost" id="toForm"' + (more ? '' : ' disabled') + '>편성</button><button class="ghost" id="toHero">영웅</button></div>';
    $('res').innerHTML = html; $('res').hidden = false; save(); renderAll();
    $('res').scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('again').onclick = function(){ closeBattle(); openForm(); };
    $('toForm').onclick = function(){ closeBattle(); openForm(); };
    $('toHero').onclick = function(){ closeBattle(); showTab('hero'); };
    if (S.offer) setTimeout(function(){ startRoulette(offerIds, S.offer); }, 350);
  }
  var offerIds = [];
  $('rYes').addEventListener('click', function(){ decideOffer(true); });
  $('rNo').addEventListener('click', function(){ decideOffer(false); });

  // ───── 도구 탭 ─────
  function renderMods(){
    $('mods').innerHTML = Object.keys(D.modules).map(function(k){
      var m = D.modules[k], cur = S.modules[k] || m.pick;
      return '<span>' + ({ energy: '에너지', targeting: '공격 대상', element: '상성', synergy: '진영 시너지', healDecay: '회복 감소', startEnergy: '첫 에너지' }[k] || k) + '</span><select data-mod="' + k + '">' +
        Object.keys(m.options).map(function(o){ return '<option value="' + o + '"' + (o === cur ? ' selected' : '') + '>' + m.options[o].name + (o === m.pick ? ' (기본)' : '') + '</option>'; }).join('') + '</select>';
    }).join('');
  }
  $('mods').addEventListener('change', function(e){ var s = e.target.closest('select'); if (!s) return; S.modules[s.dataset.mod] = s.value; save(); });
  $('goldBtn').addEventListener('click', function(){ S.gold += 5000; save(); renderAll(); });
  $('resetBtn').addEventListener('click', function(){ var m = S.modules; S = fresh(); S.modules = m; save(); renderAll(); showTab('camp'); });
  $('simBtn').addEventListener('click', function(){
    $('simBox').textContent = '계산 중…';
    setTimeout(function(){
      var c = E.campaign(D, { seed: (Math.random() * 1e6) | 0, modules: S.modules });
      var walls = D.campaign.walls.map(function(n){ var l = c.log.find(function(x){ return x.stage === n; }), p = c.log.find(function(x){ return x.stage === n - 1; });
        return E.stageName(D, n) + ' ' + (l ? ((l.time - (p ? p.time : 0)) / 3600).toFixed(1) + 'h' : '–'); }).join(' · ');
      $('simBox').innerHTML = '봇 결과: ' + c.cleared + '/' + c.total + ' 클리어, 총 ' + (c.time / 3600).toFixed(1) + '시간 (방치 ' + (c.idleTime / 3600).toFixed(1) + 'h), 도전 ' + c.attempts + '번<br>벽: ' + walls +
          '<br>영입: 새 영웅 ' + c.recruits.new + ' · 합성 조각 ' + c.recruits.merge + ' · 별 상승 ' + c.recruits.star + ' · 백팩 꽉 참 ' + c.recruits.dropped + '번<br>최종: ' +
          Object.keys(c.owned).map(function(id){ return hero(id).name + '★' + c.owned[id].star; }).join(' · ');
    }, 30);
  });

  function renderAll(){ $('goldTag').textContent = g(S.gold); renderCampaign(); renderHeroes(); renderIdle(); renderForm(); }
  renderFilters(); renderAll(); renderMods();
  if (S.offer){ offerIds = [S.offer]; startRoulette(offerIds, S.offer); }
  setInterval(renderIdle, 1000);
})();
</script>
