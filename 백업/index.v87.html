<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전투 테스트베드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12131f; --panel:#1c1e30; --panel-2:#262940; --line:#363a5a; --text:#eef0fa; --muted:#a3a8c6;
  --gold:#ffd34d; --green:#7ee08a; --red:#ff6b6b; --blue:#7fb8ff;
  --display:'Black Han Sans','Gothic A1',sans-serif; --body:'Gothic A1',system-ui,sans-serif;
  --navH:64px; --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100%;position:relative;background:radial-gradient(circle at 50% 0,#252a4a 0,transparent 55%)}

/* 상단 바 */
.top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top,0px)) 16px 10px;background:rgba(18,19,31,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font:400 19px var(--display);margin-right:auto}
.tag{font:400 15px var(--display);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--gold)}

/* 탭 내용 */
.page{padding:12px 16px calc(var(--navH) + var(--sb) + 20px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font:400 17px var(--display);display:flex;align-items:center;gap:8px}
.card h2 small{font:600 12px var(--body);color:var(--muted);margin-left:auto}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font:700 11px var(--body);padding:2px 8px;border-radius:8px;background:#5a2b2b;color:#ffb3a8}
.badge.boss{background:#5a4a1b;color:var(--gold)}

/* 하단 탭 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:4;background:#171828;border-top:1px solid var(--line);padding-bottom:var(--sb)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--navH)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 11px var(--body);color:var(--muted);position:relative}
.nav button .i{font-size:22px;line-height:1;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--gold)}
.nav button.on .i{filter:none;opacity:1}
.nav button.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.dot{position:absolute;top:10px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--red)}

/* 캠페인 */
.stageCard{text-align:center;padding:18px 14px}
.chap{font:700 12px var(--body);color:var(--muted)}
.bigStage{font:400 44px/1.1 var(--display);margin:2px 0 6px}
.enemies{display:flex;gap:6px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
.mini{width:52px;text-align:center;font-size:10px;color:var(--muted)}
.mini .av{width:46px;height:46px;border-radius:50%;margin:0 auto 2px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#2a2d48;border:3px solid var(--el)}
.mini.boss .av{box-shadow:0 0 12px var(--gold)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:12px;background:var(--panel-2);border-radius:12px;padding:8px 12px}
.vs b{font:400 18px var(--display)} .vs .me{color:var(--green)} .vs .them{color:#ff9a8a;text-align:right}
.vs span{font-size:11px;color:var(--muted)}
.go{font:400 20px var(--display);padding:14px 22px;border-radius:14px;border:0;background:linear-gradient(180deg,#ffdc6e,#e3a21a);color:#2a1d05;box-shadow:0 4px 0 #8a5a0a;width:100%}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5a0a}
.go:disabled{filter:grayscale(1);opacity:.5}
.ghost{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-size:13px;font-weight:700}
.shdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stName{font:400 19px var(--display);display:flex;align-items:center;gap:6px;color:var(--gold);white-space:nowrap}
.top{gap:6px}
.top h1{margin-right:0!important;font-size:17px;white-space:nowrap}
.top .tag,.top .idleChip{white-space:nowrap;flex:none}
.top .tag{padding:5px 9px;font-size:14px}
.top .badge{font-size:10px;padding:1px 5px}
.stName{min-width:0;overflow:hidden}
.top .sp{flex:1}
.top .idleChip{margin-left:0;padding:5px 10px;font-size:13px}
.top .idleChip b{font-size:13px}
.vsbar .me.over{color:var(--red)}
.vsbar .p{white-space:nowrap}
.idleChip{margin-left:auto;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid #4e8a4e;background:#25402a;font-size:16px}
.idleChip b{font:400 15px var(--display);color:var(--gold)}
.idleChip:disabled{opacity:.5}
.frow{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.frow .ffilter{margin:0;flex:1}
.frow .ghost{flex:none;padding:8px 12px}
.fightWrap{position:sticky;bottom:calc(var(--navH) + var(--sb) + 10px);margin-top:14px;z-index:2}
.chest{display:flex;align-items:center;gap:12px}
.chest .ic{font-size:38px}
.chest b{display:block;font:400 22px var(--display);color:var(--gold)}
.chest .ghost{margin-left:auto;background:#3a6a3a;border-color:#4e8a4e;color:#d9ffd4}
.chest .ghost:disabled{background:var(--panel-2);border-color:var(--line);color:var(--muted)}
.prog{height:8px;border-radius:4px;background:#0e0f1a;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#e3a21a,#ffdc6e)}

/* 영웅 탭 */
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.filters button{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:700 12px var(--body);color:var(--muted)}
.filters button.on{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
.hlist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.hrow .av{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;background:#1b1d30;border:3px solid var(--el);position:relative}
.hrow .av em{position:absolute;bottom:-4px;right:-6px;font:700 9px var(--body);font-style:normal;background:var(--gold);color:#2a1d05;border-radius:6px;padding:0 4px}
.hrow .info{flex:1;min-width:0}
.hrow .nm{font:400 15px var(--display)}
.hrow .meta{font:700 11px var(--body);color:var(--muted)}
.hrow .st{font-size:11px;color:#c9cdfa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{flex:none;width:86px;padding:8px 4px;border-radius:12px;border:0;background:#3a6a3a;color:#d9ffd4;font:700 12px/1.2 var(--body)}
.up small{display:block;font-weight:600;font-size:11px;color:var(--gold)}
.up:disabled{background:#33354c;color:#77799a}
.up:disabled small{color:#77799a}

/* 편성 (전체 화면) */
.sheet{position:fixed;inset:0;z-index:6;background:var(--bg);overflow:auto}
.sheet .in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#252a4a 0,transparent 55%)}
.shead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top,0px)) 12px 10px;background:rgba(18,19,31,.94);border-bottom:1px solid var(--line)}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:18px}
.shead .t{font:400 18px var(--display);margin-right:auto}
.sbody{padding:10px 8px;flex:1}
.sfoot{position:sticky;bottom:0;padding:10px 16px calc(10px + var(--sb));background:rgba(18,19,31,.94);border-top:1px solid var(--line)}
.vsbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 4px 8px}
.vsbar .p{font:400 20px var(--display)} .vsbar .me{color:var(--green)} .vsbar .them{color:#ff9a8a;text-align:right}
.vsbar .vs{font:400 30px var(--display);color:var(--gold);text-shadow:0 3px 0 #7a4a00;background:none;padding:0;margin:0;display:block}
.field{position:relative;aspect-ratio:480/380;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#26304d,#1a2a1d)}
.field{isolation:isolate} /* 편성 유닛의 z-index가 전투 화면 위로 새어 나오지 않게 */
.field{background:url(img/p/bg_field.png) 50% 100% / 100% auto no-repeat,#b8a0a6;image-rendering:pixelated} /* 전투 캔버스와 같은 자리: 너비 100%, 아래 맞춤 */
.av.pix,.rpic{image-rendering:pixelated}
.unit{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.slot,.foe{width:calc(var(--u,72px) * .6);height:calc(var(--u,72px) * .6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;padding:0;position:relative}
.slot{border:2px dashed rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:rgba(255,255,255,.35);font-size:22px}
.slot.on{border:3px solid var(--el);background:#232845;color:inherit;font-size:28px}
.foe{border:3px solid var(--el);background:#3a1f28}
.foe.boss{width:68px;height:68px;box-shadow:0 0 14px var(--gold)}
.foe .av{transform:scaleX(-1)}
.unit .lv{margin-top:-6px;font:700 10px var(--body);color:var(--text);background:rgba(0,0,0,.75);border-radius:6px;padding:0 6px;position:relative}
.ffilter{display:flex;gap:6px;margin:12px 0 8px;overflow-x:auto}
.ffilter button{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font:700 11px var(--body);color:var(--muted);padding:0}
.ffilter button.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 2px rgba(255,211,77,.25)}
.ffilter button .d{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto;background:var(--el)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,52px);gap:6px;justify-content:center}
.chip{aspect-ratio:1;border:2px solid var(--el);background:#1b1d30;border-radius:12px;padding:0;display:flex;align-items:center;justify-content:center;position:relative;font-size:24px}
.chip .lv{position:absolute;top:2px;right:4px;font:700 9px var(--body);color:var(--text);text-shadow:0 1px 2px #000}
.chip .nm{position:absolute;bottom:2px;left:0;right:0;text-align:center;font:700 9px var(--body);color:var(--muted)}
.chip.inteam::before{content:'';position:absolute;inset:0;border-radius:10px;background:rgba(0,0,0,.55)}
.chip.inteam::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--green);font:800 30px var(--body);text-shadow:0 2px 0 #000}

/* 초상화 이미지 (전신 그림의 얼굴·상체 쪽을 원 안에 보여줘요) */
.av.pic{display:block;width:100%;height:100%;border-radius:inherit;background-repeat:no-repeat;background-size:170%;background-position:50% 40%;font-size:0;image-rendering:pixelated} /* 새 36px 그림은 머리 위가 비어 있어서 얼굴 쪽(위에서 40%)을 크게 보여줘요 */
.slot .av.pic,.foe .av.pic,.hrow .av .pic{border-radius:50%}
.chip .av.pic{border-radius:10px}
/* 편성 화면의 전장: 원 대신 서 있는 전신 그림, 발밑 타원 = 진영 색 */
.slot.on{touch-action:none;cursor:grab}
.slot.on,.foe{width:var(--u,72px);height:var(--u,72px);border:0;border-radius:0;background:none;box-shadow:none;align-items:flex-end}
.foe.boss{width:calc(var(--u,72px) * 4 / 3);height:calc(var(--u,72px) * 4 / 3);box-shadow:none;filter:drop-shadow(0 0 8px var(--gold))}
.slot.on::after,.foe::after{content:'';position:absolute;left:18%;right:18%;bottom:-2px;height:8px;border-radius:50%;background:rgba(0,0,0,.3);z-index:-1} /* 발밑은 옅은 그림자만 */
.slot.on .av.pic,.foe .av.pic{border-radius:0;background-size:contain;background-position:50% 100%}
/* 등급 외곽선 (코스트 1 흰색 · 2 파랑 · 3 보라) */
.slot.on .av.pic,.foe .av.pic,.rpic{--gcs:color-mix(in srgb,var(--gc,#fff) 70%,transparent);filter:drop-shadow(1px 0 0 var(--gcs)) drop-shadow(-1px 0 0 var(--gcs)) drop-shadow(0 1px 0 var(--gcs)) drop-shadow(0 -1px 0 var(--gcs))} /* 등급 외곽선: 가장 얇게, 70% 진하기 */
.slot.on .av:not(.pic),.foe .av:not(.pic){font-size:34px}
.unit{z-index:0}
.field .unit{transform:translate(-50%,-100%)} /* 발밑을 (x, y + OFF + 26)에 맞춰요: 전투 캔버스와 같은 기준 */
.unit .lv{margin-top:4px}
.chip.spare{border-style:dashed;touch-action:none;cursor:grab}
.chip .mat{position:absolute;bottom:2px;left:0;right:0;text-align:center;font:800 9px var(--body);color:#2a1d05;background:var(--gold);border-radius:0 0 9px 9px;z-index:1}
.dragGhost{position:fixed;width:52px;height:52px;z-index:30;pointer-events:none;opacity:.9;transform:scale(1.1)}
.mergeTarget{outline:3px solid var(--gold);outline-offset:2px;border-radius:12px;animation:mt .6s ease-in-out infinite alternate}
@keyframes mt{to{outline-color:rgba(255,211,77,.3)}}
.chip .cst{position:absolute;bottom:2px;left:3px;font:800 9px var(--body);color:#2a1d05;background:var(--gold);border-radius:5px;padding:0 3px;z-index:1}
.chip .lv{z-index:1}
.stars{color:var(--gold);letter-spacing:-2px;font-size:10px;text-shadow:0 1px 2px #000}
.chip .stars{position:absolute;top:1px;left:3px;z-index:1}
.capRow{display:flex;justify-content:space-between;font:700 12px var(--body);color:var(--muted);margin:10px 2px 0}
.capRow b{color:var(--text)} .capRow b.over{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(var(--navH) + var(--sb) + 80px);transform:translateX(-50%);z-index:9;background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font:700 13px var(--body);pointer-events:none;max-width:90%;text-align:center}
.gain{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px;border-radius:12px;background:var(--panel-2)}
.gain .big{width:64px;height:64px;border-radius:50%;border:3px solid var(--el);flex:none;overflow:hidden;background:#1b1d30;display:flex;align-items:center;justify-content:center;font-size:30px}
.gain b{font:400 17px var(--display)}
.pend{border-color:var(--gold)}
.pend .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:10px}
.pend .opts button{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:6px 4px;font:700 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:4px}
.pend .opts .ph{width:44px;height:44px;border-radius:50%;border:2px solid var(--el);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;background:#1b1d30}
.pend .opts button.new{border-color:var(--gold)}

/* 영입 룰렛 (오른쪽에서 밀려 들어와요) */
.roul{position:absolute;inset:0;z-index:800;background:rgba(0,0,0,.5);display:flex;justify-content:flex-end;align-items:center}
.rbox{--el:var(--gold);width:260px;margin-right:110px;background:var(--panel);border:3px solid var(--el);border-radius:20px;padding:12px;text-align:center;animation:rin .35s ease-out;box-shadow:0 0 24px rgba(0,0,0,.6)}
.rbox.pop{animation:rpop .35s ease-out}
@keyframes rin{from{transform:translateX(130%)}}
@keyframes rpop{50%{transform:scale(1.06)}}
.rt{font:700 12px var(--body);color:var(--muted)}
.rpic.loot img.lic{width:96px;height:96px;image-rendering:pixelated}
.rstrip span img.lic{width:24px;height:24px;image-rendering:pixelated}
/* 전리품 종류 꼬리표와 띠 칸 모양: 영웅은 진영 색 테두리, 스킬은 하늘색, 골드는 금색 */
.ltag{display:inline-block;margin-left:6px;padding:1px 8px;font:400 12px var(--display);color:#17141d;background:#d9dde8;vertical-align:1px}
.hud .lifeit.lhit{animation:lhit .4s steps(4)} @keyframes lhit{0%,100%{transform:none}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.hud .lifeit.lhit img{filter:brightness(1.8)}
/* 전장 아래 띠: 캐릭터가 닿지 않는 자리 (발밑 y는 arena.yMax까지) */
/* 왼쪽 백팩 칸을 뺀 폭만큼 HUD와 전장이 넓어져요 (960×540 무대를 꽉 채움: 전장 840×467) */
.abar{position:absolute;left:14px;right:14px;bottom:12px;height:48px;z-index:6;display:flex;align-items:center;gap:8px;pointer-events:none}
.abar > *{pointer-events:auto}
#tab-camp.busy .abar{display:none}
.abtn{position:relative;flex:none;height:44px;width:48px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0;border:0;background:#3b3546;color:#f3e6c4;font:400 13px var(--display);cursor:pointer;box-shadow:inset 0 0 0 3px #17141d,inset 0 5px 0 -2px #5d5470}
.abtn img{width:32px;height:32px;image-rendering:pixelated;display:block}
.abtn:active{transform:translateY(2px)}
.abtn.on{box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 5px #ffd34d}
.abtn.shopb{margin-left:auto}
.abtn .dot{top:4px;right:4px}
.bagdrawer.bagcol{position:relative;width:auto;flex:none;max-width:0;overflow:hidden;transition:max-width .28s steps(7)}
.bagdrawer.open{max-width:360px}
.bagdrawer .bagin{position:static;inset:auto;display:block;overflow:visible;padding:3px 4px!important}
.bagdrawer .roster{display:flex!important;flex-direction:row!important;gap:4px}
.bagdrawer .chip{width:40px!important;height:40px!important}
.enrage{position:absolute;left:50%;top:48px;transform:translateX(-50%);z-index:6;padding:2px 8px;background:rgba(120,24,24,.85);color:#ffd7cf;font:400 12px var(--display);box-shadow:inset 0 0 0 2px #17141d;pointer-events:none;animation:enr 1s steps(2) infinite}
.enrage[hidden]{display:none} @keyframes enr{50%{opacity:.6}}
.gover{position:absolute;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;background:rgba(10,8,14,.72)}
.gover[hidden]{display:none}
.gobox{min-width:220px;padding:18px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;background:#2a2533;color:#f3e6c4;box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 5px #c84a4a}
.gobox b{font:400 28px var(--display);color:#ff8a80;text-shadow:0 2px 0 #17141d}
.gobox .gost{font:600 13px var(--body);color:#c9bfae}
.gobox .go{padding:10px 26px;font-size:16px}
.gover.ll{background:rgba(10,8,14,.45)}
.gover.ll .gobox{position:relative;box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 5px #ffd34d}
.gover.ll .gobox b{color:#ffd34d}
.gover.ll .llx{position:absolute;right:8px;top:8px}
.gover.ll .go:disabled{background:#6a6272;color:#cfc6d8}
.ltag.s{background:#7fd8ff} .ltag.g{background:#f2b53a} .ltag.m{background:#a77bff}
img.mni{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px;margin-right:1px} /* 16px 원본 1배 */
.stile .pm{display:flex;align-items:center;justify-content:center;gap:2px;width:100%;margin-top:-3px;padding:1px 0;background:#1d1a24;font:400 12px var(--display);color:#d9c6ff}
.stile .pm.no{color:#ff8a80}
.stile .pr.mana{background:#3a2a5c;color:#e3d2ff;box-shadow:inset 0 0 0 1px #6b3fc4}
.stile .pr.mana.no{color:#ff8a80}
.shopPop .go.mana:not(:disabled){background:#7b52d6!important;color:#f6efff!important}
.stile.up{position:relative} .stile.up::before{content:'▲';position:absolute;right:4px;top:3px;font:400 10px var(--display);color:#9fe07a;text-shadow:0 1px 0 #17141d;z-index:2}
.stile .pm img.mni{width:16px;height:16px}
.rstrip > span{background:#2a2533!important;box-shadow:inset 0 0 0 2px var(--el)}
.rstrip span.on{box-shadow:inset 0 0 0 2px var(--el),0 0 0 2px #f3e6c4!important}
.rpic.loot{display:flex;align-items:center;justify-content:center}
.gain .big img.lic{width:48px;height:48px;image-rendering:pixelated}
.rpic{height:180px;background:no-repeat 50% 100%/contain;display:flex;align-items:center;justify-content:center;font-size:84px}
.rname{font:400 22px var(--display);margin-top:4px}
.rmeta{min-height:18px}
.rstrip{display:flex;justify-content:center;gap:4px;margin:8px 0 2px;flex-wrap:wrap}
.rstrip span{width:30px;height:30px;border-radius:50%;border:2px solid var(--el);overflow:hidden;opacity:.45;display:flex;align-items:center;justify-content:center;font-size:15px;background:#1b1d30}
.rstrip span .av.pic{background-size:170%;background-position:50% 40%}
.rstrip span.on{opacity:1;box-shadow:0 0 0 2px var(--gold)}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rbtns .go{font-size:17px;padding:10px 6px}
.rbtns .again{grid-column:1 / -1;border-color:var(--gold);color:var(--gold)}
.rbtns .again:disabled{opacity:.45}

/* 상점·스킬 */
.skl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.skl .s{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font:700 11px var(--body)}
.skl .s .ic{font-size:26px;display:block;height:48px;line-height:48px}
.ski{width:48px;height:48px;image-rendering:pixelated;display:block;margin:0 auto} /* 24px 픽셀 아이콘의 2배 */
.skl .s.empty{color:var(--muted);border-style:dashed}
.stock{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px}
.item .ic{font-size:30px;width:48px;text-align:center;flex:none}
.item .info{flex:1;min-width:0}
.item b{font:400 15px var(--display)}
.item .buy{flex:none;width:84px}
.item.sold{opacity:.45}

/* 전투 */
/* 전장 칸 하나에서 편성과 전투를 함께 보여줘요 (레이아웃은 그대로, 안의 그림만 바뀜) */
.arena{position:relative;flex:1;min-width:0}
.stg{position:absolute;top:2.5%;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;z-index:400}
.stg span{min-width:24px;height:22px;padding:0 4px;border-radius:7px;background:rgba(0,0,0,.55);color:#fff;font:400 13px/22px var(--display);text-align:center}
.stg span.done{background:rgba(40,60,40,.8);color:#9fd89a}
.stg span.boss{background:rgba(140,40,40,.85);font-size:12px}
.stg span.cur{background:var(--gold);color:#2a1d05;height:28px;line-height:28px;font-size:17px;min-width:30px;box-shadow:0 0 10px var(--gold)}
#tab-camp{padding-left:8px;padding-right:8px}
.camp3{display:flex;gap:6px;align-items:stretch}
.bagcol,.btncol{flex:none;width:50px;display:flex;flex-direction:column;gap:6px}
.bagcol{position:relative} /* 높이는 가운데 전장에 맞추고, 넘치면 백팩만 스크롤 */
.bagin{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;gap:6px}
.coltit{font:700 10px var(--body);color:var(--muted);text-align:center}
.bagcol .roster{display:flex;flex-direction:column;gap:6px}
.bagcol .chip{width:48px;height:48px;flex:none}
.sbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font:700 10px var(--body);color:var(--text);padding:0}
.sbtn span{font-size:18px;line-height:1}
.sbtn:disabled{opacity:.35}
.arena .field{margin:0}
.arena canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:16px;border:1px solid var(--line)}
.bctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:3}
.bctl .ghost{padding:5px 10px;font-size:12px;background:rgba(18,19,31,.8)}
.bres{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:min(260px,80%);background:rgba(18,19,31,.92);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.bres h3{margin:0;font:400 26px var(--display)} .bres h3.win{color:var(--gold)} .bres h3.lose{color:var(--red)}
.bres .gain{margin-top:8px;text-align:left}
.bres .go{margin-top:10px;font-size:16px;padding:10px}
.busy .roster,.busy #autoBtn{pointer-events:none;opacity:.5}
.stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.res h3{margin:0;font:400 30px var(--display)}
.res h3.win{color:var(--gold)} .res h3.lose{color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.barc{display:inline-block;height:6px;border-radius:3px;background:var(--gold);vertical-align:middle;margin-left:4px}
.btns{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:12px}
.btns .go{font-size:17px;padding:12px 8px}

/* 도구 */
select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:13px;width:100%}
.mods{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:13px}
/* ───── 가로 무대 960x540: 화면 크기에 맞춰 통째로 키우고 줄여요 ───── */
html,body{overflow:hidden;background:#0b0c14}
.app{position:fixed;left:0;top:0;width:960px;height:540px;max-width:none;margin:0;min-height:0;transform-origin:0 0;overflow:hidden;background:radial-gradient(circle at 50% 0,#252a4a 0,var(--bg) 60%);border-radius:0}
.top{position:absolute;left:0;right:0;top:0;height:44px;padding:0 14px}
.nav{position:absolute;bottom:0;padding-bottom:0}
.nav .in{max-width:none;height:46px}
.page{position:absolute;left:0;right:0;top:0;bottom:0;overflow-y:auto;padding:10px 14px}
#tab-camp{padding:8px;overflow:hidden}
.camp3{height:100%;gap:8px}
.bagcol{width:64px}
.bagcol .chip{width:56px;height:56px}
.btncol{width:96px}
.sbtn{height:auto;flex:1;max-height:62px;font-size:12px}
.sbtn span{font-size:20px}
.sbtn{position:relative}
.sbtn .dot{top:6px;right:8px}
.backBtn{position:absolute;left:10px;top:8px;z-index:50;padding:6px 12px;font-size:13px}
.page:not(#tab-camp){padding-top:48px}
.btncol .idleChip{margin:0;border-radius:12px;padding:0;gap:1px;flex-direction:column;justify-content:center;border:1px solid #4e8a4e;background:#25402a;font-size:11px}
.btncol .idleChip b{font:400 12px var(--display);color:var(--gold)}
/* 승산 표시: 유리(초록) · 팽팽(노랑) · 불리(빨강). 숫자는 보여 주지 않아요 */
.btncol .wfc{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:5px;height:20px;font:400 12px var(--display);color:#f3e6c4;background:rgba(23,20,29,.6);box-shadow:inset 0 0 0 2px #17141d}
.btncol .wfc[hidden]{display:none}
.btncol .wfc:not([hidden]) + .go{margin-top:4px}
.wfc i,.bnext i.wdot{display:inline-block;width:8px;height:8px;box-shadow:0 0 0 2px #17141d;background:var(--wc,#888)}
.bnext i.wdot{margin-left:5px;vertical-align:0}
.wfc.w-g,.wdot.w-g{--wc:#5fcf6a} .wfc.w-y,.wdot.w-y{--wc:#ffd34d} .wfc.w-r,.wdot.w-r{--wc:#ff6b6b}
.btncol .go{margin-top:auto;font-size:15px;padding:12px 4px;line-height:1.2}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.arena{flex:none;width:100%;aspect-ratio:720/400;display:block}
.arena .field{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
.hud .hi{width:32px;height:32px;image-rendering:pixelated;display:block}
.hud{display:flex;align-items:center;justify-content:center;gap:4px;height:40px;padding:0 10px;border-radius:10px;background:#1a1b2c;border:2px solid #34375a;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.hud .it{display:flex;align-items:center;gap:6px;padding:0 12px;font:400 17px var(--display);color:#f3e6c4;white-space:nowrap}
.hud .it + .it{border-left:2px solid #34375a}
.hud .it i{font-style:normal;font-size:16px}
.hud .it.warn{color:var(--red)}
.arena .field{width:100%}
.field{aspect-ratio:720/400}
#pendBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:600;width:min(560px,80%);max-height:90%;overflow:auto;margin:0;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.fightWrap{display:none}
.rotateHint{position:fixed;left:0;right:0;bottom:6px;text-align:center;color:var(--muted);font:700 12px var(--body);z-index:50;pointer-events:none}

/* 스킬 막대: 왼쪽 위 = 내 스킬, 오른쪽 위 = 적 스킬 (24px 아이콘 2배) */
.skbar{position:absolute;top:14px;display:flex;gap:6px;z-index:4}
.skbar.a{left:14px} .skbar.e{right:14px;flex-direction:row-reverse}
.skc{position:relative;width:54px;height:54px;padding:3px;border:0;background:#2a2533;cursor:help;
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 5px #5d5470}
.skc.E{box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 5px #c84a4a;background:#3a1f28}
.skc img{width:48px;height:48px;image-rendering:pixelated;display:block}
.skc .emo{display:block;font-size:26px;line-height:48px;text-align:center}
.skc .cd{position:absolute;left:3px;right:3px;top:3px;height:0;background:rgba(10,8,14,.62);pointer-events:none}
.skc b{position:absolute;left:0;right:0;bottom:-1px;font:400 10px var(--display);color:#f3e6c4;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000;text-align:center}
.skc.fire{animation:skfire .45s ease-out}
@keyframes skfire{0%{filter:brightness(2.2)}100%{filter:none}}
.tip{position:absolute;z-index:900;max-width:280px;padding:10px 12px;background:#2a2533;color:#f3e6c4;font:400 12px/1.45 var(--body);pointer-events:none;
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 5px #f2b53a}
.tip.e{box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 5px #c84a4a}
.tip b{display:block;font:400 15px var(--display);margin-bottom:2px} .tip small{font:600 11px var(--body);color:#c9bfd8}
.skl .s{cursor:help}

/* 상점: 왼쪽 칸(아이콘 + 값), 오른쪽 정보와 구매 버튼 */
/* 상점: 전장 오른쪽에 붙는 반 팝업 (위쪽 줄·팀 스킬·백팩은 그대로 보여요) */
.shopPop{position:absolute;right:8px;top:60px;max-height:calc(100% - 68px);overflow:auto;width:300px;z-index:25;display:flex;flex-direction:column;gap:7px;padding:10px 12px 12px;background:#3b3546;color:#f3e6c4;
  box-shadow:inset 0 0 0 3px #17141d,inset 0 6px 0 -3px #5d5470,0 4px 0 rgba(10,8,14,.35);clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.shopPop[hidden]{display:none}
.spHead{display:flex;align-items:center;gap:8px;font:400 16px var(--display);text-shadow:0 2px 0 #17141d}
.spHead .sgold{float:none;margin-left:auto}
.spX{width:26px;height:26px;padding:0;border:0;background:#2a2533;color:#f3e6c4;font:400 14px var(--display);cursor:pointer;box-shadow:inset 0 0 0 2px #17141d}
.shopPop .srow{gap:6px;flex-wrap:wrap;margin:0;flex-direction:column;align-items:stretch}
.srow2{display:flex;gap:6px;align-items:flex-start;padding:4px;flex-wrap:wrap}
.srow2 .rowic{align-self:center}
.shopPop .stile .pr{height:20px;box-sizing:border-box} /* 품절 칸도 다른 칸과 같은 높이 */
.srow2.m{background:rgba(107,63,196,.22);box-shadow:inset 0 0 0 1px rgba(167,123,255,.35)}
.srow2 .rowic{width:16px;flex:none;display:flex;justify-content:center}
.spRe{display:inline-flex;align-items:center;gap:3px;height:26px;padding:0 6px 0 3px;border:0;background:#2a2533;color:#f3e6c4;font:400 13px var(--display);cursor:pointer;box-shadow:inset 0 0 0 2px #17141d}
.spRe img{width:24px;height:24px;image-rendering:pixelated;display:block}
.spRe.sel{box-shadow:inset 0 0 0 2px #f3e6c4} .spRe.no{color:#ff8a80} /* 상품이 5~6개로 늘어도 줄바꿈해서 들어가요 (한 줄 4칸) */
.shopPop .srow .sep{display:none}
.shopPop .stile[data-sel="reroll"]{background:#241f2c}
.spHint{font:600 10px var(--body);color:#8f8679;text-align:center}
/* 상품·내 스킬 설명: 상점 패널 왼쪽, 보이는 전장 쪽에 작게 */
.shopInfo{position:absolute;right:316px;top:132px;width:236px;z-index:25;display:flex;flex-direction:column;gap:5px;padding:8px;background:rgba(34,30,43,.94);color:#f3e6c4;box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 4px #5d5470;pointer-events:none}
.shopInfo[hidden]{display:none}
.shopInfo .sname{min-height:0;padding:4px 6px;font-size:14px;background:#2a2533}
.shopInfo .sdesc{flex:none;padding:5px 6px;font-size:11px;line-height:1.5;background:none;box-shadow:none}
.shopInfo .sdesc .odds{font-size:10px;margin-top:4px}
.shopPop .stile{width:60px;padding:6px 4px;gap:4px}
.shopPop .stile .pr{font-size:12px;padding:2px 0}
.shopPop .sname{min-height:0;padding:6px 8px;font-size:15px}
.shopPop .sdesc{padding:7px 8px;font-size:12px;line-height:1.5}
.shopPop .sdesc .odds{font-size:10px}
.shopPop .go{padding:9px!important;font-size:15px!important}
.arena.shopping #skA .skc{cursor:pointer}
#skA .skc.shopsel{box-shadow:inset 0 0 0 2px #17141d,inset 0 0 0 4px #f3e6c4!important}
.sbtn.on{filter:brightness(1.2);box-shadow:inset 0 0 0 3px #ffd34d!important}
.shopWrap{display:flex;gap:12px;width:100%;max-width:900px;height:100%;max-height:440px}
.shopL,.shopR{background:#3b3546;color:#f3e6c4;padding:16px;clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);box-shadow:inset 0 0 0 3px #17141d,inset 0 7px 0 -3px #5d5470,inset 0 -7px 0 -3px #17141d}
.shopL{flex:1.5;display:flex;flex-direction:column;gap:8px}
.shopR{flex:1;display:flex;flex-direction:column;gap:10px}
.sgt{font:400 16px var(--display);text-shadow:0 2px 0 #17141d} .sgt small{font:600 11px var(--body);color:#c9bfd8;margin-left:6px}
.srow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-bottom:6px}
.srow .sep{width:3px;background:#17141d;margin:4px 4px}
.stile{width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;border:0;background:#2a2533;color:#f3e6c4;cursor:pointer;
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);box-shadow:inset 0 0 0 3px #17141d,inset 0 6px 0 -3px #4a4458}
.stile .ic{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:30px}
.stile .ic .ski{width:48px;height:48px}
.stile .pr{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:3px 0;background:#1d1a24;font:400 14px var(--display);color:#f3e6c4}
.stile .pr img{width:16px;height:16px;image-rendering:pixelated}
.stile .pr.no{color:#ff8a80}
.stile.sel{box-shadow:inset 0 0 0 3px #f3e6c4,inset 0 0 0 5px #17141d}
.stile.sold{opacity:.45}
.stile.empty{opacity:.5;cursor:default}
.sname{min-height:36px;padding:8px 10px;background:#2a2533;font:400 18px var(--display);box-shadow:inset 0 0 0 3px #17141d}
.sname small{font:600 11px var(--body);color:#c9bfd8;margin-left:4px}
.sdesc{flex:1;padding:10px;background:#2a2533;font:500 13px/1.6 var(--body);box-shadow:inset 0 0 0 3px #17141d;overflow:auto}
.sdesc .hint{color:#c9bfd8;font-size:12px}
.shopR .go,.shopPop .go{width:100%;font-size:17px;padding:12px;background:#f2b53a;color:#3a2208;border:0;border-radius:0;font-family:var(--display);clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);box-shadow:inset 0 0 0 3px #5a3a0c,inset 0 6px 0 -3px #ffe08a,inset 0 -8px 0 -3px #9a6416}
.shopR .go:active:not(:disabled),.shopPop .go:active:not(:disabled){transform:translateY(2px)}
.shopR .go:disabled,.shopPop .go:disabled{background:#6a6272;color:#cfc6d8;text-shadow:none;filter:none;opacity:1}

/* 영입 카드: 결과 한 줄과 카드 안 백팩 고르기 */
.rres{margin-top:8px;padding:8px;background:#2a2533;color:#f3e6c4;font:600 12px/1.5 var(--body);box-shadow:inset 0 0 0 3px #17141d}
.rpend{margin-top:8px;max-height:220px;overflow:auto;text-align:left;color:#f3e6c4}
.rpend h2{font:400 15px var(--display);margin:0 0 4px} .rpend .muted{font-size:11px}
.rpend .opts{grid-template-columns:repeat(3,1fr)}
.rbtns [hidden]{display:none!important}
.rbtns{grid-template-columns:1fr 1fr}
.rbtns .again{grid-column:auto;color:#3a2208;font-size:14px}

/* ───── 픽셀 풍 UI 테마: 모서리를 계단처럼 깎고, 두꺼운 테두리 + 위쪽 밝은 줄 / 아래쪽 어두운 줄로 입체감 ───── */
:root{ --px-bg:#1d1a24; --px-panel:#3b3546; --px-panel2:#2a2533; --px-hi:#5d5470; --px-lo:#17141d; --px-ink:#f3e6c4; --px-gold:#f2b53a; --px-gold-lo:#9a6416; --px-parch:#d9c49a; --px-parch-lo:#8f7a52; }
.app{background:var(--px-bg)}
.px,.hud,.sbtn,.btncol .go,.bagcol .chip,.bres,.rbox,.stg span,.page .card,.item,.skl .s,.backBtn,.bres .go,.rbtns .go,.rbtns .ghost,.pend .opts button,.hrow,.up,#tab-tool select,#tab-tool .ghost{
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);border-radius:0!important}
/* 판넬 */
.hud,.page .card,.bres,.rbox,.hrow,.item,.skl .s{background:var(--px-panel);border:0!important;box-shadow:inset 0 0 0 3px var(--px-lo),inset 0 6px 0 -3px var(--px-hi),inset 0 -6px 0 -3px var(--px-lo)!important;color:var(--px-ink)}
.hud{height:42px;background:var(--px-panel2)}
.hud .it{color:var(--px-ink);font-size:18px;text-shadow:0 2px 0 var(--px-lo)}
.hud .it + .it{border-left:3px solid var(--px-lo)}
/* 버튼 (돌판 느낌) */
.sbtn,.backBtn,.rbtns .ghost,.pend .opts button,#tab-tool .ghost{background:var(--px-panel);color:var(--px-ink);border:0!important;
  box-shadow:inset 0 0 0 3px var(--px-lo),inset 0 6px 0 -3px var(--px-hi),inset 0 -7px 0 -3px var(--px-lo)!important;font-family:var(--display);font-weight:400;text-shadow:0 2px 0 var(--px-lo)}
.sbtn{font-size:13px;letter-spacing:.5px}
.sbtn span{font-size:22px;filter:drop-shadow(0 2px 0 var(--px-lo))}
.sbtn:active:not(:disabled),.rbtns .ghost:active{transform:translateY(2px);box-shadow:inset 0 0 0 3px var(--px-lo),inset 0 -6px 0 -3px var(--px-hi)!important}
.sbtn:disabled{opacity:.4;filter:grayscale(.6)}
.btncol .idleChip{background:#2f4a2c;box-shadow:inset 0 0 0 3px #142012,inset 0 6px 0 -3px #4f7a47,inset 0 -7px 0 -3px #142012!important;border:0!important}
.btncol .idleChip b{color:var(--px-gold);text-shadow:0 2px 0 #142012}
/* 금색 큰 버튼 (전투 시작·확인·영입) */
.btncol .go,.bres .go,.rbtns .go{background:var(--px-gold);color:#3a2208;border:0;font-family:var(--display);text-shadow:0 1px 0 #ffd98a;
  box-shadow:inset 0 0 0 3px #5a3a0c,inset 0 6px 0 -3px #ffe08a,inset 0 -8px 0 -3px var(--px-gold-lo)!important}
.btncol .go:active:not(:disabled){transform:translateY(2px)}
.btncol .go:disabled{background:#6a6272;color:#cfc6d8;text-shadow:none;box-shadow:inset 0 0 0 3px var(--px-lo),inset 0 6px 0 -3px #8a8296,inset 0 -8px 0 -3px #4a4452!important;filter:none;opacity:1}
/* 전장 틀: 참고 이미지처럼 양피지 테두리 */
.arena{padding:6px;background:var(--px-parch);clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);box-shadow:inset 0 0 0 3px var(--px-parch-lo),inset 0 -6px 0 -3px #b39d6e}
.arena .field,.arena canvas{border-radius:0!important;border:3px solid var(--px-lo)!important}
.arena .field{inset:6px;width:calc(100% - 12px);height:calc(100% - 12px)}
.arena canvas{inset:6px;width:calc(100% - 12px);height:calc(100% - 12px)}
.arena canvas.fxon{border:0!important;border-radius:0!important;background:none!important;box-shadow:none!important} /* 종 금화·연기 등 작은 이펙트 캔버스: 전장 테두리 없음 */
.arena .bres{z-index:5}
/* 백팩 칸 */
.bagcol .chip{background:var(--px-panel2);border:0!important;box-shadow:inset 0 0 0 3px var(--el),inset 0 0 0 5px var(--px-lo)!important}
.bagcol .chip.inteam::before{border-radius:0}
.bagcol .chip.spare{box-shadow:inset 0 0 0 3px var(--px-gold),inset 0 0 0 5px var(--px-lo)!important}
.coltit{font:400 12px var(--display);color:var(--px-ink);text-shadow:0 2px 0 var(--px-lo)}
.chip .lv,.chip .stars{text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
.chip .cst{border-radius:0}
/* 스테이지 번호 칸 */
.stg span{background:var(--px-panel2);box-shadow:inset 0 0 0 2px var(--px-lo);color:var(--px-ink)}
.stg span.done{background:#2f4a2c;color:#bfe6a8}
.stg span.boss{background:#6a2424}
.stg span.cur{background:var(--px-gold);color:#3a2208;box-shadow:inset 0 0 0 2px #5a3a0c,0 0 0 2px var(--px-lo)}
/* 결과·영입 카드 */
.bres{border:0!important;padding:14px}
.bres h3{text-shadow:0 3px 0 var(--px-lo)}
.rbox{border:0!important;box-shadow:inset 0 0 0 3px var(--px-lo),inset 0 0 0 6px var(--el),inset 0 0 0 8px var(--px-lo)!important}
.rstrip span{border-radius:0}
.gain{background:var(--px-panel2);border-radius:0}
.gain .big{border-radius:0}
.toast{border-radius:0;background:var(--px-panel2);box-shadow:inset 0 0 0 3px var(--px-lo);color:var(--px-ink);font-family:var(--display);font-weight:400}
/* 다른 화면(상점·영웅·도구)도 같은 판넬 */
.page:not(#tab-camp){background:var(--px-bg)}
.page .card h2{color:var(--px-ink);text-shadow:0 2px 0 var(--px-lo)}
.up{background:#3f6a3a;color:#e8ffd9;box-shadow:inset 0 0 0 3px #142012,inset 0 6px 0 -3px #6a9a5c,inset 0 -7px 0 -3px #142012}
.up:disabled{background:#4a4452;color:#9a93a6;box-shadow:inset 0 0 0 3px var(--px-lo)}
.skl .s.empty{opacity:.6}

/* ───── 결과 화면 (승리·패배) ───── */
.arena .bres{inset:6px;left:6px;top:6px;transform:none;width:auto;max-width:none;padding:0!important;background:transparent!important;box-shadow:none!important;clip-path:none!important;display:flex;align-items:center;justify-content:center;overflow:hidden}
.rsc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#f3e6c4;text-align:center;padding:16px}
.rsc.win{background:radial-gradient(circle at 50% 42%,rgba(242,181,58,.28),rgba(15,12,20,.82) 60%)}
.rsc.lose{background:radial-gradient(circle at 50% 42%,rgba(120,20,30,.35),rgba(10,6,8,.88) 65%);animation:shake .45s ease-out}
.rsc .rays{position:absolute;left:50%;top:40%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,214,120,.16) 0 10deg,transparent 10deg 20deg);animation:spinr 14s linear infinite;pointer-events:none}
.rsc .ban{position:relative;font:400 64px/1 var(--display);letter-spacing:6px;padding:14px 48px 16px;color:#3a2208;background:var(--px-gold);
  clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);box-shadow:inset 0 6px 0 #ffe08a,inset 0 -8px 0 var(--px-gold-lo);animation:drop .55s cubic-bezier(.3,1.6,.5,1) both;text-shadow:0 3px 0 #ffd98a}
.rsc.lose .ban{color:#f3e6c4;background:#6a2424;box-shadow:inset 0 6px 0 #9a3a3a,inset 0 -8px 0 #3a1010;text-shadow:0 3px 0 #2a0808;letter-spacing:8px}
.rsc .rsub{position:relative;font:400 16px var(--display);text-shadow:0 2px 0 #000;animation:fadeup .4s .25s both}
.rsc .rtip{position:relative;max-width:420px;font:600 13px/1.5 var(--body);color:#e8d6d6;background:rgba(0,0,0,.45);padding:8px 14px;animation:fadeup .4s .35s both}
.rsc .rrew{position:relative;display:flex;align-items:center;gap:10px;padding:8px 18px;background:#2a2533;box-shadow:inset 0 0 0 3px #17141d,inset 0 6px 0 -3px #5d5470;animation:fadeup .4s .3s both}
.rsc .rrew img{width:32px;height:32px;image-rendering:pixelated}
.rsc .rrew b{font:400 30px var(--display);color:var(--px-gold);text-shadow:0 3px 0 #17141d;min-width:80px;text-align:left}
.rsc #gainBox,.rsc .muted{position:relative;animation:fadeup .4s .4s both}
.rsc .go{position:relative;width:auto!important;min-width:180px;padding:12px 40px;margin-top:6px;animation:fadeup .4s .45s both}
@keyframes drop{0%{transform:translateY(-140px) scale(1.3);opacity:0}100%{transform:none;opacity:1}}
@keyframes fadeup{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes spinr{to{transform:rotate(360deg)}}

/* ───── 전리품 화면: 오른쪽 절반을 차지하는 판넬 ───── */
.roul{background:linear-gradient(90deg,rgba(10,8,14,.15),rgba(10,8,14,.72) 50%)}
.roul.flash::after{content:'';position:absolute;inset:0;background:#fff;pointer-events:none;animation:flashw .5s ease-out forwards}
@keyframes flashw{0%{opacity:.85}100%{opacity:0}}
.rbox{position:absolute!important;right:0;top:0;bottom:0;width:480px!important;margin:0!important;padding:18px 22px!important;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:6px;
  background:#2a2533!important;clip-path:none!important;box-shadow:inset 6px 0 0 #17141d,inset 9px 0 0 var(--el),inset 12px 0 0 #17141d!important;animation:slidein .45s cubic-bezier(.2,.9,.3,1)}
@keyframes slidein{from{transform:translateX(100%)}}
.rbox .rt{font:400 16px var(--display);color:#f3e6c4;text-shadow:0 2px 0 #17141d}
.rstage{position:relative;height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 60%,#3b3546,#1d1a24 70%);box-shadow:inset 0 0 0 3px #17141d}
.rstage .rpic{position:relative;z-index:2;width:180px;height:180px!important;background-size:180px 180px!important;background-position:center!important;image-rendering:pixelated}
.rpic.loot img.lic{width:120px!important;height:120px!important}
.rfx{position:absolute;inset:0;pointer-events:none;z-index:1}
.rfx .rays{position:absolute;left:50%;top:50%;width:600px;height:600px;margin:-300px 0 0 -300px;opacity:0;background:repeating-conic-gradient(var(--gcol,#fff) 0 8deg,transparent 8deg 22deg)}
.rfx .ring{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border:6px solid var(--gcol,#fff);border-radius:50%;opacity:0}
.rgrade{position:absolute;z-index:3;top:10px;left:10px;font:400 14px var(--display);padding:2px 10px;color:#17141d;opacity:0}
.rgrade.g1,.rgrade.g2,.rgrade.g3{background:var(--gcol,#d9dde8);color:#17141d} /* 글자판 색 = 실제 등급색(1 일반·2 고급·3 희귀·4 전설) */
.rburst{position:absolute;left:50%;top:50%;z-index:3;pointer-events:none}
.rburst i{position:absolute;width:6px;height:6px;background:var(--gcol,#fff);box-shadow:0 0 0 2px rgba(0,0,0,.4);animation:shard .7s var(--dl) ease-out forwards;opacity:0}
@keyframes shard{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
/* 도는 동안: 그림이 깜빡이며 흔들려요 */
.rbox.spin .rpic{animation:flick .12s steps(2) infinite}
@keyframes flick{50%{filter:brightness(1.6) drop-shadow(0 0 0 #fff);transform:translateY(-3px)}}
/* 멈춘 순간 (모든 등급): 고리가 퍼지고 그림이 툭 튀어나와요 */
.rbox.reveal .rpic{animation:popin .45s cubic-bezier(.3,1.7,.5,1)}
.rbox.reveal .ring{animation:ringo .6s ease-out}
.rbox.reveal .rgrade{opacity:1;animation:fadeup .3s .2s both}
@keyframes popin{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes ringo{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(9)}}
/* 연출 2단계(희귀): 등급색 광선이 천천히 돌아요 */
.rbox.gr2.reveal .rays{opacity:.22;animation:spinr 10s linear infinite}
.rbox.gr2.reveal .rpic{filter:drop-shadow(0 0 10px var(--gcol,#4fa3ff))}
/* 연출 3단계(전설): 등급색 광선이 빠르게 돌고, 판넬이 흔들리고, 화면이 번쩍여요 */
.rbox.gr3.reveal{animation:shake .5s ease-out}
.rbox.gr3.reveal .rays{opacity:.38;animation:spinr 5s linear infinite}
.rbox.gr3.reveal .rpic{filter:drop-shadow(0 0 14px var(--gcol,#ffb02e)) drop-shadow(0 0 4px #fff)}
.rbox.gr3.reveal .rstage{background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--gcol,#ffb02e) 30%,#1d1a24),rgba(29,26,36,.6) 72%)!important} /* 등급색을 어둡게 섞은 무대 */
.rbox .rname{font:400 24px var(--display);color:#f3e6c4;text-shadow:0 3px 0 #17141d}
.rbox .rmeta{color:#c9bfd8;font-size:12px}
.rbox .rstrip{gap:6px;margin:6px 0}
.rbox .rstrip span{width:44px;height:44px;opacity:.7}
.rbox .rstrip span .av.pic{background-size:contain!important;background-position:center!important;image-rendering:pixelated;filter:none}
.rbox .rstrip span img.lic{width:24px!important;height:24px!important}
.rbox .rstrip span:not(.sk) img.lic{width:32px!important;height:32px!important} /* 골드·마나스톤(16px 그림)은 정수 2배 */
.rbox .rstrip span.on{opacity:1}
.rbox .rbtns{margin-top:6px}
.rbox .rbtns .go,.rbox .rbtns .ghost{padding:12px 6px;font-size:16px}

/* 전리품 카드: 무대 가운데, 뒤 전장이 비쳐 보이게 (사용자 요청) */
.roul{background:rgba(10,8,14,.28)!important}
.rbox{left:50%!important;right:auto!important;top:50%!important;bottom:auto!important;width:440px!important;max-height:92%;transform:translate(-50%,-50%);
  background:rgba(42,37,51,.78)!important;backdrop-filter:blur(1px);
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)!important;
  box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 6px var(--el),inset 0 0 0 8px #17141d!important;animation:popc .4s cubic-bezier(.3,1.5,.5,1)!important}
@keyframes popc{0%{transform:translate(-50%,-50%) scale(.7);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.rbox.gr3.reveal{animation:shakec .5s ease-out!important}
@keyframes shakec{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(calc(-50% - 10px),-50%)}40%{transform:translate(calc(-50% + 9px),-50%)}60%{transform:translate(calc(-50% - 6px),-50%)}80%{transform:translate(calc(-50% + 3px),-50%)}}
.rbox .rstage{height:190px;background:radial-gradient(circle at 50% 60%,rgba(59,53,70,.75),rgba(29,26,36,.55) 70%)!important}

.ulti{display:inline-block;vertical-align:-6px;margin-right:3px;image-rendering:pixelated;font-size:16px}

/* ───── 스킬 등급 테두리 (1 일반 · 2 고급 · 3 희귀 · 4 전설) ───── */
@property --ha{syntax:'<angle>';inherits:false;initial-value:0deg}
.skc{box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 5px var(--sg,#5d5470)!important}
.skc.E{background:#4a2230!important;box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 5px var(--sg,#5d5470)!important}
.skc.E::after{content:'';position:absolute;top:5px;right:5px;width:8px;height:8px;background:#e04a4a;box-shadow:0 0 0 2px #17141d;z-index:3} /* 적 스킬 표시: 빨간 점 + 붉은 바탕 */
.stile.sk{box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 5px var(--sg)!important}
.stile.sk.sel{box-shadow:inset 0 0 0 3px #f3e6c4,inset 0 0 0 5px var(--sg),inset 0 0 0 7px #17141d!important}
.rstrip span.sk{box-shadow:inset 0 0 0 2px var(--sg)!important}
/* 전설: 테두리를 따라 밝은 빛(히카리)이 빙글빙글 돌아요 */
.leg{position:relative}
.leg::before{content:'';position:absolute;inset:0;padding:5px;z-index:2;pointer-events:none;
  background:conic-gradient(from var(--ha),transparent 0 62%,#fff6d6 74%,#ffb02e 80%,transparent 92%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:hika 1.6s linear infinite}
.rstrip span.leg::before,.lootprev .lp.leg::before{padding:2px}
@keyframes hika{to{--ha:360deg}}
.tip{box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 5px var(--sg,#f2b53a)!important}
.tip .gname{font:400 12px var(--display);margin-left:2px}
/* 전리품 미리 보기: 적 스킬 칸 바로 밑 */
.lootprev{position:absolute;right:14px;top:76px;z-index:4;display:flex;flex-direction:row-reverse;align-items:center;gap:4px;padding:4px 6px;background:rgba(23,20,29,.72)}
.lootprev:empty{display:none}
.lootprev .lt{font:400 11px var(--display);color:#f3e6c4;font-style:normal;margin-left:4px;text-shadow:0 1px 0 #000}
.lootprev .lp{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#2a2533;box-shadow:inset 0 0 0 2px var(--el);cursor:help;font-size:16px;overflow:hidden}
.lootprev .lp img.lic,.lootprev .lp img{width:24px!important;height:24px!important;image-rendering:pixelated}
.lootprev .lp .av.pic{background-size:170%;background-position:50% 40%}

/* 백팩 꽉 참 고르기 (카드 안·전장 위 같은 모양) */
.pq{font:400 20px var(--display);color:#ffd34d;text-shadow:0 2px 0 #17141d;margin-bottom:2px}
.pq2{font:600 12px/1.5 var(--body);color:#e8dcc4;margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,72px);gap:8px;justify-content:center}
.pt{width:72px;padding:6px 4px 5px;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:#2a2533;color:#f3e6c4;cursor:pointer;
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);box-shadow:inset 0 0 0 3px #17141d,inset 0 0 0 5px var(--el)}
.pt .ph{width:44px;height:44px;display:block;overflow:hidden;background:#1d1a24;border:0!important;border-radius:0!important}
.pt .ph .av.pic{border-radius:0}
.pt b{font:400 12px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
.pt i{font:700 10px var(--body);font-style:normal;color:#ff8a80}
.pt.skip{background:#2f4a2c} .pt.skip i{color:#bfe6a8}
.pt:hover{filter:brightness(1.15)} .pt:active{transform:translateY(2px)}
.rpend{max-height:none!important;overflow:visible!important}

.rbox .rstage{flex:none}
.rbox.pendmode .rstage,.rbox.pendmode .rmeta,.rbox.pendmode .rstrip{display:none} /* 버릴 것을 고르는 동안에는 큰 그림 대신 고르기 칸을 크게 */

/* 적 스킬 줄: 오른쪽부터 적 스킬 → 그 왼쪽에 전리품(골드) */
.erow{position:absolute;top:14px;right:14px;z-index:4;display:flex;flex-direction:row-reverse;align-items:center;gap:6px}
.erow .skbar.e{position:static}
.erow .lootprev{position:static;padding:0;background:none}
.erow .lootprev .lp{width:54px;height:54px}
.erow .lootprev .lp img{width:32px!important;height:32px!important}

/* 전리품 카드: 제목 줄·결과 한 줄 빼고, 등급 고리는 사각 */
.rbox .rt,.rbox .rres{display:none!important}
.rfx .ring{border-radius:0!important}

/* 받은 순간 연출 (글자 없음) */
.rbox.got .rpic{animation:gotf .55s steps(4)}
.rbox.got .ring{animation:ringo .6s ease-out}
@keyframes gotf{0%{filter:brightness(3.2)}50%{filter:brightness(1.8)}100%{filter:none}}
/* 캐릭터 정보 판넬 (픽셀 판넬) */
.hinfo{position:absolute;top:70px;z-index:20;width:208px;padding:8px 9px;background:#221e2b;color:#f3e6c4;pointer-events:none;
  box-shadow:inset 0 0 0 2px #17141d,inset 0 0 0 4px #5d5470,0 4px 0 rgba(0,0,0,.4);
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.hinfo[hidden]{display:none}
.hinfo.left{left:8px} .hinfo.right{right:8px}
.hinfo .hi-top{display:flex;gap:7px;align-items:center}

/* 전리품 카드 안내 한 줄(.rmeta: 두구두구·합성 재료 안내 등) 숨김 (사용자 요청) */
.rbox .rmeta{display:none!important}

/* 전리품 카드: 작은 한 줄 버튼 두 개 + 오른쪽 위 X */
.rbox .rbtns{display:flex!important;justify-content:center;gap:8px;margin-top:8px}
.rbox .rbtns[hidden]{display:none!important}
.rbox .rbtns .go,.rbox .rbtns .again{width:auto!important;flex:none;padding:7px 16px!important;font-size:13px!important;line-height:1.2;min-height:0}
#rAgain{display:inline-block!important}
.rbox .rbtns [hidden]{display:none!important}
.rx{position:absolute;top:10px;right:10px;z-index:5;width:28px;height:28px;padding:0;border:0;cursor:pointer;background:#1d1a24;color:#f3e6c4;font:400 15px/28px var(--display);
  box-shadow:inset 0 0 0 2px #17141d,inset 0 0 0 3px #5d5470}
.rx:hover{color:#ffd34d} .rx[hidden]{display:none}

.rbox.got .rpic{animation:gotf .28s steps(3)!important}

/* 도감 */
.cdx{display:grid;grid-template-columns:1fr 250px;gap:12px;align-items:start}
.cdxtabs{display:flex;gap:6px;margin-bottom:8px}
.cdxtabs button{padding:6px 18px;border:0;background:#2a2533;color:#c9bfae;font:400 14px var(--display);box-shadow:inset 0 0 0 2px #17141d,inset 0 0 0 3px #5d5470;cursor:pointer}
.cdxtabs button.on{background:#ffd34d;color:#2a1d05}
.cdxcount{font:600 11px var(--body);color:#a99f90;margin:2px 0 6px}
.cdxgrid{display:grid;grid-template-columns:repeat(auto-fill,78px);gap:6px}
.cdxc{position:relative;width:78px;padding:5px 3px 4px;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:#2a2533;color:#f3e6c4;cursor:pointer;
  box-shadow:inset 0 0 0 2px #17141d,inset 0 0 0 4px var(--el)}
.cdxc .cdxp{width:48px;height:48px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#1d1a24;font-size:24px}
.cdxc .cdxp .av{width:100%;height:100%;display:block;border-radius:0;background-size:cover;image-rendering:pixelated}
.cdxc .cdxp.ic img{width:48px;height:48px;image-rendering:pixelated}
.cdxc b{font:400 11px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.cdxc em{position:absolute;top:3px;right:3px;font:400 9px var(--body);font-style:normal;background:#ffd34d;color:#2a1d05;padding:0 3px}
.cdxc.unk .cdxp .av{filter:brightness(0) opacity(.75)} .cdxc.unk{box-shadow:inset 0 0 0 2px #17141d,inset 0 0 0 4px #4a4452} .cdxc.unk b{color:#8f8679}
.cdxc.sk:not(.own) .cdxp{opacity:.6}
.cdxc .syd{position:absolute;left:5px;top:5px;width:6px;height:6px;background:#7ccf7a;box-shadow:0 0 0 2px #17141d}
.cdxc.sel{box-shadow:inset 0 0 0 2px #f3e6c4,inset 0 0 0 4px var(--el),0 0 0 2px #ffd34d}
.cdxinfo{position:sticky;top:0}
.cdxinfo .hinfo.cdxh{position:static!important;width:auto!important;display:flex!important;flex-direction:column;gap:8px;pointer-events:auto}
.cdxinfo .hinfo.cdxh[hidden]{display:flex!important}
.cdxinfo .hi-av.sk{display:flex;align-items:center;justify-content:center;font-size:24px} .cdxinfo .hi-av.sk img{width:48px;height:48px;image-rendering:pixelated}
.cdxst{font:600 11px var(--body);color:#ffd34d}
.cdxe{padding:14px;font:600 12px/1.5 var(--body);color:#a99f90;background:#221e2b;box-shadow:inset 0 0 0 2px #17141d,inset 0 0 0 4px #5d5470}
#filters .frow{flex-wrap:wrap}

/* 도감 필터를 작게 */
#tab-hero .filters{gap:3px;margin-bottom:6px}

#tab-hero .filters button{padding:2px 8px;font-size:11px}

/* 개체 등급 (1 일반 · 2 고급 · 3 희귀 · 4 영웅 · 5 전설) */
.chip{box-shadow:inset 0 0 0 2px var(--gcol,#5d5470)!important}
.chip .cgr{position:absolute;left:0;right:0;bottom:1px;text-align:center;font:400 9px var(--display);text-shadow:0 1px 0 #000,0 0 2px #000;pointer-events:none}
.hgr{font:400 12px var(--display)}
.mergeFx{animation:mfx .6s steps(4)}
@keyframes mfx{0%{filter:brightness(3) saturate(0)}50%{filter:brightness(2)}100%{filter:none}}
.mergeTarget{outline:3px solid #ffd34d!important;outline-offset:2px}

/* 승리 화면 전환: 픽셀 막대 와이프 */
.wipe{position:absolute;inset:0;z-index:700;display:flex;pointer-events:none}
.wipe i{flex:1;background:#17141d;transform-origin:top;animation:wipein .25s steps(5) both;box-shadow:inset -2px 0 0 #221e2b}
.wipe.out i{transform-origin:bottom;animation:wipeout .25s steps(5) both}
@keyframes wipein{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes wipeout{from{transform:scaleY(1)}to{transform:scaleY(0)}}
#hud .it.gup{color:#ffd34d;position:relative}
#hud .gplus{position:absolute;left:50%;top:-4px;font:400 12px var(--display);font-style:normal;color:#ffd34d;text-shadow:0 1px 0 #17141d;animation:gpl .8s ease-out forwards;pointer-events:none}
@keyframes gpl{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-18px);opacity:0}}

/* QA 수정 */
.rstrip span.gone{opacity:1!important;filter:none!important}
.rstrip span.gone > *{opacity:.28;filter:grayscale(1)}
.rstrip span.gone::after{z-index:2;font-size:26px!important;text-shadow:0 0 0 #17141d,2px 2px 0 #17141d,-2px -2px 0 #17141d,2px -2px 0 #17141d,-2px 2px 0 #17141d!important}
.sgold{float:right;display:inline-flex;align-items:center;gap:4px;font:400 14px var(--display);color:#ffd34d}
.sgold img{width:16px;height:16px;image-rendering:pixelated}
.sbtn{font-size:14px!important}
#tab-camp.busy #fightBtn{font-size:13px!important;letter-spacing:0!important}

/* 전리품 카드: 화면 전체가 아니라 전장(위쪽 상태 줄 아래) 한가운데로 */
.roul:not([hidden]){padding-top:48px;box-sizing:border-box}
.rbox{max-height:calc(100% - 64px)!important}

/* 승리 뒤 다음 스테이지 편성 화면이 오른쪽에서 밀려 들어와요 */
#field.slidein{animation:fslide .35s cubic-bezier(.2,.8,.3,1)}
@keyframes fslide{from{transform:translateX(100%)}to{transform:none}}
.arena{overflow:hidden}
/* 전리품 카드의 반복(아이들) 연출 빼기: 띠 깜빡임, 회전 광선 */
.rbox .rstrip span.hot,.rbox .rstrip span.hot:not(.on){animation:none!important}
.rbox .rays{animation:none!important}

/* 내 스킬 10칸: 작은 칸 5개 × 2줄, 빈 칸은 흐린 네모 */
#skA{flex-wrap:wrap;width:216px;gap:4px}
#skA .skc{width:40px!important;height:40px!important;padding:2px!important}
#skA .skc img{width:32px!important;height:32px!important}
/* 팀 스킬 아이콘: 내 것·적 것 같은 크기 (칸 44px, 그림 24px 원본을 36px로) */
#skA .skc,#skE .skc{width:44px!important;height:44px!important;padding:4px!important}
#skA .skc img,#skE .skc img{width:36px!important;height:36px!important}
#skA .skc .cd,#skE .skc .cd{left:4px;right:4px;top:4px}
#skA{width:236px} #skE{gap:4px}
#skA .skc.empty{display:block;background:rgba(23,20,29,.45)!important;box-shadow:inset 0 0 0 2px rgba(93,84,112,.7)!important;cursor:default}
/* 종 단계: 점 대신 네모칸 */
#bellBtn .bdots{gap:3px}
#bellBtn .bdots i{width:12px!important;height:12px!important;background:#17141d!important;box-shadow:inset 0 0 0 2px #5d5470!important}
#bellBtn.b1 .bdots i.on{background:#ffd34d!important;box-shadow:inset 0 0 0 2px #17141d!important}
#bellBtn.b2 .bdots i.on{background:#ff9a3c!important;box-shadow:inset 0 0 0 2px #17141d!important}
#bellBtn.b3 .bdots i.on{background:#ff4a4a!important;box-shadow:inset 0 0 0 2px #17141d!important}

/* 종: 스테이지 줄에서 조금 띄우고, 단계 네모칸은 종 아이콘 바로 아래 (사용자 요청) */
#bellBtn{top:54px!important;height:auto!important;flex-direction:column!important;padding:5px 8px 6px!important;gap:4px!important}
.evban{top:118px!important}

.sempty{font:600 12px var(--body);color:#8f8679;padding:10px 4px}

/* 다음 스테이지 들어오기: 우리 편은 왼쪽 밖에서 통통 걸어 들어오고, 적은 오른쪽에서 */
#field.walkin .unit[data-uid]{animation:wkin .75s cubic-bezier(.25,.7,.35,1) both}
#field.walkin .unit[data-uid] .slot{animation:wkbob .15s steps(2) 5}
#field.walkin .unit:not([data-uid]){animation:fein .6s .15s ease-out both}
@keyframes wkin{from{transform:translateX(-560px)}to{transform:none}}
@keyframes wkbob{50%{transform:translateY(-4px)}}
@keyframes fein{from{transform:translateX(120px);opacity:0}to{transform:none;opacity:1}}

/* 대기(편성) 화면에도 체력바: 전투와 같은 얇은 도트 바, 가득 찬 상태 */
#field .fhp{position:absolute;width:6.667%;height:2.000%;transform:translateX(-50%);background:#17141d;pointer-events:none;box-sizing:border-box;padding:2px}
#field .fhp b{display:block;width:100%;height:100%;background:linear-gradient(#b6f59a 50%,#5fc85a 50%)}
#field .fhp.e b{background:linear-gradient(#ff8f7a 50%,#d8443e 50%)}
#field.walkin .fhp{opacity:0}

/* 편성 화면 막대 캔버스 (전투 막대와 같은 그림) */
#field canvas.fbar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:300;image-rendering:pixelated}
#field.walkin canvas.fbar{opacity:0}

/* DPS 미터 (전투 중 왼쪽, 결과 화면 위에도 보여요) */
.dps{position:absolute;left:8px;top:112px;z-index:720;width:196px;background:rgba(23,20,29,.86);color:#f3e6c4;box-shadow:inset 0 0 0 2px #17141d,inset 0 0 0 3px #5d5470}
.dps[hidden]{display:none}
.dpsh{width:100%;display:flex;align-items:center;gap:6px;padding:5px 7px;border:0;background:#2a2533;color:#f3e6c4;cursor:pointer;font:400 12px var(--display)}
.dpsh b{font:inherit}
.dpst{display:flex;gap:3px;margin-left:auto}
.dpst i{font:600 10px var(--body);font-style:normal;padding:1px 5px;background:#17141d;color:#a99f90}
.dpst i.on{background:#ffd34d;color:#2a1d05}
.dpsh em{font-style:normal;width:12px;text-align:center}
.dps.closed .dpsb{display:none}
.dpsb{max-height:210px;overflow:auto;padding:4px 6px 6px}
.dr{display:flex;gap:6px;align-items:center;padding:3px 0}
.dr.dead{opacity:.4}
.dav{width:24px;height:24px;flex:none;overflow:hidden;background:#17141d;display:flex;align-items:center;justify-content:center;font-size:14px}
.dav .av{width:100%;height:100%;display:block;border-radius:0;background-size:cover;image-rendering:pixelated}
.dm{flex:1;min-width:0}
.dn{display:flex;justify-content:space-between;gap:4px;font:600 10px var(--body)}
.dn b{font:400 11px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn span{white-space:nowrap;color:#ffd34d}
.dbar{display:block;height:4px;background:#2a2533;margin-top:2px}
.dbar s{display:block;height:100%;background:linear-gradient(#ffe08a 50%,#f2b53a 50%)}
.dr small{display:block;font:600 9px var(--body);color:#8f8679}

/* 백팩: 갈색 가죽 가방 느낌. 빈 칸은 +, 칸에는 캐릭터 얼굴만 (사용자 요청) */
.bagcol .bagin{background:#5a3a22;box-shadow:inset 0 0 0 3px #2b1a0e,inset 0 0 0 5px #8a5a32,inset 0 0 0 6px #2b1a0e;padding:8px 4px;align-items:center}
.bagcol .coltit{color:#f3d9a8!important;text-shadow:0 1px 0 #2b1a0e}
.bagcol .chip{background:#3b2514!important;box-shadow:inset 0 0 0 2px #2b1a0e,inset 0 0 0 3px var(--gcol,#a8784a)!important;border-radius:0!important;overflow:hidden}
.bagcol .chip .av.pic{background-size:190%!important;background-position:50% 22%!important}
.bagcol .chip .cgr{display:none}
.bagcol .chip.bagempty{display:flex;align-items:center;justify-content:center;font:400 22px var(--display);font-style:normal;color:#a8784a;background:#4a2f1a!important;box-shadow:inset 0 0 0 2px #2b1a0e,inset 0 0 0 3px #6e4626!important;cursor:default}

.bagcol .chip.bagempty{font:400 36px/1 var(--display)!important;color:#c99a62!important}

/* 가운데 모였던 자리에서 각자 자리로 (가운데 맞춤 translate(-50%,-50%)는 유지) */
#field.walkin .unit[data-uid]{animation:wkin2 .7s cubic-bezier(.3,.7,.35,1) both!important}
@keyframes wkin2{from{transform:translate(-50%,-50%) translate(var(--fx,0),var(--fy,0))}to{transform:translate(-50%,-50%)}}
#field.walkin .unit:not([data-uid]){animation:fein2 .6s .15s ease-out both!important}
@keyframes fein2{from{transform:translate(-50%,-50%) translateX(120px);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}

/* DPS 두 판: 우리 편은 전장 왼쪽 끝, 상대는 오른쪽 끝(거울 배치). 좁고 반투명 */
.dps{width:140px!important;top:112px!important;background:rgba(23,20,29,.62)!important}
.dps.a{left:4px!important;right:auto}
.dps.e{right:4px;left:auto!important}
.dps .dpsh{background:rgba(42,37,51,.8);padding:4px 6px;font-size:11px}
.dps.e .dpsh{justify-content:flex-end}
.dps .dpsh em{margin-left:auto} .dps.e .dpsh em{margin:0 auto 0 0}
.dps.closed{width:auto!important}
.dps .dpsb{max-height:200px;padding:3px 4px 5px}
.dps .dav{width:20px;height:20px}
.dps .dn b{font-size:10px}
.dps.e .dr{flex-direction:row-reverse}
.dps.e .dn{flex-direction:row-reverse}
.dps.e .dbar s{margin-left:auto}
.dps.e .dr small{text-align:right}

/* 백팩: 제목 없이 전장 높이에 맞춰요. 빈 칸 +는 칸 정가운데 (글꼴 대신 막대 두 개로 그려요) */
.bagcol .chip.bagempty{font-size:0!important;background:linear-gradient(#c99a62,#c99a62) center/18px 4px no-repeat,linear-gradient(#c99a62,#c99a62) center/4px 18px no-repeat,#4a2f1a!important}
.bagcol .bagin{justify-content:flex-start}

/* 성급 ★ (작고 은은하게) · 도감 등급 글자 */
.ustar{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:400 9px/1 var(--body);font-style:normal;letter-spacing:-1px;color:#e9c46a;text-shadow:0 1px 0 #17141d,1px 0 0 #17141d,-1px 0 0 #17141d;pointer-events:none;opacity:.9}
.ustar.s1{opacity:.55}
.bagcol .chip,.slot{position:relative}
.hstar{color:#e9c46a;font:inherit}
/* 영웅 아이콘 규칙: 등급 = 테두리 색, 성급 = 아이콘 안 아래쪽 작은 별 */
.hic{position:relative}
.hic::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 2px var(--hg,#5d5470);pointer-events:none;z-index:2}
.hicf{display:block;width:100%;height:100%;overflow:hidden}
.hicf > .av{width:100%;height:100%;display:block;border-radius:0}
.hst{position:absolute;left:0;right:0;bottom:3px;z-index:3;display:flex;justify-content:center;gap:1px;pointer-events:none;font-style:normal}
.hst b{display:block;font:400 10px/9px var(--display);color:#ffd34d;text-shadow:1px 0 0 #17141d,-1px 0 0 #17141d,0 1px 0 #17141d,0 -1px 0 #17141d}
.hst b::before{content:"★"}
.chip > .hst{bottom:4px}
.rgrade{display:none!important} /* 등급 글자 대신 테두리 색으로 */
.cdxg{display:block;font:600 9px var(--body);font-style:normal}

/* 스킬1·스킬2 줄 (정보 판넬·도감·전리품 카드) */
.hi-sk{margin-top:4px;font:600 10px/1.35 var(--body);color:#c9bfae}
.hi-sk b{color:#ffd34d;font-weight:600}
.hi-sk small{color:#a99f90;font-size:10px}
.hi-sk.lock{opacity:.45}
.uic{image-rendering:pixelated;display:inline-block;vertical-align:middle}
.sbtn span .uic{display:block;filter:none}
.hi-sk .uic{vertical-align:-3px}
.stile .ic.dice .uic{display:block}
.stg span .uic{vertical-align:-3px}
.skn{display:inline-block;padding:0 4px;margin-right:2px;background:#2a2533;color:#c9bfd8;font:600 9px/14px var(--body)}
.sklv{font-style:normal;color:#9fe07a;font-size:10px}
.hinfo .hi-ult .skn{font-size:9px}
.hinfo.btl{z-index:730}
.hinfo.btl .hi-st4 span{white-space:nowrap;gap:4px}
.hinfo .hi-hp{color:#9fe07a} .hinfo .hi-dead{color:#ff8f7a}
/* 종: 누를 때 검은 테두리 없이 (사용자 요청) — 포커스 테두리·터치 강조·안쪽 검은 줄 제거, 색 테두리만 남겨요 */
#bellBtn .bnext{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);white-space:nowrap;pointer-events:none;padding:1px 5px;background:rgba(23,20,29,.72);color:#f3e6c4;font:600 10px/14px var(--body);letter-spacing:.02em}
#bellBtn .bnext[hidden]{display:none}
#bellBtn .bnext b{font-weight:600;color:#ffd34d}
.bell,#bellBtn{outline:none!important;-webkit-tap-highlight-color:transparent}
.bell:focus,.bell:focus-visible,.bell:active{outline:none!important}
.bell{box-shadow:inset 0 0 0 2px #5d5470!important}
.bell.b1{box-shadow:inset 0 0 0 2px #ffd34d!important}
.bell.b2{box-shadow:inset 0 0 0 2px #ff9a3c!important}
.bell.b3{box-shadow:inset 0 0 0 2px #ff4a4a!important}

/* 전리품 카드 높이 고정: 이름 줄은 한 줄(넘치면 …), 높이 고정 (사용자 요청) */
.rbox .rname{height:32px;line-height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.rbox .rname *{line-height:inherit}
</style>

  <header class="top" hidden><h1 id="topTitle">캠페인</h1><span class="stName" id="stWrap"><span id="stTitle">1-1</span><span id="stBadges"></span></span><span class="tag" id="goldTag">0 G</span></header>

  <!-- 캠페인 탭 -->
  <main class="page" id="tab-camp">
    <div class="card pend" id="pendBox" hidden></div>
    <!-- 왼쪽 백팩 · 가운데 전투 · 오른쪽 버튼. 화면은 고정이고 가운데 그림만 편성 ↔ 전투로 바뀌어요 -->
    <div class="camp3">

<script>
(function(){

  function fitBag(){ var a = document.querySelector('.arena'), c = document.querySelector('.bagcol'), b = c && c.querySelector('.bagin'); if (!a || !b) return;
    var ar = a.getBoundingClientRect(), cr = c.getBoundingClientRect(), k = cr.height / (c.offsetHeight || 1); if (!k) return;

    var rh = document.getElementById('rotateHint'); if (rh) rh.hidden = !(sh > sw); }

  var $ = function(id){ return document.getElementById(id); };
  var AV = { goblin: '💰', thorn: '🌵', gate: '👹', lion: '🦁', shaman: '🐺', dancer: '💃', imp: '😈', bear: '🐻', knight: '🛡️', blades: '⚔️', wolf: '🐺', shadow: '🥷', hawk: '🦅', rain: '🏹', frost: '❄️', flame: '🔥', storm: '⚡', song: '🌿', drum: '🥁', wyvern: '🐉', harpy: '🪶', pegasus: '🦄', bat: '🦇' };

  var ULTN = { taunt: '도발', teamShield: '수호의 방패', strike: '강타', multi: '연속 베기', backstab: '그림자 습격', snipe: '저격', chain: '연쇄 번개', healAll: '숲의 노래', haste: '북소리' };
  var AOEN = { rain: '화살비', frost: '눈보라', flame: '대폭발' };

    if (!S) return; skKey = "";
    if (bt){ renderHud(); renderShop(); renderHeroes(); } else renderAll(); // 전투 중에는 편성 화면을 건드리지 않아요
    var rl = $("roul"); if (rl && !rl.hidden){ rl.querySelectorAll(".rstrip span").forEach(function(sp){ sp.innerHTML = lootIcon(sp.dataset.id); });
      if (S.offer && !rl.querySelector(".rbox").classList.contains("spin")) showOffer(S.offer);
      if (S.pending) setRoulPhase(); } // 고르기 칸 얼굴도 그림으로 다시
  }, 60); }
  function ultName(h){ return h.ultName || (h.ult.kind === 'aoe' ? (AOEN[h.id] || '광역') : ULTN[h.ult.kind]); }
  // 궁극기 아이콘: img/p/ult_<영웅 id>.png (24px → 2배 48px). 없으면 종류별 이모지
  var ULTIMG = {}, ULTEMO = { taunt: '😠', teamShield: '🛡️', strike: '⚔️', multi: '🗡️', backstab: '🗡️', snipe: '🎯', aoe: '💥', chain: '⚡', healAll: '💚', haste: '🥁' };
  D.heroes.forEach(function(h){ if (h.art === false) return; var im = new Image(); im.onload = function(){ ULTIMG[h.id] = im; imgReady(); }; im.src = 'img/p/ult_' + h.id + '.png'; });
  function ultIcon(h, px){ return ULTIMG[h.id] ? '<img class="ulti" src="img/p/ult_' + h.id + '.png" alt="" style="width:' + px + 'px;height:' + px + 'px">' : '<span class="ulti">' + (ULTEMO[h.ult.kind] || '✨') + '</span>'; }
  function g(n){ n = Math.floor(n); return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M G' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'K G' : n.toLocaleString() + ' G'; }

  // ───── 초상화 이미지: 불러온 것만 쓰고, 없으면 이모지 ─────
  var IMGS = {};
  var RIP = new Image(); RIP.onload = function(){ RIP.ok = true; }; RIP.src = 'img/p/rip.png';
  var graves = {}; // uid → { t: 쓰러진 뒤 지난 시간 }
  // 픽셀 그림(img/p) 먼저, 없으면 예전 그림(img/s)
  var IMGSRC = {}, PIX = {};
  D.heroes.forEach(function(h){ if (h.art === false) return; var im = new Image(), first = true;
    im.onload = function(){ IMGS[h.id] = im; IMGSRC[h.id] = im.src; PIX[h.id] = im.src.indexOf("img/p/") >= 0; imgReady(); };
    im.onerror = function(){ if (first){ first = false; im.src = 'img/s/' + h.id + '.png'; } };
    im.src = 'img/p/' + h.id + '.png'; });
  var BG = new Image(); BG.src = 'img/p/bg_field.png';
  // 특수 몹·이벤트 그림 (없으면 이모지)
  (D.mobs || []).forEach(function(h){ var im = new Image(); im.onload = function(){ IMGS[h.id] = im; IMGSRC[h.id] = im.src; PIX[h.id] = true; imgReady(); }; im.src = 'img/p/' + h.id + '.png'; });
  var EVIMG = {}; ['merchant', 'mark_merc', 'ev_goblin', 'ev_merchant', 'ev_merc'].forEach(function(k){ var im = new Image(); im.onload = function(){ EVIMG[k] = im; imgReady(); }; im.src = 'img/p/' + k + '.png'; });
  function gc(id){ return D.gradeColor[E.heroGrade(D, id)] || '#fff'; }
  function av(id, gr){ return IMGS[id] ? '<span class="av pic' + (PIX[id] ? ' pix' : '') + '" style="background-image:url(' + IMGSRC[id] + ');--gc:' + gc(id, gr) + '"></span>' : '<span class="av">' + AV[id] + '</span>'; }
  function stars(n){ return ''; } // 성급 별은 그림 위에 보여 주지 않아요 (정보 창에만 ★)

  // ───── 상태 저장 ─────
  var R = D.recruit, KEY = 'idle-testbed-v2', S;
  function fresh(){ var s = { gold: 0, stage: 0, units: [], levels: {}, team: [null, null, null, null, null], idleAt: Date.now(), modules: {}, pending: null };
    var u = E.newUnit(s.units, R.startHero, 1); s.levels[R.startHero] = D.startLevel; s.team[0] = u.uid; return s; }
  // 예전 저장(영웅 종류 기준) → 개체 기준: owned{id:{star}} → { id, grade: star }, spare → 1등급 개체, team의 id → 그 개체 uid
  function migrate(){
    if (S.units) return;
    S.units = []; var map = {};
    Object.keys(S.owned || {}).forEach(function(id){ if (!E.heroById(D, id)) return; var u = E.newUnit(S.units, id, Math.max(1, Math.min(3, (S.owned[id] || {}).star || 1))); map[id] = u.uid; });
    (S.spare || []).forEach(function(id){ if (E.heroById(D, id)) E.newUnit(S.units, id, 1); });
    S.team = (S.team || []).slice(0, 5).map(function(id){ return id && map[id] ? map[id] : null; }); while (S.team.length < 5) S.team.push(null);
    if (S.pos){ var np = {}; Object.keys(S.pos).forEach(function(id){ if (map[id]) np[map[id]] = S.pos[id]; }); S.pos = np; }
    delete S.owned; delete S.spare;
  }
  try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!S || (!S.owned && !S.units)) S = fresh();
  migrate(); if (!S.levels) S.levels = {};
  // 개체 grade(합성 단계) → star(성급, 최대 3). 등급(희귀도)은 이제 영웅마다 고정이에요
  S.units.forEach(function(u){ if (u.star == null) u.star = Math.max(1, Math.min(3, u.grade || 1)); delete u.grade; });
  if (!S.skills) S.skills = [];
  if (S.xp == null) S.xp = 0;
  if (S.bell == null) S.bell = 0; // 위험 종: 울린 횟수(0~3)
  if (S.modules && S.modules.targeting === 'front') delete S.modules.targeting; // 기본값이 '가장 가까운 적(near)'으로 바뀌었어요
  if (S.pos){ var YM = D.battle.arena.yMax; Object.keys(S.pos).forEach(function(k){ if (S.pos[k] && S.pos[k].y > YM) S.pos[k].y = YM; }); } // 전장 아래 띠에는 캐릭터가 닿지 않아요
  if (S.life == null) S.life = D.life ? D.life.max : 10; // 플레이어 체력 (예전 저장에는 없어서 가득 찬 채로)
  if (S.streak == null) S.streak = 0; // 연패 수 (위로금 계산)
  if (S.mana == null) S.mana = 0; // 마나스톤(두 번째 재화). 예전 저장에는 없어서 0부터
  if (S.event === undefined) S.event = E.rollEvent ? E.rollEvent(D, S.stage, Math.random, plv()) : null; // 스테이지에 들어갈 때 한 번 굴리는 특수 이벤트 // 플레이어 경험치 (예전 저장은 0부터)
  // 플레이어 레벨과 그 효과(전장 칸·스킬 칸·상점 등급 확률)
  function PL(){ return D.player ? E.playerLevel(D, S.xp) : { level: 1, cur: 0, need: 1, max: true }; }
  function plv(){ return PL().level; }
  function PK(){ return D.player ? E.perk(D, plv()) : { field: R.fieldSlots, skillSlots: D.skills.slots, shopGrade: null }; }
  if (!S.shop) S.shop = { stock: E.rollShop(D, Math.random, plv(), S.skills || []), rerolls: 0, sold: [] };
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  function hero(id){ return E.heroById(D, id); }
  // 꼬리표 색: 종족 = 초록 계열, 직업 = 파랑 계열, 속성 = 속성 색
  var TAGC = { race: '#7ccf7a', job: '#7fb0ff' };
  function tagList(h){ return [{ k: 'race', v: h.race, t: (D.races || {})[h.race] }, { k: 'job', v: h.job, t: (D.jobs || {})[h.job] }, { k: 'el', v: h.el, t: D.elements.names[h.el] }].filter(function(x){ return x.t; }); }
  function synKeys(){ var o = {}; (S.skills || []).forEach(function(x){ var d = E.skillById(D, x.id); if (!d || !d.tag) return; var y = synInfo(d); if (y) y.vs.forEach(function(v){ o[y.k + ':' + v] = 1; }); }); return o; }
  function tagHtml(h){ var SK = synKeys(); return tagList(h).map(function(x){ return '<span class="htag ' + x.k + (SK[x.k + ':' + x.v] ? ' on' : '') + '" data-tag="' + x.k + ':' + x.v + '" style="--tc:' + (x.k === 'el' ? ELC[h.el] : TAGC[x.k]) + '">' + x.t + '</span>'; }).join(''); }
  // 개체 도우미: 같은 영웅도 여러 명. 등급(1~5)은 합성으로 올라요
  function U(uid){ uid = +uid; for (var i = 0; i < S.units.length; i++) if (S.units[i].uid === uid) return S.units[i]; return null; }
  function owns(id){ return S.units.some(function(u){ return u.id === id; }); }
  function bestGrade(id){ return S.units.reduce(function(m, u){ return u.id === id ? Math.max(m, u.star || 1) : m; }, 0) || 1; } // 가진 개체 중 최고 성급
  function HG(id){ return GR(E.heroGrade(D, id)); } // 영웅 고유 등급

  function bagCount(){ return bagUnits().length; }
  function lvOf(id){ return S.levels[id] || D.startLevel || 1; }
  function gmul(gr){ var m = E.gradeMul(D, gr || 1); return { hp: m, atk: m }; }
  function GR(n){ var G = (D.heroGrades || {})[n] || {}; return { n: n, name: G.name || '', col: G.color || D.gradeColor[n] || '#fff' }; }
  function starsIn(n){ n = Math.max(0, Math.min(3, n || 0)); if (!n) return ''; var s = ''; for (var i = 0; i < n; i++) s += '<b></b>'; return '<i class="hst">' + s + '</i>'; }

  function gradeTag(n){ var g = GR(n); return '<span class="hgr" style="color:' + g.col + '">' + g.name + '</span>'; }
  function cap(){ return E.costCap(D, Math.max(S.best || 0, S.stage)); }
  function usedCost(){ return 0; }
  function roster(){ return S.units.map(function(u){ return { uid: u.uid, id: u.id, level: lvOf(u.id), star: u.star }; }); }
  var toastT = 0;
  function toast(msg){ var t = $('toast'); if (!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 1800); }
  function teamSpec(){ return S.team.map(function(uid, slot){ var u = uid && U(uid); if (!u) return null; var sp = { id: u.id, level: lvOf(u.id), star: u.star, slot: slot, mul: gmul(u.star) }, pp = (S.pos || {})[u.uid];
    if (pp){ sp.x = pp.x; sp.y = pp.y; } return sp; }).filter(Boolean); }
