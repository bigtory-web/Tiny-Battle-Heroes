    return '<div class="odds">상점 확률: ' + w.map(function(x, i){ return x ? '<span style="color:' + ((G[i + 1] || {}).color || '#fff') + '">' + ((G[i + 1] || {}).name || '') + ' ' + Math.round(100 * x / sum) + '%</span>' : ''; }).filter(Boolean).join(' · ') + '</div>' + heroOdds(); }
  function heroOdds(){ var P = D.player; if (!P || !P.heroGrade) return ''; var w = P.heroGrade[Math.max(0, Math.min(plv() - 1, P.heroGrade.length - 1))], sum = w.reduce(function(a, b){ return a + b; }, 0) || 1;
    return '<div class="odds">영웅 등장 확률: ' + w.map(function(x, i){ var g = GR(i + 1); return x ? '<span style="color:' + g.col + '">' + g.name + ' ' + Math.round(100 * x / sum) + '%</span>' : ''; }).filter(Boolean).join(' · ') + '</div>'; }
  function renderEvent(){ var ev = bt ? curEv : S.event, b = $('evBan'), m = $('evMerch'); if (!b) return;
    var txt = '', EI = function(k, e){ return EVIMG['ev_' + k] ? '<img class="evi" src="img/p/ev_' + k + '.png" alt="">' : e + ' '; };
    if (ev && ev.kind === 'goblin') txt = EI('goblin', '💰') + '돈고블린 출현! ' + D.events.goblin.flee + '초 안에 잡으면 골드 ×' + D.events.goblin.goldMul;
    else if (ev && ev.kind === 'merchant') txt = EI('merchant', '🧳') + '방랑상인: 이기면 특별 상점';
    else if (ev && ev.kind === 'merc') txt = EI('merc', '📜') + '떠돌이 용병 ' + hero(ev.id).name + ': 이기면 ' + g(ev.price) + '에 영입 가능';
    b.innerHTML = txt; b.hidden = !txt || !!bt;
    m.hidden = !(ev && ev.kind === 'merchant'); m.innerHTML = EVIMG.merchant ? '<img src="img/p/merchant.png" alt="">' : '🧳'; }
  // ───── 위험 종: 누를 때마다 0→1→2→3→0. 길게 누르거나 우클릭하면 0 ─────
  var BELLIMG = {}; [1, 2, 3].forEach(function(n){ var im = new Image(); im.onload = function(){ BELLIMG[n] = true; renderBell(); }; im.src = 'img/p/ui_bell' + (n > 1 ? n : '') + '.png'; });
  function renderBell(){ var b = $('bellBtn'); if (!b || !D.bell) { if (b) b.hidden = true; return; }
    var B = D.bell, mx = bellMax(), n = Math.min(S.bell || 0, mx), im = BELLIMG[Math.max(1, n)];
    b.hidden = !!bt || S.stage >= E.stageCount(D); b.className = 'bell b' + n + (mx ? '' : ' lock'); b.disabled = !mx;
    b.querySelector('.bic').innerHTML = im ? '<img src="img/p/ui_bell' + (n > 1 ? n : '') + '.png" alt="">' : '🔔';
    b.querySelector('.bdots').innerHTML = [1, 2, 3].slice(0, mx).map(function(i){ return '<i' + (i <= n ? ' class="on"' : '') + '></i>'; }).join('');
    var bg1 = E.bellGold ? E.bellGold(D, S.stage) : 0, nx = b.querySelector('.bnext');
    // 다음 1번 울릴 때 생기는 효과만 한 줄로 (다 울렸으면 숨김)
    if (nx){ nx.hidden = !mx || n >= mx; nx.innerHTML = '다음 종: 적 영웅 ' + (B.enemy || 1) + '명 추가 · <b>+' + bg1.toLocaleString() + 'G</b>' + (fcNext && !bt ? '<i class="wdot ' + (FCC[fcNext.label] || '') + '" title="한 번 더 울리면: ' + fcNext.label + '"></i>' : ''); }
    b.title = !mx ? '전장이 꽉 차서 종을 울릴 수 없어요' : (n ? '종 ' + n + '번 울림 (받은 골드 ' + g(S.bellGold || 0) + ') · ' : '위험 종 · ') + (n < mx ? '울리면 바로 +' + bg1.toLocaleString() + ' G · 적 +1명 · 지면 골드를 돌려줘요 · 되돌릴 수 없어요' : '더 울릴 수 없어요 · 지면 받은 골드를 돌려줘요'); }
  function bellMax(){ return E.bellMax ? E.bellMax(D, S.stage, bt ? curEv : S.event) : (D.bell ? D.bell.max : 0); }
  function foeSlots(){ return S.stage < E.stageCount(D) ? E.stageTeam(D, S.stage, S.event, S.bell || 0, bt ? curPlv : plv()).team.map(function(u){ return { slot: u.slot, key: u.id + (u.merc ? '*' : '') + (u.boss ? '!' : '') }; }) : []; }
  function newFoeSlots(old, now){ var pool = old.map(function(o){ return o.key; }); return now.filter(function(o){ var i = pool.indexOf(o.key); if (i >= 0){ pool.splice(i, 1); return false; } return true; }).map(function(o){ return o.slot; }); }
  function setBell(n){ if (bt || !D.bell) return; var mx = bellMax(); n = Math.max(0, Math.min(n, mx)); var before = Math.min(S.bell || 0, mx), old = foeSlots(), g0 = S.gold;
    var gain = n > before && E.bellGold ? E.bellGold(D, S.stage) * (n - before) : 0; if (gain){ S.gold += gain; S.bellGold = (S.bellGold || 0) + gain; }
    S.bell = n; save(); renderAll();
    if (gain){ var bb = $('bellBtn'); if (HAS_FX) FX.playOn(bb, 'coin', { size: 200, scale: 1, cy: 30, z: 60 }); goldCount(g0, S.gold); }
    if (n > before){
      newFoeSlots(old, foeSlots()).forEach(function(sl){ var fe = document.querySelector('#field .foe[data-foe="' + sl + '"]'); if (!fe) return;
        var un = fe.closest('.unit') || fe.parentNode; fe.classList.add('spawn'); if (HAS_FX) FX.playOn(un, 'poof', { size: 200, scale: 1.3, cy: 30 }); else un.insertAdjacentHTML('beforeend', '<i class="puff"><b></b><b></b><b></b><b></b><b></b></i>');
        setTimeout(function(){ fe.classList.remove('spawn'); var p = un.querySelector('.puff'); if (p) p.remove(); }, 600); });
      var b = $('bellBtn'); b.classList.add('ring'); setTimeout(function(){ b.classList.remove('ring'); }, 500); } }
  (function(){ var b = $('bellBtn'); if (!b) return;
    b.addEventListener('click', function(){ var mx = bellMax(), n = Math.min(S.bell || 0, mx); if (!mx || bt) return;
      if (n >= mx){ b.classList.remove('deny'); void b.offsetWidth; b.classList.add('deny'); toast('더 울릴 수 없어요'); return; }
      setBell(n + 1); if (n === 0) toast('종을 울렸어요! 이번 판은 되돌릴 수 없어요'); }); })();
  function renderAll(){ renderXp(); renderEvent(); renderBell(); $('goldTag').textContent = g(S.gold); renderCampaign(); renderHeroes(); renderIdle(); renderForm(); renderShop(); }
  renderFilters(); renderAll(); renderMods();
  if (S.offer){ offerIds = S.offerIds || [S.offer]; startRoulette(offerIds, S.offer, !!S.offerDecided); }
  if (LIFE_ON && S.life <= 0) showGameOver();
  if (!(S.ui && S.ui.hintFront)){ setTimeout(function(){ if (bt) return; toast('앞에 선 영웅이 먼저 맞아요'); S.ui = S.ui || {}; S.ui.hintFront = true; save(); }, 1200); } // 처음 한 번만
  else if (S.evOffer) setTimeout(showEvWin, 300);
  setInterval(renderIdle, 1000);
})();
</script>
