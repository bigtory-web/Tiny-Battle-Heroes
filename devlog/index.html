<h2 id="s2" data-tags="dev">2. 세션을 넷으로 나눴다</h2>
<p>한 대화에서 다 하면 금방 길어지고, 규칙과 화면이 서로를 덮어썼다. 그래서 역할을 나눴다.</p>

</table></div>
<p><span class="lead">규칙은 한 파일에만.</span> 숫자는 모두 <code>data.js</code>에 있고, 엔진은 Node와 브라우저에서 똑같이 돈다. 그래서 화면을 안 건드리고도 봇으로 수천 판을 돌릴 수 있었다.</p>
<p><span class="lead">알림은 끝났을 때만.</span> 세션끼리 "시작해요"를 주고받으니 토큰이 빨리 닳았다. 18일에 끝났을 때 한 번만 짧게 알리기로 바꿨다.</p>
<p class="lesson">나눌 때는 파일 단위로 나눈다. "누가 이 파일을 고치나"가 정해지면 충돌이 거의 없다.</p>

<p class="lesson">"재미있을 것 같다"는 봇이 못 재지만, "아무 영향이 없다"는 봇이 제일 빨리 찾는다.</p>

<h2 id="s4" data-tags="plan design">4. 안 된 것: 직접 해 봐야 아는 것</h2>
<h3>덩치 코스트 배치</h3>
<p>21일에 출전 인원 대신 덩치 합(기사 3칸, 전사·마법사 2칸, 나머지 1칸)으로 바꾸고, 전장을 3×3 격자로 만들고, 회전까지 넣었다. 숫자로는 문제가 없었다. 직접 해 보니 "직관적이지 않고 괜히 불편"했다. 그날 격자까지 모두 되돌렸다. 자세한 이야기는 <a href="#ep-02">EP.02</a>에 따로 적었다.</p>
<h3>버튼 자리와 크기</h3>
<p>말 걸기 버튼을 "대상 쪽에 있어야 한다"는 이유로 오른쪽에 옮겼다가 가운데로 돌아왔다. 가운데 버튼 셋은 크게 키웠다가 전장을 가려서 줄였고, 결국 셋 다 같은 크기로 15% 작게 맞췄다. 이런 건 봇이 알려 주지 않는다.</p>
<p class="lesson">되돌린 건 <code>기획결정기록.md</code> 맨 위에 날짜, 한 것, 결과, 이유, 되돌리는 방법까지 적는다. 일주일 만에 항목이 열 개가 넘었다.</p>

<p class="lesson">비율은 처음엔 편하지만, 끝에서 숫자가 어디까지 가는지 한눈에 안 보인다. 표로 두면 레벨마다 무엇을 받는지 바로 읽힌다.</p>

<h2 id="e3" data-tags="plan design">3. 레벨업마다 하트 +1, 처음 0이 되면 버틴다</h2>
<p>플레이어 레벨이 오를 때마다 하트가 1씩 는다. 상한은 없다. 그리고 한 런에서 처음으로 0이 되면 죽지 않고 1로 남는다. 하트 1로 시작하는 시험에서 이 버티기가 있으면 런을 처음부터 다시 하는 횟수가 17번에서 9번으로 줄었다.</p>
<figure style="margin:12px 0"><img src="img/heart_bandage.png" alt="금 간 하트, 가로 붕대 하트, 비스듬한 붕대 하트 시안" style="max-width:min(100%,420px);image-rendering:pixelated;border-radius:4px"><figcaption>버틴 하트 시안. 가로 붕대는 하트를 거의 덮어서 비스듬한 쪽(D)을 골랐다.</figcaption></figure>
<p>버틴 상태는 하트 모양으로 알려 준다. 금만 간 하트에서 시작해, 붕대 3줄을 2칸 두께로 비스듬히 감았다.</p>

<h2 id="e4" data-tags="plan">4. 초월 고르는 방법이 하루에 세 번 바뀌었다</h2>
<p>어제는 제단에서 영웅을 터치해 골랐다. 오늘 써 보니 터치를 고르기에 쓰면 영웅 정보를 볼 방법이 없었다. 그래서 끌어다 놓기로 바꿨다. 오후에 "드래그는 빼"로 다시 바꿨다. 지금은 영웅을 누르면 상세 창이 뜨고, 아래 "초월" 버튼으로 제단에 놓는다.</p>
<p>돌아보면 문제는 "고르면 정보를 못 본다"였는데, 그걸 풀지 않고 방법째 옮겼다. "생각해 보면 선택에서 개선해 보려고 했어야 했어." 마지막에 고르기 자체를 고친 게 답이었다.</p>
<p class="lesson">한 가지 일을 하는 길은 하나만 둔다. 오늘 이걸 작업 규칙으로 적었다. 구매는 구매 버튼, 판매는 판매 버튼, 초월은 초월 버튼이다.</p>

<h2 id="e5" data-tags="design">5. 화면을 하나씩 다시 짰다</h2>
<p>비슷한 게임의 화면 나누기를 보고 한 번에 하나씩 바꿨다. 백팩을 늘 펼치고, 배속과 넘김을 위 HUD로 올리고, 팝업을 전장 가운데로 모았다.</p>
<figure style="margin:12px 0"><img src="img/layout_rcol.jpg" alt="전장 오른쪽에 빈 세로 기둥이 있고 전장이 작아진 화면" loading="lazy" style="max-width:100%;border-radius:4px"><figcaption>오른쪽 기둥을 세운 화면 (v419). 전장이 852×474에서 604×336으로 줄었다.</figcaption></figure>
<p>중간에 전장 오른쪽에 기둥을 세우고, 누른 영웅의 상세 정보와 상점을 거기 띄웠다. 해 보니 아무것도 안 눌렀을 때는 빈 칸이 남았고, 전장은 33% 작아졌다. "상시로 노출되는 게 아니라면 굳이 노출되는 게 어색하네." 바로 되돌렸다.</p>
<figure style="margin:12px 0"><img src="img/layout_wide.jpg" alt="전장이 화면 대부분을 차지하고 아래에 백팩과 버튼 줄이 있는 화면" loading="lazy" style="max-width:100%;border-radius:4px"><figcaption>전장을 크게 둔 화면 (v411). "전투 화면이 큰 게 좋네."</figcaption></figure>
<p>이 과정에서 정한 화면 규칙이 다섯 가지다. 버튼은 무조건 사각형이다. 버튼 색은 역할로 정한다(주 행동 노랑, 반대 짝 초록, 보조 파랑, 아이콘 어두운 보라). 창은 한 번에 하나만 연다. 누를 수 없는 버튼은 숨기지 않고 회색으로 둔다. 팝업은 전장 정가운데에 둔다.</p>

<h2 id="e6" data-tags="plan design">6. 보물상자 그림은 9장이 됐다</h2>
<p>처음 요청은 "남은 체력에 따라 상자가 3단계로 부서지는 그림"이었다. 그다음 "용을 눌러 상자를 강화하면 바뀌는 그림"으로 바로잡았다. 시안을 보고 나서 "그것도 괜찮다"가 됐다. 결국 등급 3 × 상태 3 = 9장이 됐다.</p>
<figure style="margin:12px 0"><img src="img/chest9.png" alt="1·2·3등급 보물상자가 멀쩡함, 금 가고 들썩, 부서짐 세 상태로 놓인 9칸 그림" loading="lazy" style="max-width:min(100%,460px);image-rendering:pixelated;border-radius:4px"><figcaption>등급(나무·강철·보라) × 상태(멀쩡·들썩·부서짐).</figcaption></figure>
<p>저녁에는 등급을 정하는 방법도 바꿨다. 용 버튼 대신 플레이어 레벨로 정한다(Lv1~3 1등급, Lv4~7 2등급, Lv8 이상 3등급). 등급마다 체력은 ×1·×1.5·×2.2, 보상 칸은 3·4·5개다. 체력 막대는 깎은 만큼 차오르는 막대에서 남은 체력이 줄어드는 막대로 바꿨다. "100%를 0%로 만드는 거랑 0%를 100%로 만드는 건 차이가 있다."</p>

<h2 id="e7" data-tags="qa">7. 외부 검수: 지는 쪽이 더 받고 있었다</h2>
<p>처음으로 다른 모델(Fable)에게 1-1부터 1-10까지 검수를 맡겼다. 코드는 고치지 말고 읽기만 하라고 했다. 가장 큰 발견은 "초반엔 지는 게 이득"이라는 것이었다.</p>
<div class="tbl"><table>
<tr><th>이기면</th><th>지면</th></tr>
<tr><td>클리어 골드 120~180G (Lv1~4)</td><td>위로금 200G + 모닥불 영웅 1명 + 종 골드를 또 받음 (최대 216G)</td></tr>
</table></div>
<p>원인은 두 가지 버그였다. 위로금은 준 피해 비율만큼 주게 되어 있는데, 계산에 쓰는 값이 전투 결과에 없어서 비율이 늘 0이 되고 최소값 200G만 나왔다. 그리고 지면 종 횟수가 0으로 돌아가서, 같은 판에서 종을 다시 울리면 골드를 또 받았다. 치르는 값은 하트 몇 칸뿐이다.</p>
<p>검수 결과는 아직 하나도 고치지 않았다. 진짜 문제인지 하나씩 확인하는 게 먼저다. 다만 방향은 분명하다. 종의 위험과 보상이 재미있으려면, 지는 쪽 보상이 이기는 쪽보다 작아야 한다.</p>
<p class="lesson">숫자를 하나씩 바꿀 때는 각각 말이 됐다. 전체를 처음부터 끝까지 한 번에 읽어 보니 순서가 뒤집힌 곳이 보였다.</p>

<h2 id="e8" data-tags="plan">8. 바꾸지 않았지만 고민한 것</h2>
<h3>적도 포켓몬, 나도 포켓몬</h3>
<p>"전투적으로 보면 사실 적도 포켓몬 나도 포켓몬이게 싸우는 거 같잖아." 적과 아군이 같은 규칙으로 싸워서 그렇다. 상성이 보이게, 이긴 적 포획, 도감, ★3 진화 외형 같은 아이디어가 나왔지만 아직 해 볼 건 정하지 않았다.</p>
<h3>몹은 이질적이다</h3>
<p>적이 모두 내 영웅과 같은 규칙으로 싸우는데, 몹(슬라임, 박쥐, 해골 병사, 오우거)만 영입할 수 없는 다른 종류다. 특별한 패턴은 영웅 스킬로도 만들 수 있다. 이벤트 9종을 하나씩 보고 뺄 것을 한 번에 정리하기로 했다.</p>
<h3>도발 버튼은 직관적인가</h3>
<p>이름이 없고, 누르면 받는 골드가 안 보이고, 다음 효과는 마우스를 올려야 보인다. 위치를 아래로 옮기자는 제안도 있었지만, 위에 있어야 판 전체에 영향을 준다는 게 읽힌다. 튜토리얼로 알려 줄 수 있는 기능이라 좀 더 고민한다.</p>

  body:`
<p>EP.05를 쓴 뒤에도 24일 작업은 밤까지 이어졌다. 그래서 이번 글은 24일 밤부터 25일까지를 한데 묶었다. 이틀 동안 영웅 65명의 그림을 새로 그렸고, 그 그림에 8칸 애니를 넣었고, 사람 이름을 붙였다. 그림을 바꾸고 나니 화면이 깨져 보이기 시작해서 그 원인도 오래 붙잡았다.</p>

<h2 id="g1" data-tags="design">1. 영웅 65명을 새로 그렸다</h2>
<p>기준은 기사 그림 하나였다. 코덱스와 픽셀랩에 같은 영웅을 맡겨 나란히 보고 "일단 코덱스쪽으로 가야겠다."로 정했다. 예전 그림을 같이 넣으면 그 늘씬한 체형을 따라 해서, 기사 그림만 몸 틀로 주는 방식으로 바꿨다.</p>
<p>그리면서 규칙이 하나 더 생겼다. 무기·날개·꼬리·천 끝은 몸 가까이 두고, 전체 폭은 기사보다 넓지 않게 한다. 쌍검은 칼을 양옆으로 벌리고 있어서 폭이 60칸이었는데, 두 칼을 몸 앞에 나란히(//) 들게 하니 42칸이 됐다. 작은 칸에 여럿이 서는 게임이라 부피가 곧 읽기 쉬움이다.</p>
<p>3·4등급 32명은 등급마다 이미지 세션이 스스로 세 번 검수했다. 다시 그리게 한 이유는 대부분 "무기가 옷이나 머리와 같은 색이라 묻힌다"였다. 노란 번개 지팡이에 노란 머리, 초록 하프에 초록 옷 같은 식이다. 무기 색을 바꿔서 풀었다.</p>
<figure style="margin:12px 0"><img src="img/heroes65.png" alt="새로 그린 영웅 65명을 네 줄로 늘어놓은 그림" loading="lazy" style="max-width:100%;image-rendering:pixelated;border-radius:4px"><figcaption>새로 그린 65명. 덩치를 맞춘 뒤의 크기다.</figcaption></figure>
<h3>키만 맞추면 덩치가 안 맞는다</h3>
<p>처음에는 발에서 눈까지 높이로 크기를 맞췄다. 모자나 깃털은 장식이라 뺐다. 그런데 사령술사와 용기사를 나란히 세우니 "덩치차이가" 났다. 키는 같아도 옆으로 넓은 정도가 달랐다. 그림 면적이 기사 1,393칸, 사령술사 1,131칸, 용기사 1,712칸이었다.</p>
<p>키 기준 크기와 면적 기준 크기의 중간값을 쓰기로 했다. 용기사와 사령술사의 화면 면적 비율이 1.51에서 약 1.25로 줄었다. 완전히 같게 하지 않은 건, 그러면 장식이 큰 캐릭터의 몸이 너무 작아지기 때문이다.</p>

<h2 id="g2" data-tags="design">2. 캐릭터와 배경이 따로 놀았다</h2>
<p>새 영웅을 전장에 세우자 "캐릭터랑 배경이랑 아트 컨셉이 달라서 그런지. 이질적인 부분이 있어." 같은 배율로 나란히 놓고 재 보니, 가장 큰 원인은 픽셀 굵기였다. 배경은 그림 한 칸이 화면 3px, 새 영웅은 약 1px이었다. 세 배 차이다.</p>
<figure style="margin:12px 0"><img src="img/bg_compare.png" alt="예전 배경 위에 새 영웅 3명과 예전 영웅 4명을 나란히 세운 비교 그림" loading="lazy" style="max-width:100%;image-rendering:pixelated;border-radius:4px"><figcaption>왼쪽이 새 그림(64칸), 오른쪽이 예전 그림(36칸). 배경 픽셀이 새 영웅보다 세 배 굵다.</figcaption></figure>
<p>그래서 배경을 같은 구도로 세 배 촘촘하게 다시 그렸다. 흙 전장이 시작되는 높이를 예전과 같게 맞춰서 육각 칸과 캐릭터 자리는 그대로다. 배경 파일은 53KB에서 532KB로 커졌다.</p>

<h2 id="g3" data-tags="plan design">3. 그림 한 장에서 8칸으로</h2>
<p>지금까지 영웅 그림은 기본 1장과 공격 1장이었다. "이미지 2장 하는 건 이미 해 봤어. 그래서 프레임 형식으로도 해 보고 싶은 거야." 대기 4칸과 공격 4칸, 모두 8칸짜리 시트로 바꿔 보기로 했다.</p>
<p>시트를 만들 때 지킬 규칙을 먼저 정했다. 얼굴과 칼은 8칸 모두 같아야 하고, 발은 제자리에 있어야 하고, 효과는 넣지 않고, 색은 첨부한 그림의 색만 쓴다. 배경은 마젠타로 했다. 기사 투구에 흰 깃털이 있어서 흰 배경이면 지울 때 깃털까지 지워진다. 공격 동작은 작은 크기에서도 잘 읽히는 내려치기로 골랐다.</p>
<p>제미나이 첫 결과는 얼굴 가리개와 칼 모양이 칸마다 바뀌고 칼 궤적까지 들어가서 탈락했다. 두 번째는 쓸 만했다. 게임에 넣어 보니 "지금 느낌 괜찮은 거 같은데".</p>
<h3>제미나이와 코덱스를 같은 요청문으로 비교했다</h3>
<p>1등급 17명의 요청문을 만들고, 화살비 하나를 코덱스로도 받아 봤다. 이미지 세션이 후처리하면서 잰 숫자가 차이를 보여 줬다.</p>

<p>"야 그냥 다 코덱스한테 맡기자.. 나머지는.." 그 뒤로는 이미지 세션이 5명씩 만들어 넘기고, UI 세션이 받는 대로 게임에 넣었다. 1등급부터 4등급까지 65명이 같은 날 끝났다.</p>
<h3>이펙트는 픽셀로 맞추지 않기로 했다</h3>
<p>궁극기 24종 가운데 20종이 같은 동그라미 이펙트를 쓰고 있어서, 종류별로 모양을 나누는 표를 만들었다. 새 이펙트 13종을 픽셀로 그리기로 하고 첫 시안까지 넣었다. 그런데 "이펙트까지 픽셀이면 좀 촌스러워질 수도 있겠다." 캐릭터는 픽셀, 이펙트는 부드러운 빛으로 두기로 하고 나머지 12종은 멈췄다. 어색했던 건 픽셀이 아니라서가 아니라, 캐릭터보다 몇 배 큰 네모 조각과 오래 남는 고리 때문이었다.</p>
<p class="lesson">같은 요청문을 두 도구에 넣고 숫자로 비교하니 고르기가 쉬웠다. 눈으로 보면 둘 다 괜찮아 보였지만, 65명을 만들 때 손이 얼마나 가는지는 숫자에서 보였다.</p>

<h2 id="g4" data-tags="dev qa">4. 캐릭터가 깨져 보이는 이유</h2>
<p>24일 밤에 먼저 나온 말은 "전투 시작전이랑 전투 중일때 보면 전투 중이 더 이미지 또렷해"였다. 두 화면의 그리는 방식을 비교해 보니, 전투 전 화면에만 등급 외곽선을 그리는 필터가 4겹 걸려 있었다. 외곽선을 그림에 미리 그려 넣는 방식으로 바꿔 필터를 뺐다.</p>
<p>25일에는 8칸 애니가 들어가면서 "캐릭터 이미지가 뭔가 좀 깨져 보이는데"가 나왔다. 이번 원인은 배율이었다. 64px 그림을 1.35배처럼 정수가 아닌 배율로 키우면, 원본 한 점이 어떤 곳은 화면 1px, 어떤 곳은 2px이 된다. 선 굵기가 들쭉날쭉해진다.</p>
<p>처음 고친 방법은 정수배로 크게 키운 뒤 부드럽게 줄이는 것(sharp-bilinear)이었다. 들쭉날쭉은 사라졌지만 이번엔 "아이콘이랑 캐릭터 이미지랑 선명도가 다르지 않아?" 아이콘은 원본 한 점이 화면 2px 안팎이라 경계가 조금 섞여도 티가 안 났다. 캐릭터는 1.35px라 섞인 1px이 크게 보였다.</p>
<p>정수가 아닌 배율에서는 "또렷하지만 들쭉날쭉"과 "고르지만 흐림" 가운데 하나만 고를 수 있다. 둘 다 피하려면 크기 자체를 정수배로 맞춰야 한다. 그래서 캐릭터 크기를 창 크기에 맞는 정수배로 정하게 바꿨다.</p>
<p>다음은 어느 정수로 맞출지였다. 가까운 정수로 맞추니 내 화면(1920×950)에서 캐릭터가 15% 작아졌다. 큰 쪽으로 올려 보니 "전투에서 캐릭터 이미지 너무 크다." 도구 탭에 크기 버튼을 두고 직접 눌러 비교한 끝에 2배로 정했고, 자동 규칙은 다시 가까운 정수로 돌아갔다.</p>
<p class="lesson">둘 다 좋은 걸 원하면, 고르지 않아도 되는 길부터 찾는다. 여기서는 그 길이 "크기를 조금 양보한다"였다.</p>

<h2 id="g5" data-tags="plan">5. 게임과 영웅에 이름이 생겼다</h2>
<p>24일 밤에 게임 이름을 "타이니 배틀 히어로즈"로 정했다. 그때까지 브라우저 탭에는 "전투 테스트베드"라고 나왔다. 실제 영웅 그림 38명을 배경 위에 북적북적하게 세운 타이틀 그림도 만들었다. 지금 게임소개 탭에 있는 그림이다.</p>
<p>영웅 이름은 바위곰, 늑대발톱, 화살비처럼 생김새나 무기 그대로였다. "지금은 너무 직관적이라 사람 이름 같지 않거든." 전투 스타일과 어울리는 단어로 사람 이름을 지었다. 바위곰은 록시, 늑대발톱은 팽, 화살비는 볼란이 됐다.</p>
<p>영어권에서 어색하게 들리는 이름은 끝소리를 다듬었다. 볼리는 볼란, 페더는 페드라, 머디는 매디가 됐다. 성별은 그림을 보고 정하고, 애매한 건 내가 골랐다. 성별을 바꾼 영웅은 이름도 다시 지었다. 65명 가운데 여성 42명, 남성 23명이다.</p>
<p>옛 이름은 버리지 않고 별칭으로 남겼다. 상세 창과 도감에만 작게 나온다. 별칭을 고르는 기준도 생겼다. 쌍검, 매의눈처럼 별명 같은 뜻이 있으면 그대로 둔다. 별칭이 노래나 식물 같은 물건 자체이거나, 소녀 캐릭터를 골렘이라고 부르는 것처럼 그 캐릭터가 아닌 존재를 가리키면 바꾼다. 그래서 진흙골렘은 늪지기가 됐다.</p>

<h2 id="g6" data-tags="plan qa">6. 지는 쪽이 더 받던 것을 고쳤다</h2>
<p>EP.05 끝에서 외부 검수가 "지는 쪽이 더 받는다"를 찾았다고 썼다. 그날 밤 바로 고쳤다. 위로금은 준 피해 비율이 실제로 들어가게 고치고, 최소값을 200G에서 50G로 내렸다. 같은 판에서 지고 종을 다시 울리면 골드를 또 주던 것도 막았다.</p>
<p>QA 세션이 직접 세 판을 돌려 확인했다. 1-1에서 종 3번 울리고 지면 위로금은 50G, 다시 울린 종은 +0G로 나왔다. 그런데 같은 플레이에서 다른 게 보였다. 1-1에서 종 3번으로 받는 골드가 216G(72×3)인데, 클리어 골드는 120G였다. 종 골드가 판을 깬 보상보다 컸다.</p>
<p>그래서 25일에 종 골드를 그 레벨 클리어 골드의 비율로 바꿨다. 첫 번째 종은 20%, 두 번째는 30%, 세 번째는 50%다. 세 번 다 울리면 딱 클리어 골드 한 번만큼 받는다.</p>

<p>뒤로 갈수록 많이 주는 건, 위험을 더 질수록 더 받아야 하기 때문이다. 봇으로 종을 안 울리는 경우, 늘 울리는 경우, 2번 울리는 경우를 돌려 셋 다 30판을 끝까지 깨는 것을 확인했다.</p>
<p class="lesson">버그를 고치고 직접 플레이해 보니, 버그가 가리고 있던 숫자 문제가 보였다.</p>

<h2 id="g7" data-tags="plan design">7. 낮, 해 질 녘, 밤</h2>
<p>전투가 길어지면 40초부터 피해가 1초마다 15%씩 커진다. 화면에서는 이게 "광폭화"라는 글자 하나로만 보였다. "광폭화 상태가 되면 배경을 어두운 밤 분위기로." 24일 밤에 배경 위에 어두운 남색을 덮었다. 배경만 어두워지고 캐릭터와 숫자는 밝게 남는다.</p>
<p>25일에는 그 사이에 해 질 녘을 넣었다. 30초부터 배경이 노을로 바뀌고, 40초에 밤이 된다. 이미지 세션이 낮 배경과 같은 지형에 색만 바꾼 그림을 따로 그렸다.</p>
<figure style="margin:12px 0"><img src="img/bg_field_dusk.png" alt="보라에서 주황으로 물든 하늘 아래 낮 배경과 같은 지형의 노을 전장" loading="lazy" style="max-width:100%;image-rendering:pixelated;border-radius:4px"><figcaption>노을 배경. 낮 배경과 지형은 한 칸도 다르지 않고 색만 바꿨다.</figcaption></figure>
<p>밤이 되는 순간에는 전장 가운데에 "밤의 분노가 찾아옵니다…"가 2.8초 동안 뜬다. 위쪽 태그도 "광폭화"에서 "밤의 분노"로 바꿨다.</p>

<h2 id="g8" data-tags="design qa">8. 성급 별이 자리를 세 번 옮겼다</h2>
<p>전장 캐릭터 머리 위에 성급 별(★★★)이 있었다. 너무 높고 캐릭터를 가린다고 해서 HP 막대 앞으로 옮기고 "별 하나 + 안에 숫자"로 바꿨다. 그랬더니 막대 줄이 붐볐다. "성급 아이콘 HP 말고 캐릭터 위로 다시.." 다시 머리 위로 올렸고, 마지막에는 숫자를 빼고 성급만큼 작은 별을 늘어놓았다.</p>
<p>처음 문제는 "머리 위"가 아니라 "별 줄이 높고 크다"였다. 크기를 줄이고 나니 원래 자리가 맞았다. 이 과정은 기획 결정 기록에 남겼다.</p>
<p>같은 날 캐릭터 아이콘 규칙도 정했다. 백팩·상세 창·도감처럼 캐릭터 자체를 보여 주는 큰 아이콘은 상반신으로 자르고 성급을 표시한다. 유물 설명 속 얼굴처럼 작은 아이콘은 전신으로 두고 성급을 뺀다.</p>

<h2 id="g9" data-tags="plan dev">9. 세션이 일곱 개가 됐다</h2>
<p>24일 밤에 기획 세션이 자기를 UI 세션으로 알고 UI 일을 건드린 일이 있었다. 그래서 세션마다 역할 파일을 만들었다. 맡는 일, 고치는 파일, 다른 세션에 넘기는 일을 적었다. 세션은 시작할 때 자기 이름을 확인하고 맞는 파일을 읽는다.</p>
<p>같은 밤에 직접 플레이로 버그와 재미를 보는 QA 세션을 더했다. QA는 다른 주소(포트)에서 게임을 연다. 주소가 다르면 저장 데이터도 따로라, QA가 돌린 판이 내 테스트 저장을 덮어쓰지 않는다. 프로젝트도 git과 GitHub에 올렸다.</p>
<p>25일에는 유튜브 영상을 맡는 홍보 세션을 열었다. 처음엔 게임 플레이 쇼츠를 생각했지만 "게임 영상은 내가 아직 만족이안돼서 데브로그가 맞을듯." 1화 소재는 EP.02의 덩치 코스트다. 아이디어를 내고 2시간 반 만에 되돌린 사건 하나를 5분으로 다룬다. AI와 나눈 대화는 화면 그대로 쓰지 않고 도트 말풍선으로 다시 만든다. 1화의 한 줄도 정했다. "재밌다고, 내 게임에서까지 재밌는 건 아니었다."</p>
<p>채널 이름은 "겜개발자 빅토리 | Bigtory Studio"로 정하고 프로필과 배너도 만들었다. 타이니 배틀 히어로즈 다음 게임도 올릴 채널이라, 게임보다 개발자를 앞에 세웠다.</p>

// 분야 꼬리표: 글 안 섹션 제목 옆에만 보인다(목록·필터 없음).
const PARTS = { plan:'기획', dev:'개발', qa:'QA', design:'디자인' };
const chip = k => `<span class="chip">#${PARTS[k]}</span>`;

// 오른쪽 번호 내비: [요소, 이름] 목록을 받아 1·2·3 버튼으로 만들고, 지금 보이는 곳을 표시한다.
const side = document.getElementById('side');
let watch;
function sideNav(items, title){
  watch?.disconnect();
  side.hidden = !items.length;
  side.innerHTML = `<p class="t">${title || ''}</p>` + items.map(([el, label], n) => `<button type="button" title="${esc(label)}"><b>${n + 1}</b><span>${esc(label)}</span></button>`).join('');
  const btns = [...side.querySelectorAll('button')];
  btns.forEach((b, n) => b.onclick = () => items[n][0].scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }));
  watch = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const n = items.findIndex(([el]) => el === e.target);
    btns.forEach((b, k) => b.toggleAttribute('aria-current', k === n));
  }), { rootMargin: '-30% 0px -60% 0px' });
  items.forEach(([el]) => watch.observe(el));
}

function post(i){
  const p = POSTS[i], prev = POSTS[i-1], next = POSTS[i+1];
  document.title = `${p.ep} ${p.title}`;
  const link = (q, label, cls) => !q ? '<span></span>' : q.soon
    ? `<span class="${cls}"><small>${label}</small>${q.ep} (준비 중)</span>`
    : `<a class="${cls}" href="#${q.id}"><small>${label}</small>${q.ep} ${esc(q.title)}</a>`;
  view.innerHTML = `<p class="crumb"><a href="#devlog">개발일지</a> / ${p.ep}</p>
    <p class="px">Devlog ${p.ep}</p><h1>${esc(p.title)}</h1><p class="lede">${esc(p.summary)}</p>
    <ul class="meta">${p.meta.map(([k,v]) => `<li>${k} <b>${v}</b></li>`).join('')}<li>게시 <b>${p.date}</b></li></ul>

    <nav class="pn" aria-label="이전·다음 편">${link(prev,'이전 편','')}${link(next,'다음 편','r')}</nav>`;
  const hs = [...view.querySelectorAll('article h2')];
  sideNav(hs.map(h => [h, h.textContent.replace(/^\d+\.\s*/, '')]), '이번 편에서');
  hs.forEach(h => h.dataset.tags && h.insertAdjacentHTML('beforeend', ' ' + h.dataset.tags.split(' ').map(chip).join(' ')));
  view.querySelectorAll('[data-to]').forEach(a => a.addEventListener('click', e => {

  }));
}

      q3:'그래서 무엇부터 갖추나?', so:['모델 등급을 올리기 전에 근거 문서와 기록, 검수부터 갖춘다.'] },

  use:[
    ['본 적 없는 건 모른다, 예시는 잘 따라 한다','우리 게임만의 규칙과 기준은 문서로 준다. 그림은 말로 설명하기보다 기준 그림 하나를 같이 준다.'],
    ['틀린 말도 자신 있게 한다','AI가 낸 수치는 바로 반영하지 않고 봇 시뮬레이션으로 확인한다. 게임 전체 검수는 다른 모델에 맡긴다.'],
    ['대화가 끝나면 잊는다','결정과 되돌린 기획은 파일에 남기고, 버전은 git으로 관리한다.'],
    ['모델마다 비용과 속도가 다르다','기획은 큰 모델에 생각 깊이를 높게, UI와 페이지 반복 수정은 가볍고 빠른 모델로, 검수는 다른 모델로 맡긴다.'],
  ],
  useNote:['토큰에 큰돈을 쓴다고 꼭 비효율은 아니다.','쓴 돈보다 얻는 게 크면 효율적이다.','회사는 사람의 시간이 토큰보다 비싸고, 개인은 정해진 한도 안에서 써야 해서 기준이 다르다.'],
  cmds:[
    ['/model','모델을 바꾼다. 뒤에 아무것도 안 붙이면 고르는 창이 뜬다.','반복 수정은 가벼운 모델로, 설계는 큰 모델로 바꿀 때 쓴다.'],
    ['/effort','생각 깊이를 정한다. low부터 max까지, 또는 auto로 고른다.','기획처럼 따져 볼 게 많을 때 올리고, 단순 작업에는 내린다.'],
    ['/fast','빠른 모드를 켜고 끈다.','속도가 중요한 작업일 때 쓴다.'],
  ],
  cmdNote:['지금 쓰는 모델들은 생각을 끌 수 없고, 깊이만 조절한다.','데스크톱 앱에서는 모델과 생각 깊이를 앱 화면에서 바꾸는 쪽이 확실하다.'],
  tips:[["확인된 것과 추측을 나눠서 답해 줘. 추측이면 근거도 같이 적어 줘.","틀린 말도 맞는 말처럼 자신 있게 하니, 어느 쪽인지 스스로 표시하게 한다."],["이 답에서 틀렸을 가능성이 있는 부분부터 짚어 줘.","확인하는 단계가 없으니, 확인할 곳을 먼저 찾게 해서 검토 시간을 줄인다."],["이 작업에 가벼운 모델로 충분한지, 큰 모델이 필요한지 이유와 함께 알려 줘.","모델마다 비용과 속도가 다르니, 일에 맞는 모델을 고르는 근거를 받는다."]],
  mine:[
    ['AI가 git을 쓰면 로컬에서 확인하기 어렵다고 해서 그대로 믿었다.','index 파일을 391개까지 복사해 가며 버전을 관리했다.','확인해 보니 사실이 아니었다.'],
    ['공격 자세 그림을 만들 때 영웅마다 키가 제각각으로 나왔다.','확정된 36칸 그림을 28배로 키운 기준 그림을 같이 주자 키가 맞춰졌다(EP.03).'],
    ['게임 전체 검수를 다른 모델(Fable)에 맡겼다.','지는 쪽이 이기는 쪽보다 더 받는 경제 구멍을 찾았다(EP.05).'],
    ['게임 개발 세션 6개 중 검수만 Fable이고, 나머지 다섯은 같은 모델과 같은 생각 깊이를 쓴다.','역할별로 나누면 나아지는지는 아직 재 보지 않았다.'],
  ] },
{ name:'토큰', one:'LLM이 글을 읽고 쓰는 단위',
  what:[
    { lines:['LLM이 글을 읽고 쓰는 단위다.','글자 하나도, 단어 하나도 아닌 그 사이 크기의 조각이다.'],
      q1:'왜 조각으로 자르나?', why:['컴퓨터는 숫자만 다룬다.','글을 조각으로 잘라 조각마다 번호를 붙여 계산한다.'],
      q2:'왜 글자나 단어가 아니라 조각인가?', why2:['글자로 자르면 조각이 너무 많아 계산이 길어진다.','단어로 자르면 단어 종류가 끝없이 많아진다.','자주 나오는 덩어리는 한 조각으로, 드문 말은 잘게 자르는 중간 방식을 쓴다.'],
      q3:'그래서 무엇이 달라지나?', so:['자주 쓰이는 말일수록 적은 토큰으로 처리된다.'] },
    { lines:['읽고 쓴 토큰 수가 곧 비용이고 사용량이다.'],
      q1:'왜 토큰 수가 비용인가?', why:['답을 한 조각 만들 때마다 계산을 한 번씩 한다.','내가 보낸 글도 토큰으로 바꿔 전부 읽는다.','채팅으로 보낸 요청도, 자동으로 들어가는 CLAUDE.md도 모두 읽는 글이다.'],
      q3:'그래서 무엇을 줄이나?', so:['답을 길게 받을수록, 많이 읽힐수록 사용량이 는다.','필요 없는 파일과 긴 설명은 읽히지 않는다.'] },
    { lines:['대화가 길어질수록 같은 질문도 비싸진다.'],
      q1:'왜 길수록 비싸지나?', why:['답할 때마다 지금까지의 대화를 처음부터 다시 읽는다.','대화가 길면 짧은 질문 하나에도 앞의 글 전체가 토큰으로 계산된다.'],
      q2:'왜 매번 다시 읽나?', why2:['모델은 대화를 저장하지 않는다.','기억하는 것처럼 보이려면 앞의 글을 매번 함께 넣어 줘야 한다.'],
      q3:'그래서 언제 새 대화를 여나?', so:['주제가 바뀌면 새 대화를 연다.','정한 내용은 파일로 남기고, 새 대화에서는 그 파일만 읽힌다.'] },
    { lines:['한 번에 읽을 수 있는 양도 토큰으로 정해져 있다.'],
      q1:'왜 한계가 있나?', why:['모델이 한 번에 계산할 수 있는 길이에 한계가 있다.'],
      q3:'그래서 넘치면 어떻게 되나?', so:['오래된 대화부터 요약된다.','큰 파일은 통째로 주지 않고 필요한 부분만 읽힌다.'] },
    { lines:['같은 글도 모델과 언어에 따라 토큰 수가 다르다.'],
      q1:'왜 언어마다 다른가?', why:['모델마다 글을 자르는 방식이 다르다.','학습한 글에 영어가 많아서, 영어는 큰 덩어리로, 한국어는 더 잘게 잘리는 편이다.'],
      q3:'그래서 무엇을 알아 두나?', so:['같은 내용이면 한국어가 토큰을 더 쓰는 경우가 많다.'] },
    { lines:['이미지도 토큰이 된다.'],
      q1:'왜 이미지도 토큰인가?', why:['이미지도 작은 조각으로 잘라 숫자로 바꿔 읽는다.','그림이 클수록 조각이 많아진다.'],
      q3:'그래서 스크린샷은 어떻게 주나?', so:['필요한 부분만 잘라서 준다.'] },
    { lines:['클리어는 대화를 비우고, 컴팩트는 대화를 요약해서 이어 간다.'],
      q1:'왜 둘 다 토큰을 줄이나?', why:['다음 질문부터 다시 읽을 앞의 글이 줄어든다.','클리어는 아무것도 들고 가지 않고, 컴팩트는 요약본만 들고 간다.'],
      q2:'요약하려면 전체를 읽는데 왜 줄어드나?', why2:['전체는 요약할 때 한 번만 읽는다.','그 뒤로는 짧은 요약본만 읽어서, 대화가 길게 이어질수록 아끼는 양이 커진다.'],
      q3:'그래서 언제 무엇을 쓰나?', so:['앞의 대화가 필요 없는 새 작업이면 클리어를 쓴다.','같은 작업을 이어 가야 하면 컴팩트를 쓴다.','요약에서 세부 숫자나 문장이 빠질 수 있으니, 중요한 건 미리 파일에 남긴다.'] },
    { lines:['토큰 절약 플러그인은 덜 읽히거나 덜 쓰게 만든다.'],
      q1:'왜 그렇게 하면 줄어드나?', why:['토큰은 읽은 양과 쓴 양만큼 쓰인다.','둘 중 하나만 줄여도 사용량이 준다.'],
      q2:'어떤 방식으로 줄이나?', why2:['파일을 통째로 읽히지 않고 필요한 부분만 찾아 읽게 한다.','명령 실행 결과처럼 긴 출력을 잘라서 넘긴다.','길어진 대화를 요약한다.','짧게 답하라는 지시를 넣는다.','찾아보는 일은 작은 모델에 맡기고 결과만 받는다.','자르고 찾는 일은 일반 프로그램이 해서 토큰을 쓰지 않는다.'],
      q3:'그래서 무엇을 조심하나?', so:['덜 읽히면 필요한 내용까지 빠질 수 있다.','너무 짧게 답하게 하면 설명이 부족해진다.','절약한 만큼 결과가 나빠지지 않았는지 같은 일로 비교해 본다.'] },
  ],
  use:[
    ['읽힌 만큼 쓴다','세션에 프로젝트 폴더 전체를 읽히지 않는다. 일에 필요한 파일만 지정해 준다.'],
    ['대화가 길수록 비싸진다','역할별로 세션을 나눈다. 하루 작업이 끝나면 개발일지에 남기고, 다음 날은 새 대화로 시작한다.'],
    ['세션끼리 주고받는 말도 토큰이다','세션 간 알림은 끝났을 때 한 번만 짧게 보낸다.'],
    ['이미지는 크다','화면 확인용 스크린샷은 문제 부분만 잘라 준다.'],
  ],
  cmds:[
    ['/context','지금 문맥이 얼마나 찼는지 보여 준다.','답이 앞 내용을 놓치는 것 같을 때 먼저 확인한다.'],
    ['/usage','사용량과 요금제 한도를 보여 준다. /cost도 같다.','한도가 얼마나 남았는지 궁금할 때 쓴다.'],
    ['/compact','대화를 요약하고 요약본으로 이어 간다. 뒤에 무엇을 중심으로 요약할지 적을 수 있다.','같은 작업을 이어 가는데 대화가 너무 길어졌을 때 쓴다.'],
    ['/clear','대화를 비우고 새로 시작한다. 메모리와 CLAUDE.md는 남는다.','앞의 대화가 필요 없는 새 작업을 시작할 때 쓴다.'],
    ['/btw','대화 기록에 남지 않는 곁가지 질문을 한다.','본 대화를 길게 만들지 않고 잠깐 물어볼 때 쓴다.'],
    ['/rewind','특정 지점으로 대화를 되돌리거나, 그 지점부터 요약한다.','엉뚱한 방향으로 길게 간 대화를 잘라 낼 때 쓴다.'],
  ],
  cmdNote:['문맥이 한계에 가까워지면 자동으로 컴팩트가 실행된다.','자동 컴팩트 뒤에도 CLAUDE.md와 메모리는 다시 들어간다.'],
  tips:[["파일 전체를 읽지 말고 상점 화면 부분만 읽고 고쳐 줘.","읽힌 만큼 토큰을 쓰니, 필요한 부분만 읽게 한다."],["지금까지 정한 내용을 파일로 정리해 줘. 새 대화에서는 이 파일만 읽고 이어 갈 거야.","대화가 길수록 매번 다시 읽어 비싸지니, 정리한 파일 하나로 새로 시작한다."],["결과는 바뀐 부분만 짧게 보고해 줘.","쓴 글도 토큰이니, 답의 길이를 줄인다."]],
  mine:[
    ['세션끼리 시작해요를 주고받다가 토큰이 빨리 닳았다.','끝났을 때 한 번만 짧게 알리기로 바꿨다(EP.01).'],
    ['이 공부 대화도 길어져서 자동 컴팩트로 한 번 요약됐다.','요약 뒤에는 앞에서 쓴 문장을 그대로 기억하지 못해, 파일과 페이지에 남긴 것을 다시 읽었다.'],
    ['지금 세션에는 ponytail이라는 플러그인이 켜져 있다.','가장 작은 변경으로 끝내고 답을 짧게 하라는 지시가 들어 있다.','토큰을 아끼는 프롬프트 플러그인의 예다.','켰을 때와 껐을 때 사용량 차이는 재 보지 않았다.'],
    ['한국어가 토큰을 더 쓰는지도 아직 직접 재 보지 않았다.'],
  ] },

      q2:'왜 일부러 섞어 뽑나?', why2:['늘 가장 그럴듯한 말만 고르면 답이 딱딱해지고 같은 말을 되풀이하기 쉽다.','조금 섞어야 자연스럽고 다양한 답이 나온다.'],

      q3:'그래서 무엇을 나누나?', so:['긴 답일수록 매번 더 많이 달라진다.','중요한 결과는 짧은 단위로 나눠서 받는다.'] },

      q3:'그래서 무엇을 고정하나?', so:['매번 같아야 하는 것은 규칙 문서로 적어 같이 넣는다.','CLAUDE.md는 답을 하나로 만들지는 않지만, 규칙에 맞는 답이 나올 확률을 높인다.'] },

  tips:[["이 기획안을 서로 다른 방향으로 여러 개 만들어 줘. 비교해서 고를게.","매번 답이 다른 성질을 거꾸로 살려, 여러 안을 받아 고른다."],["수치는 직접 계산하지 말고, 계산하는 스크립트를 돌린 결과로 알려 줘.","계산도 확률로 하니, 정답이 하나인 일은 프로그램에 맡긴다."],["한 장만 먼저 만들어 보여 줘. 확인하면 나머지를 할게.","길수록 많이 흔들리니, 작은 단위로 확인하고 넘어간다."]],

{ name:'프롬프트', one:'LLM에게 주는 글 전체',

{ name:'문맥 관리', one:'한 번에 볼 범위에 무엇을 넣고 뺄지', useTitle:'문맥 관리를 잘 하려면',
  what:[{"lines":["문맥은 LLM이 한 번에 보는 글 전체다."],"q1":"무엇이 문맥에 들어가나?","why":["기본 지시와 CLAUDE.md, 메모리가 맨 앞에 들어간다.","지금까지 나눈 대화가 그 뒤를 잇는다.","읽은 파일 내용과 명령 실행 결과도 모두 들어간다."],"q3":"그래서 무엇을 알아 두나?","so":["파일 하나를 읽히면 그 내용 전체가 문맥을 차지한다.","내가 보낸 말보다 도구가 가져온 글이 훨씬 클 때가 많다."]},{"lines":["문맥이 길어지면 답의 질이 떨어진다."],"q1":"왜 떨어지나?","why":["볼 글이 많을수록 지금 필요한 내용을 찾기 어려워진다.","글이 길어질수록 한 부분에 가는 주의가 줄어, 다 읽고도 흘려듣게 된다."],"q2":"그럼 어디를 가장 흘려듣나?","why2":["긴 글의 맨 앞과 맨 끝은 비교적 잘 보고, 가운데를 놓치기 쉽다는 연구 결과가 있다.","오래 이어진 대화라면 중간쯤에 말로 정한 규칙이 가장 묻히기 쉽다."],"q3":"그래서 어떻게 하나?","so":["한 세션에는 한 가지 일만 맡긴다.","꼭 지킬 규칙은 대화 중간에 말로 두지 말고 CLAUDE.md에 적는다.","길어지면 컴팩트하거나 새로 연다."]},{"lines":["문맥이 넘치면 앞부분이 요약된다."],"q1":"왜 요약되나?","why":["한 번에 볼 수 있는 양에 한계가 있다.","한계에 가까워지면 오래된 대화부터 요약해 자리를 만든다."],"q3":"그래서 무엇을 남기나?","so":["요약에서 세부 숫자와 문장이 빠질 수 있다.","꼭 필요한 결정은 대화가 아니라 파일에 적는다.","CLAUDE.md와 메모리는 요약 뒤에도 다시 들어간다."]},{"lines":["서브에이전트는 문맥을 따로 쓴다."],"q1":"왜 문맥이 아껴지나?","why":["서브에이전트는 자기 문맥에서 파일을 읽고 찾아본다.","메인 대화에는 결과 요약만 돌아온다."],"q3":"그래서 언제 맡기나?","so":["많이 읽어야 하지만 결론만 필요한 일을 맡긴다.","웹 페이지 읽기나 문서 찾아보기 같은 일이다."]},{"lines":["필요한 것만 골라 넣는 것이 문맥 관리다."],"q1":"왜 골라 넣나?","why":["넘치면 중요한 것을 흘려듣는다."],"q2":"골라 넣으면 빠진 건 어떻게 되나?","why2":["모르는 내용이어도 멈추지 않고 지어낼 수 있다.","처음에는 꼭 필요한 것만 넣고, 나머지는 찾는 길을 알려 준다.","필요해진 순간에 필요한 파일만 읽게 하면 넘치지 않는다."],"q3":"그래서 어떻게 고르나?","so":["근거가 부족하면 지어내지 말고 물어보라고 규칙으로 적는다.","파일은 통째로 주지 말고 필요한 부분만 지정한다.","늘 필요한 건 CLAUDE.md에, 가끔 필요한 건 스킬에 둔다."]}],
  use:[["읽힌 글이 모두 문맥이다","기획 세션에는 data.js 전체 대신 바꿀 부분만 지정한다."],["길어지면 흘려듣는다","기획, UI, 이미지처럼 세션을 역할별로 나눈다."],["넘치면 요약된다","되돌린 기획은 기획결정기록.md에 남긴다."],["빠진 건 지어낸다","기획 요청을 받으면 기획결정기록.md를 먼저 찾아보게 한다."],["서브에이전트는 문맥을 따로 쓴다","게임 전체 검수처럼 많이 읽는 일은 따로 맡기고 결과만 받는다."]],
  cmds:[["/context","지금 문맥이 얼마나 찼고 무엇이 차지하는지 보여 준다.","답이 앞 내용을 놓치는 것 같을 때 먼저 확인한다."],["/compact","대화를 요약하고 요약본으로 이어 간다. 뒤에 무엇을 중심으로 요약할지 적을 수 있다.","같은 작업을 이어 가야 하는데 대화가 길어졌을 때 쓴다."]],
  tips:[["근거가 부족하면 지어내지 말고 나한테 물어봐.","골라 넣으면 빠진 내용을 지어낼 수 있으니, 모를 때 할 일을 정해 준다."],["이 조사는 서브에이전트로 맡기고 결론만 알려 줘.","많이 읽는 일을 따로 맡겨서 메인 대화의 문맥을 깨끗하게 둔다."],["/compact 이번 세션에서 정한 화면 규칙 중심으로 요약해.","요약에서 세부가 빠질 수 있으니, 남길 내용을 직접 지정한다."]],
  mine:[["이 공부 대화는 길어져서 자동으로 한 번 요약됐다.","요약 뒤에도 메모리에 적어 둔 형식 규칙은 그대로 지켜졌다."],["명령어 목록은 서브에이전트에게 공식 문서를 찾아보게 하고, 결과 표만 받았다.","문서 여러 쪽을 메인 대화에 넣지 않았다."],["게임 개발은 세션 6개로 나눴다.","같은 CLAUDE.md를 읽지만, 대화는 세션마다 따로다."],["이력서 폴더 CLAUDE.md에는 근거가 부족하면 사용자에게 질문하라고 적혀 있다."]] },
{ name:'메모리', one:'새 대화에서도 이어지는 약속',
  what:[{"lines":["새 대화를 열면 앞 대화에서 한 말은 모른다.","메모리 파일에 저장해 둔 약속만 새 대화에서도 안다."],"q1":"왜 대화는 넘어가지 않나?","why":["모델은 대화를 저장하지 않는다.","대화도 글이지만 그 대화 안에만 있고, 끝나거나 요약되면 사라진다."],"q2":"그럼 메모리는 어디에 남나?","why2":["대화와 별도로 메모리 폴더에 md 파일로 저장한다.","약속 하나에 파일 하나를 두고, 목차 파일(MEMORY.md)이 새 대화를 시작할 때 자동으로 읽힌다."],"q3":"그래서 무엇을 남기나?","so":["짧게 답하기처럼 함께 정한 약속을 남긴다.","내 경력이나 프로젝트 상황처럼 다음에도 알아야 할 사실을 남긴다."]},{"lines":["메모리와 CLAUDE.md는 둘 다 자동으로 읽히지만 쓰임이 다르다."],"q1":"무엇이 다른가?","why":["CLAUDE.md는 프로젝트 폴더 안에 있는 규칙 문서라 사람이 직접 열고 고친다.","메모리는 Claude 쪽 설정 폴더에 있고, 주로 AI가 대화하며 쓰고 고친다."],"q3":"그래서 무엇을 어디에 두나?","so":["모두가 지킬 프로젝트 규칙은 CLAUDE.md에 둔다.","나와 일하는 방식과 피드백은 메모리에 둔다."]},{"lines":["메모리는 매 답마다 다시 읽힌다."],"q1":"왜 매번 읽히나?","why":["모델은 답할 때마다 대화 전체를 처음부터 다시 읽는다.","메모리는 그 대화 맨 앞에 붙어 있어서 같이 읽히고, 요약된 뒤에도 다시 들어간다."],"q3":"그래서 무엇을 빼나?","so":["파일이나 코드에 이미 있는 내용은 남기지 않는다.","이번 대화에서만 필요한 내용도 남기지 않는다."]},{"lines":["틀린 기억은 지워야 한다."],"q1":"왜 지워야 하나?","why":["남아 있는 기억은 매번 사실처럼 읽힌다.","틀린 기억이 남으면 같은 실수를 계속한다."],"q3":"그래서 어떻게 관리하나?","so":["약속이 바뀌면 기존 파일을 고쳐 쓴다.","보이지 않는 곳에 쌓이니, 가끔 목록을 확인하고 겹치거나 낡은 것을 정리한다."]}],
  use:[["대화는 남지 않는다","기획 결정은 기획결정기록.md에, 그날 한 일은 개발일지에 남긴다."],["규칙과 약속은 자리가 다르다","게임 규칙은 CLAUDE.md에, 답변 방식과 피드백은 메모리에 둔다."],["틀린 기억은 계속 틀린다","규칙을 바꾸면 메모리의 예전 기록도 같이 고친다."]],
  tips:[["이건 앞으로도 기억해 줘.","대화는 남지 않으니, 다음에도 필요한 약속은 메모리 파일로 옮기게 한다."],["지금 메모리에 무엇이 저장돼 있는지 보여 줘.","메모리는 매번 읽히니, 무엇이 읽히고 있는지 가끔 확인한다."],["이 기억은 이제 틀렸으니 고쳐 줘.","틀린 기억은 계속 사실처럼 읽히니 바로 고친다."]],
  mine:[["짧게 답하기, 따옴표 쓰지 않기 같은 답변 방식을 메모리에 남겼다.","새 대화에서도 같은 방식으로 답했다."],["이 공부 일지의 형식도 메모리에 남겼다.","빈 칸을 비워 두기로 했다가 빼기로 바꿨을 때, 기존 파일을 고쳐 썼다."],["방향을 정해 줄 때마다 메모리 파일이 하나씩 생기거나 고쳐졌다.","확인해 보니 이 프로젝트에만 메모리 파일이 9개 있었다."]] },
{ name:'스킬', one:'필요할 때만 불러오는 작업 설명서',
  what:[{"lines":["스킬은 그 일을 할 때만 불러오는 작업 설명서다."],"q1":"왜 필요할 때만 부르나?","why":["CLAUDE.md는 매번 읽혀서 길수록 토큰이 든다.","가끔 하는 일의 절차까지 넣으면 매번 낭비다."],"q2":"그럼 언제 불러올지는 어떻게 아나?","why2":["스킬마다 이름과 한 줄 설명은 늘 문맥에 들어 있다.","맡은 일이 그 설명과 맞으면 그때 본문을 불러온다.","필요한 절차를 필요해진 순간에 찾아 읽는다는 점이 에이전트의 장점이다."],"q3":"그래서 무엇을 스킬로 만드나?","so":["자주 하지만 매번 하지는 않는 반복 작업을 만든다.","절차가 길고 매번 같은 일일수록 좋다."]},{"lines":["스킬도 프롬프트라 확률을 높일 뿐이다."],"q1":"왜 확실하지 않나?","why":["스킬 본문도 결국 모델이 읽는 글이다.","따를 확률이 높아질 뿐, 반드시 지키게 하지는 못한다."],"q3":"그래서 꼭 지킬 건 어떻게 하나?","so":["절대 어기면 안 되는 규칙은 훅으로 검사한다."]},{"lines":["스킬과 서브에이전트는 다르다."],"q1":"무엇이 다른가?","why":["스킬은 내가 꺼내 보는 설명서라, 읽은 내용이 내 문맥에 쌓인다.","서브에이전트는 대신 일하러 보내는 다른 AI라, 결과만 돌아온다."],"q3":"그래서 언제 무엇을 쓰나?","so":["방법만 알면 바로 할 수 있는 일은 스킬로 한다.","많이 읽어야 하는데 결론만 필요한 일은 서브에이전트에 맡긴다."]},{"lines":["플러그인은 남이 만들어 둔 스킬 묶음이다."],"q1":"무엇이 들어 있나?","why":["스킬, 명령어, 훅 같은 것을 한 번에 설치하도록 묶어 둔다."],"q3":"그래서 무엇을 조심하나?","so":["켜 두면 그 스킬 설명도 매번 문맥에 들어간다.","안 쓰는 플러그인은 끈다.","남이 만든 지시라 결과가 내 기준에 맞는지 확인한다."]},{"lines":["스킬은 직접 만들 수 있다."],"q1":"어떻게 만드나?","why":["스킬 폴더에 SKILL.md 파일을 두고, 맨 위에 이름과 언제 쓸지를 적는다.","그 아래에 절차를 적는다."],"q2":"왜 언제 쓸지 한 줄이 중요한가?","why2":["그 한 줄을 보고 불러올지 정한다.","설명이 흐리면 필요할 때 안 불리거나, 필요 없을 때 불린다."],"q3":"그래서 언제 만드나?","so":["같은 절차를 여러 번 설명하고 있다면 스킬로 만들 때다."]}],
  use:[["필요할 때만 읽힌다","이미지 요청문 쓰는 절차, 봇 시뮬레이션 돌리는 절차를 스킬로 만든다."],["한 줄 설명이 부를 때를 정한다","캐릭터 이미지를 만들 때 쓴다처럼 언제 쓰는지 분명히 적는다."],["확률만 높인다","36칸 격자, 48색 팔레트 같은 그림 규격은 스킬에 적고, 결과는 비교 그림으로 확인한다."],["플러그인도 문맥을 쓴다","안 쓰는 플러그인은 끈다."]],
  tips:[["이 절차를 스킬로 만들어 줘. 언제 쓰는지 한 줄 설명도 같이 정해 줘.","반복 절차는 필요할 때만 읽히게 하고, 부를 때를 분명히 한다."],["지금 켜져 있는 스킬과 플러그인 목록을 보여 줘.","켜 둔 만큼 설명이 문맥에 들어가니 가끔 확인한다."],["anti-ai-writing으로 이 글을 다듬어 줘.","설명이 맞아떨어지기를 기다리지 않고, 이름으로 바로 불러온다."]],
  mine:[["anti-ai-writing과 Copyedit 플러그인을 설치해 공부 일지를 다듬었다.","설치한 대화에서는 바로 안 보였고, 새로 열린 대화에서야 스킬이 보였다."],["두 플러그인을 비교해 보니, 공부 일지에는 anti-ai 하나로 충분했다.","Copyedit은 오타가 치명적인 지원서용으로 남겨 두었다."],["아직 직접 만든 스킬은 없다.","캐릭터 이미지 만드는 절차가 첫 후보다."]] },
];

// 항목끼리 이어지는 흐름. 각 항목 맨 위에 자기가 속한 흐름을 보여 준다.
// w: 칸 사이 연결 비중. h 높음(⇒), m 중간(→), l 낮음(⇢).
const FLOWS = [
  { name:'기억 흐름', nodes:['LLM','토큰','문맥 관리','메모리'], w:['h','h','m'] },
  { name:'확률 흐름', nodes:['LLM','결과 변동성','프롬프트','스킬','훅','검증'], w:['h','h','h','l','m'] },
];
const ARROW = { h:['⇒','연결 높음'], m:['→','연결 중간'], l:['⇢','연결 낮음'] };

// 받침에 따라 은/는, 을/를을 고른다. 한글이 아니면(LLM 등) 받침 있는 쪽.
const jo = (w, withB, noB) => { const c = w.charCodeAt(w.length - 1); return w + (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 === 0 ? noB : withB); };

function vibe(){
  const ready = n => STUDY.some(s => s.name === n && !s.soon);
  const flow = t => FLOWS.filter(f => f.nodes.includes(t.name)).map(f => `<div class="flow"><span class="fl">${f.name}</span>${f.nodes.map(n =>
    n === t.name ? `<b>${esc(n)}</b>` : ready(n) ? `<a href="#vibe" data-go="${esc(n)}">${esc(n)}</a>` : `<span>${esc(n)}</span>`).reduce((acc, x, k) => acc + (k ? `<i class="${f.w[k - 1]}" title="${ARROW[f.w[k - 1]][1]}">${ARROW[f.w[k - 1]][0]}</i>` : '') + x, '')}</div>`).join('');
  // 마침표로 끝나는 문장마다 한 줄, 앞에 ▪.
  const ul = a => `<ul class="ln">${a.flatMap(x => x.split(/(?<=\.)\s+/)).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const slot = (label, a) => a ? `<div class="slot"><b>${label}</b>${ul(a)}</div>` : '';
  const item = t => t.soon
    ? `<div class="term soon"><div class="sum"><b>${esc(t.name)}</b><span>${esc(t.one)} · 준비 중</span></div></div>`
    : `<details class="term" data-name="${esc(t.name)}"${t.open ? ' open' : ''}><summary><b>${esc(t.name)}</b><span>${esc(t.one)}</span></summary><div class="tb">
      ${flow(t)}
      <h3>${esc(jo(t.name, '은', '는'))} 무엇인지</h3>
      ${t.what.map(c => `<div class="claim">${ul(c.lines)}<div class="why">${slot(c.q1, c.why)}${c.why2 ? `<div class="deep">${slot(c.q2, c.why2)}</div>` : ''}${slot(c.q3, c.so)}</div></div>`).join('')}
      <h3>${esc(t.useTitle || jo(t.name, '을', '를') + ' 잘 쓰려면')}</h3>
      <div class="tbl"><table><tr><th>${esc(t.name)}의 성질</th><th>게임 개발에 적용</th></tr>${t.use.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${ul([b])}</td></tr>`).join('')}</table></div>
      ${t.useNote ? ul(t.useNote) : ''}
      ${t.cmds ? `<h3>명령어</h3>
      <div class="tbl"><table><tr><th>명령어</th><th>하는 일</th><th>언제 쓰나</th></tr>${t.cmds.map(([c, d, w]) => `<tr><td><code>${esc(c)}</code></td><td>${ul([d])}</td><td>${ul([w])}</td></tr>`).join('')}</table></div>
      ${t.cmdNote ? ul(t.cmdNote) : ''}` : ''}
      ${t.tips ? `<h3>추천 프롬프트</h3>
      <div class="tips">${t.tips.map(([p, why]) => `<div class="tip"><div class="code"><pre>${esc(p)}</pre><button type="button" class="cp">복사</button></div>${ul([why])}</div>`).join('')}</div>` : ''}
      <h3>나의 경험</h3>
      <div class="mine">${t.mine.map(s => `<div class="note">${ul(s)}</div>`).join('')}</div>
    </div></details>`;
  view.innerHTML = `
  <p class="px eyebrow">Vibe Coding</p>
  <h1>바이브코딩</h1>
  <p class="lede">AI와 함께 만들며 배운 것을 적는다. 뜻만 외우지 않고, 왜 그런지와 그래서 내 작업에서 어떻게 쓰는지까지 본다.</p>
  <h2>1부. LLM에게 무엇을 넣나</h2>
  ${STUDY.map(item).join('')}`;
  view.querySelectorAll('.tip .cp').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.previousElementSibling.textContent); b.textContent = '복사됨'; }
    catch { b.textContent = '직접 선택해 주세요'; }
    setTimeout(() => b.textContent = '복사', 1500);
  });
  // 흐름에서 다른 항목을 누르면 그 항목을 펼치고 그리로 이동한다.
  view.querySelectorAll('[data-go]').forEach(a => a.onclick = e => {
    e.preventDefault();
    const d = [...view.querySelectorAll('details.term')].find(x => x.dataset.name === a.dataset.go);
    if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
}

const PAGES = { about:['소개',about], game:['게임소개',game], devlog:['개발일지',devlog], vibe:['바이브코딩',vibe] };
function route(){
  const h = location.hash.slice(1), i = POSTS.findIndex(p => p.id === h && !p.soon);
  const tab = i >= 0 ? 'devlog' : (PAGES[h] ? h : 'about');
  sideNav([]);
  if (i >= 0) post(i); else { PAGES[tab][1](); document.title = `${PAGES[tab][0]} · 빅토리 스튜디오`; }
  document.querySelectorAll('[data-tab]').forEach(a => a.dataset.tab === tab ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  scrollTo(0,0);
}
addEventListener('hashchange', route);
const prog = document.getElementById('prog');
const onScroll = () => { const max = document.documentElement.scrollHeight - innerHeight; prog.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`; };
addEventListener('scroll', onScroll, { passive: true }); addEventListener('resize', onScroll); addEventListener('hashchange', onScroll);
route();
</script>

</body></html>
