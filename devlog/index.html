<style>
/* layout: 한 줄 읽기 칸(약 680px) + 픽셀 전장 띠. 목록(#)과 글(#ep-NN)을 해시로 바꿔 보여 줌 */
:root{

  --accent:#6f4766; --moss:#46612f; --dirt:#7d5236; --code:#e2e5dc;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --fg:#e7e7e0; --muted:#a3a89f; --line:#30353a;
  --accent:#d6a0c6; --moss:#a3c784; --dirt:#d39a72; --code:#262a2f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --fg:#e7e7e0; --muted:#a3a89f; --line:#30353a;
  --accent:#d6a0c6; --moss:#a3c784; --dirt:#d39a72; --code:#262a2f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.75 var(--sans);word-break:keep-all}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.site{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header.site a{color:var(--fg);text-decoration:none;font-weight:700;display:flex;align-items:center;gap:8px}
header.site img{width:36px;height:36px;image-rendering:pixelated}
.brand .px{font-size:8px}
.tabs{display:flex;gap:4px}
header.site .tabs a{font-weight:600;font-size:15px;color:var(--muted);padding:6px 10px;border-radius:4px}
header.site .tabs a[aria-current="page"]{color:var(--fg);background:var(--panel);box-shadow:inset 0 -2px 0 var(--accent)}
/* 소개·게임 */
.eyebrow{margin:40px 0 6px}
.statement{font-size:clamp(20px,3.6vw,26px);line-height:1.5;font-weight:700;margin:0 0 14px;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.facts div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.facts b{display:block;font-size:24px;line-height:1.2;color:var(--accent);font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--muted)}
.dirs{display:grid;gap:18px;margin:12px 0;padding:0;list-style:none;counter-reset:d}
.dirs li{display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.dirs li::before{counter-increment:d;content:"0" counter(d);font-family:var(--pixel);font-size:11px;color:var(--moss);padding-top:6px;grid-row:span 2}
.dirs h3{margin:0}
.dirs p{margin:0;color:var(--muted)}
.cta{display:inline-block;margin-top:8px;padding:10px 16px;border:1px solid var(--accent);border-radius:4px;text-decoration:none;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.tags li{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
/* 개발일지 카드: 대표 이미지 + 정보 */
.cards{display:grid;gap:20px;margin:24px 0;padding:0;list-style:none}
.card{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:18px;align-items:start;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--fg)}

/* 오른쪽 번호 내비: 본문(1040px) 옆에 자리가 있을 때만 */

#side b{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
#side span{display:none}

/* 넓은 화면: 본문 오른쪽에 붙는 목차 상자. 이름은 두 줄까지 */

  #side button{align-items:flex-start;gap:4px}
  #side b,#side button[aria-current] b{display:inline;width:auto;height:auto;min-width:1.5em;border:0;background:none;color:inherit;font-size:14px;font-weight:inherit}

  #side span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
}
@media (max-width:1180px){#side{display:none}}
.notes.brief p,.notes.brief img{display:none}
.notes.brief li{padding:8px 0}
button.btn{background:none;cursor:pointer;font-family:var(--pixel);font-size:9px;letter-spacing:.08em;padding:7px 10px}
button.btn:hover{background:var(--accent);color:var(--panel)}
.sort{display:flex;gap:0;margin:20px 0 0}
.sort button{padding:6px 14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:600 14px var(--sans);cursor:pointer}

.notes{list-style:none;padding:0;margin:16px 0;display:grid}
.notes li{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.notes time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.notes b{font-size:16px}
.notes p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.notes img{display:block;margin-top:10px;max-width:min(100%,360px);max-height:220px;width:auto;border-radius:4px;border:1px solid var(--line)}
.btn{flex:none;padding:6px 12px;border:1px solid var(--accent);border-radius:4px;font-size:13px;font-weight:600;color:var(--accent)}
a.card:hover .btn{background:var(--accent);color:var(--panel)}
@media (max-width:560px){.card,.card.big{grid-template-columns:1fr}}
.px{font-family:var(--pixel);font-size:10px;letter-spacing:.08em;color:var(--moss);text-transform:uppercase}
.crumb{font-size:13px;color:var(--muted);margin-top:24px}
.crumb a{color:var(--muted)}
h1{font-size:clamp(26px,5vw,36px);line-height:1.3;margin:10px 0 10px;text-wrap:balance}
h2{font-size:23px;line-height:1.4;margin:48px 0 12px;text-wrap:balance;scroll-margin-top:16px}
h3{font-size:18px;margin:28px 0 6px}
p{margin:0 0 14px}
.lede{font-size:18px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);margin:16px 0 0;padding:0;list-style:none;font-variant-numeric:tabular-nums}
.meta b{color:var(--fg);font-weight:600}

.field{position:relative;margin:28px 0 8px;aspect-ratio:240/134;max-width:100%;background:url(img/bg_field.png) center/cover;image-rendering:pixelated;border-radius:4px;overflow:hidden}
.field img{position:absolute;bottom:14%;width:15%;image-rendering:pixelated}
.field .foe{transform:scaleX(-1)}
figcaption,.cap{font-size:13px;color:var(--muted);margin-bottom:20px}
.toc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 20px;margin:28px 0}
.toc ol{margin:8px 0 0;padding-left:20px}
.toc li{margin:2px 0}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin:8px 0 20px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}

.strip{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 4px}
.strip figure{margin:0;text-align:center}
.strip img{width:96px;height:96px;image-rendering:pixelated;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.strip figcaption{margin:4px 0 0}
.bars{display:grid;gap:8px;margin:12px 0 20px;font-size:14px}
.bar{display:grid;grid-template-columns:3.2em 1fr 3em;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.bar i{display:block;height:14px;background:var(--moss);border-radius:2px}
.bar span:last-child{text-align:right;color:var(--muted)}
/* 목록 */
.hero h1{margin-top:28px}
.posts{list-style:none;padding:0;margin:24px 0;display:grid;gap:12px}
.posts a{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--fg)}
.posts a:hover{border-color:var(--accent)}
.posts .px{grid-row:span 2;align-self:start;padding-top:6px}
.posts strong{font-size:17px;line-height:1.45}
.posts small{color:var(--muted);font-size:14px;grid-column:2}
.soon{opacity:.55;pointer-events:none}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px}
.pn a,.pn span{padding:14px 16px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--fg);font-size:15px;min-width:0}
.pn small{display:block;color:var(--muted);font-size:12px}
.pn .r{text-align:right}
/* 바이브코딩 공부 항목: 누르면 펼쳐짐. 주장(▪) 아래 왜?/왜?/그래서? */
.term{border-top:1px solid var(--line)}
.term summary,.term .sum{cursor:pointer;list-style:none;display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:12px;padding:12px 0}
.term .sum{cursor:default}
.term summary::-webkit-details-marker{display:none}
.term summary b::before{content:"▸ ";color:var(--moss)}
.term[open] summary b::before{content:"▾ "}
.term summary span,.term .sum span{color:var(--muted);font-size:15px}
.term .tb{margin:0 0 28px;font-size:15px}
.term .tb h3{margin:24px 0 8px;font-size:17px}
.term ul.ln{list-style:none;margin:0 0 10px;padding:0}
.term ul.ln li{padding-left:1.1em;text-indent:-1.1em;margin:2px 0}
.term ul.ln li::before{content:"▪ ";color:var(--moss)}
.term .claim{margin:0 0 18px}
.term .claim > ul.ln{font-weight:600}
.term .why{color:var(--muted);margin-left:1.6em;border-left:3px solid var(--line);padding-left:14px}
.term .slot b::before{content:"▼ ";font-size:11px}
.term .deep{margin:2px 0 8px 1.6em;border-left:3px solid var(--line);padding-left:14px}
.term .slot{margin:6px 0}
.term .slot b{display:block;color:var(--accent);font-size:14px}
.term .slot ul.ln{margin:0}

.term td ul.ln{margin:0}
.term .mine{display:grid;gap:10px}
.term .mine .note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:12px 16px}
.term .mine .note ul.ln{margin:0}
.term .flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 8px;font-size:13px}
.term .flow .fl{color:var(--muted);min-width:5.5em}
.term .flow b,.term .flow a,.term .flow > span:not(.fl){padding:2px 8px;border:1px solid var(--line);border-radius:3px}
.term .flow b{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.term .flow a{text-decoration:none;color:var(--fg)}
.term .flow a:hover{border-color:var(--accent)}

.term .tip ul.ln{margin:4px 0 0;color:var(--muted)}
.quiz{margin:8px 0 8px}

.qz-filter button{font-weight:500;font-size:13px;padding:4px 10px}

.qz-q{font-weight:600;margin:0 0 10px}

.qs b{grid-row:span 2}

.qz-note{border-top:1px solid var(--line);padding:10px 0}.qz-note:first-child{border-top:0;padding-top:0}

<script>
// 새 글은 POSTS 맨 아래에 하나 더 넣으면 카드·이전/다음이 같이 생긴다.
// kind: '회고' | '기획' | '테스트 기록'(기획 세션의 개발일지/YYYY-MM-DD.md를 옮길 자리). cover: 전장 위에 세울 그림 [파일, 적이면 true]
const POSTS = [
{
  id:'ep-01', ep:'EP.01', date:'2026.11.23', kind:'회고', tags:['기획','개발','디자인','QA'],
  cover:[['knight'],['bear'],['archmage'],['goblin',1],['wolf',1]],
  title:'첫 주 회고: 방치형 RPG 테스트베드가 오토배틀러가 되기까지',
  summary:'11월 16일부터 23일까지, 세션 넷으로 나눠 일한 첫 주. 무엇이 됐고 무엇이 안 됐는지.',
  meta:[['기록 기간','2026-11-16 ~ 11-23'],['작업한 날','6일'],['백업 파일','561개'],['읽는 시간','약 7분']],
  body:`
<div class="field" role="img" aria-label="게임 전장 배경 위에 선 영웅들과 적">
  <img src="img/knight.png" alt="" style="left:6%"><img src="img/bear.png" alt="" style="left:19%"><img src="img/archmage.png" alt="" style="left:32%">
  <img class="foe" src="img/goblin.png" alt="" style="right:20%"><img class="foe" src="img/wolf.png" alt="" style="right:6%">

<h2 id="e1" data-tags="plan">1. 룰렛 칸 크기는 같게, 확률은 다르게</h2>
<p>룰렛은 칸마다 1/n 확률이었다. 이걸 레벨별 등급 가중치로 바꿨다. Lv1은 일반·고급·희귀·전설·골드가 10·5·2·1·10이고, Lv10은 10·7·5·3·10이다.</p>
<p>기획 세션은 처음에 반대했다. 칸 크기가 같은데 확률이 다르면 "보이는 것과 실제가 다르다"는 이유였다. 그때 내가 든 예가 슬롯머신이었다. "카지노에서 룰렛이 다 같아 보이지만 777이 쉬워?" 좋은 건 드물다는 걸 플레이어는 이미 당연하게 받아들인다. 칸 크기를 같게 둔 건 일부러 그렇게 보이게 하려는 거다.</p>
<p>3만 번 뽑아 보니 Lv3에서 일반 23.5%, 3등급 유물 5.9%, 골드 23.5%로 가중치와 같았다. 저녁에는 룰렛 모양도 바꿨다. 후보가 늘면 두 줄이 되던 걸, 가운데 당첨 칸이 고정된 7칸 슬롯 띠로 만들었다.</p>

<p>유물값은 등급으로는 달라도 판에 따라 변하지 않는다. 클리어 골드를 레벨마다 +20G로 둔 건, 나중에 영구 강화 재료로 쓰기 좋아서다. 방랑상인 할인율도 같은 식으로 레벨표(Lv1 30% → Lv10 60%)로 바꿨다.</p>
<p class="lesson">비율로 둘 때는 1-10 유물값이 554G까지 가는 게 바로 안 보였다. 표로 두니 레벨마다 받는 골드가 한 줄로 읽힌다.</p>

<h2 id="e3" data-tags="plan design">3. 레벨업마다 하트 +1, 처음 0이 되면 버틴다</h2>
<p>플레이어 레벨이 오를 때마다 하트가 1씩 는다. 상한은 없다. 그리고 한 런에서 처음으로 0이 되면 죽지 않고 1로 남는다. 하트 1로 시작하는 시험에서 이 버티기가 있으면 런을 처음부터 다시 하는 횟수가 17번에서 9번으로 줄었다.</p>
<figure style="margin:12px 0"><img src="img/heart_bandage.png" alt="금 간 하트, 가로 붕대 하트, 비스듬한 붕대 하트 시안" style="max-width:min(100%,420px);image-rendering:pixelated;border-radius:4px"><figcaption>버틴 하트 시안. 가로 붕대는 하트를 거의 덮어서 비스듬한 쪽(D)을 골랐다.</figcaption></figure>
<p>버틴 상태는 하트 모양으로 알려 준다. 금만 간 하트에서 시작해, 붕대 3줄을 2칸 두께로 비스듬히 감았다.</p>

<h2 id="e4" data-tags="plan">4. 초월 고르는 방법이 하루에 세 번 바뀌었다</h2>
<p>어제는 제단에서 영웅을 터치해 골랐다. 오늘 써 보니 터치를 고르기에 쓰면 영웅 정보를 볼 방법이 없었다. 그래서 끌어다 놓기로 바꿨다. 오후에 "드래그는 빼"로 다시 바꿨다. 지금은 영웅을 누르면 상세 창이 뜨고, 아래 "초월" 버튼으로 제단에 놓는다.</p>
<p>돌아보면 문제는 "고르면 정보를 못 본다"였는데, 그걸 풀지 않고 방법째 옮겼다. "생각해 보면 선택에서 개선해 보려고 했어야 했어." 마지막에 고르기 자체를 고친 게 답이었다.</p>
<p class="lesson">한 가지 일을 하는 길은 하나만 둔다. 오늘 이걸 작업 규칙으로 적었다. 구매는 구매 버튼, 판매는 판매 버튼, 초월은 초월 버튼이다.</p>

<h2 id="e5" data-tags="design">5. 화면을 하나씩 다시 짰다</h2>
<p>비슷한 게임의 화면 나누기를 보고 한 번에 하나씩 바꿨다. 백팩을 늘 펼치고, 배속과 넘김을 위 HUD로 올리고, 팝업을 전장 가운데로 모았다.</p>
<figure style="margin:12px 0"><img src="img/layout_rcol.jpg" alt="전장 오른쪽에 빈 세로 기둥이 있고 전장이 작아진 화면" loading="lazy" style="max-width:100%;border-radius:4px"><figcaption>오른쪽 기둥을 세운 화면 (v419). 전장이 852×474에서 604×336으로 줄었다.</figcaption></figure>
<p>중간에 전장 오른쪽에 기둥을 세우고, 누른 영웅의 상세 정보와 상점을 거기 띄웠다. 해 보니 아무것도 안 눌렀을 때는 빈 칸이 남았고, 전장은 33% 작아졌다. "상시로 노출되는 게 아니라면 굳이 노출되는 게 어색하네." 바로 되돌렸다.</p>
<figure style="margin:12px 0"><img src="img/layout_wide.jpg" alt="전장이 화면 대부분을 차지하고 아래에 백팩과 버튼 줄이 있는 화면" loading="lazy" style="max-width:100%;border-radius:4px"><figcaption>전장을 크게 둔 화면 (v411). "전투 화면이 큰 게 좋네."</figcaption></figure>
<p>이 과정에서 정한 화면 규칙이 다섯 가지다. 버튼은 무조건 사각형이다. 버튼 색은 역할로 정한다(주 행동 노랑, 반대 짝 초록, 보조 파랑, 아이콘 어두운 보라). 창은 한 번에 하나만 연다. 누를 수 없는 버튼은 숨기지 않고 회색으로 둔다. 팝업은 전장 정가운데에 둔다.</p>

<h2 id="e6" data-tags="plan design">6. 보물상자 그림은 9장이 됐다</h2>
<p>처음 요청은 "남은 체력에 따라 상자가 3단계로 부서지는 그림"이었다. 그다음 "용을 눌러 상자를 강화하면 바뀌는 그림"으로 바로잡았다. 시안을 보고 나서 "그것도 괜찮다"가 됐다. 결국 등급 3 × 상태 3 = 9장이 됐다.</p>
<figure style="margin:12px 0"><img src="img/chest9.png" alt="1·2·3등급 보물상자가 멀쩡함, 금 가고 들썩, 부서짐 세 상태로 놓인 9칸 그림" loading="lazy" style="max-width:min(100%,460px);image-rendering:pixelated;border-radius:4px"><figcaption>등급(나무·강철·보라) × 상태(멀쩡·들썩·부서짐).</figcaption></figure>
<p>저녁에는 등급을 정하는 방법도 바꿨다. 용 버튼 대신 플레이어 레벨로 정한다(Lv1~3 1등급, Lv4~7 2등급, Lv8 이상 3등급). 등급마다 체력은 ×1·×1.5·×2.2, 보상 칸은 3·4·5개다. 체력 막대는 깎은 만큼 차오르는 막대에서 남은 체력이 줄어드는 막대로 바꿨다. "100%를 0%로 만드는 거랑 0%를 100%로 만드는 건 차이가 있다."</p>

<h2 id="e7" data-tags="qa">7. 외부 검수: 지는 쪽이 더 받고 있었다</h2>
<p>처음으로 다른 모델(Fable)에게 1-1부터 1-10까지 검수를 맡겼다. 코드는 고치지 말고 읽기만 하라고 했다. 가장 큰 발견은 "초반엔 지는 게 이득"이라는 것이었다.</p>
<div class="tbl"><table>
<tr><th>이기면</th><th>지면</th></tr>
<tr><td>클리어 골드 120~180G (Lv1~4)</td><td>위로금 200G + 모닥불 영웅 1명 + 종 골드를 또 받음 (최대 216G)</td></tr>
</table></div>
<p>원인은 두 가지 버그였다. 위로금은 준 피해 비율만큼 주게 되어 있는데, 계산에 쓰는 값이 전투 결과에 없어서 비율이 늘 0이 되고 최소값 200G만 나왔다. 그리고 지면 종 횟수가 0으로 돌아가서, 같은 판에서 종을 다시 울리면 골드를 또 받았다. 치르는 값은 하트 몇 칸뿐이다.</p>
<p>검수 결과는 아직 하나도 고치지 않았다. 진짜 문제인지 하나씩 확인하는 게 먼저다. 방향은 정했다. 지는 쪽 보상이 이기는 쪽보다 작아야 한다.</p>
<p class="lesson">숫자를 하나씩 바꿀 때는 각각 말이 됐다. 전체를 처음부터 끝까지 한 번에 읽어 보니 순서가 뒤집힌 곳이 보였다.</p>

<h2 id="e8" data-tags="plan">8. 바꾸지 않았지만 고민한 것</h2>
<h3>적도 포켓몬, 나도 포켓몬</h3>
<p>"전투적으로 보면 사실 적도 포켓몬 나도 포켓몬이게 싸우는 거 같잖아." 적과 아군이 같은 규칙으로 싸워서 그렇다. 상성이 보이게, 이긴 적 포획, 도감, ★3 진화 외형 같은 아이디어가 나왔지만 아직 해 볼 건 정하지 않았다.</p>
<h3>몹은 이질적이다</h3>
<p>적이 모두 내 영웅과 같은 규칙으로 싸우는데, 몹(슬라임, 박쥐, 해골 병사, 오우거)만 영입할 수 없는 다른 종류다. 특별한 패턴은 영웅 스킬로도 만들 수 있다. 이벤트 9종을 하나씩 보고 뺄 것을 한 번에 정리하기로 했다.</p>
<h3>도발 버튼은 직관적인가</h3>
<p>이름이 없고, 누르면 받는 골드가 안 보이고, 다음 효과는 마우스를 올려야 보인다. 위치를 아래로 옮기자는 제안도 있었지만, 위에 있어야 판 전체에 영향을 준다는 게 읽힌다. 튜토리얼로 알려 줄 수 있는 기능이라 좀 더 고민한다.</p>

  body:`
<p>EP.05를 올린 뒤에도 24일 작업은 밤까지 갔다. 그 밤부터 25일까지의 이야기다.</p>

<h2 id="g1" data-tags="design">1. 영웅 65명을 새로 그렸다</h2>
<p>기준은 기사 그림 하나였다. 코덱스와 픽셀랩에 같은 영웅을 맡겨 나란히 보고 "일단 코덱스쪽으로 가야겠다."로 정했다. 예전 그림을 같이 넣으면 그 늘씬한 체형을 따라 해서, 기사 그림만 몸 틀로 주는 방식으로 바꿨다.</p>
<p>그리면서 규칙이 하나 더 생겼다. 무기·날개·꼬리·천 끝은 몸 가까이 두고, 전체 폭은 기사보다 넓지 않게 한다. 쌍검은 칼을 양옆으로 벌리고 있어서 폭이 60칸이었는데, 두 칼을 몸 앞에 나란히(//) 들게 하니 42칸이 됐다. 이유는 한마디였다. "왜냐면 부피 차지."</p>
<p>3·4등급 32명은 등급마다 이미지 세션이 스스로 세 번 검수했다. 다시 그리게 한 이유는 대부분 "무기가 옷이나 머리와 같은 색이라 묻힌다"였다. 노란 번개 지팡이에 노란 머리, 초록 하프에 초록 옷 같은 식이다. 무기 색을 바꿔서 풀었다.</p>
<figure style="margin:12px 0"><img src="img/heroes65.png" alt="새로 그린 영웅 65명을 네 줄로 늘어놓은 그림" loading="lazy" style="max-width:100%;image-rendering:pixelated;border-radius:4px"><figcaption>새로 그린 65명. 덩치를 맞춘 뒤의 크기다.</figcaption></figure>
<h3>키만 맞추면 덩치가 안 맞는다</h3>
<p>처음에는 발에서 눈까지 높이로 크기를 맞췄다. 모자나 깃털은 장식이라 뺐다. 그런데 사령술사와 용기사를 나란히 세우니 "덩치차이가" 났다. 키는 같아도 옆으로 넓은 정도가 달랐다. 그림 면적이 기사 1,393칸, 사령술사 1,131칸, 용기사 1,712칸이었다.</p>
<p>키 기준 크기와 면적 기준 크기의 중간값을 쓰기로 했다. 용기사와 사령술사의 화면 면적 비율이 1.51에서 약 1.25로 줄었다. 완전히 같게 하지 않은 건, 그러면 장식이 큰 캐릭터의 몸이 너무 작아지기 때문이다.</p>

<h2 id="g2" data-tags="design">2. 캐릭터와 배경이 따로 놀았다</h2>
<p>새 영웅을 전장에 세우자 "캐릭터랑 배경이랑 아트 컨셉이 달라서 그런지. 이질적인 부분이 있어." 같은 배율로 나란히 놓고 재 보니, 가장 큰 원인은 픽셀 굵기였다. 배경은 그림 한 칸이 화면 3px, 새 영웅은 약 1px이었다.</p>
<figure style="margin:12px 0"><img src="img/bg_compare.png" alt="예전 배경 위에 새 영웅 3명과 예전 영웅 4명을 나란히 세운 비교 그림" loading="lazy" style="max-width:100%;image-rendering:pixelated;border-radius:4px"><figcaption>왼쪽이 새 그림(64칸), 오른쪽이 예전 그림(36칸). 배경 픽셀이 새 영웅보다 세 배 굵다.</figcaption></figure>
<p>그래서 배경을 같은 구도로 세 배 촘촘하게 다시 그렸다. 흙 전장이 시작되는 높이를 예전과 같게 맞춰서 육각 칸과 캐릭터 자리는 그대로다. 배경 파일은 53KB에서 532KB로 커졌다.</p>

<h2 id="g3" data-tags="plan design">3. 그림 한 장에서 8칸으로</h2>
<p>지금까지 영웅 그림은 기본 1장과 공격 1장이었다. "이미지 2장 하는 건 이미 해 봤어. 그래서 프레임 형식으로도 해 보고 싶은 거야." 대기 4칸과 공격 4칸, 모두 8칸짜리 시트로 바꿔 보기로 했다.</p>
<p>시트를 만들 때 지킬 규칙을 먼저 정했다. 얼굴과 칼은 8칸 모두 같아야 하고, 발은 제자리에 있어야 하고, 효과는 넣지 않고, 색은 첨부한 그림의 색만 쓴다. 배경은 마젠타로 했다. 기사 투구에 흰 깃털이 있어서 흰 배경이면 지울 때 깃털까지 지워진다. 공격 동작은 작은 크기에서도 잘 읽히는 내려치기로 골랐다.</p>
<p>제미나이 첫 결과는 얼굴 가리개와 칼 모양이 칸마다 바뀌고 칼 궤적까지 들어가서 탈락했다. 두 번째는 쓸 만했다. 게임에 넣어 보니 "지금 느낌 괜찮은 거 같은데".</p>
<h3>제미나이와 코덱스를 같은 요청문으로 비교했다</h3>
<p>1등급 17명의 요청문을 만들고, 화살비 하나를 코덱스로도 받아 봤다. 이미지 세션이 후처리하면서 잰 숫자가 차이를 보여 줬다.</p>
<figure style="margin:12px 0"><img src="img/knight_anim.png" alt="기사의 8칸 시트: 왼쪽 4칸은 대기, 오른쪽 4칸은 칼 내려치기" loading="lazy" style="width:100%;max-width:640px;image-rendering:pixelated"><figcaption>제미나이로 만든 기사. 칸마다 픽셀 크기가 4.0~5.4로 달라서 맞추는 데 손이 많이 갔다.</figcaption></figure>
<figure style="margin:12px 0"><img src="img/rain_anim.png" alt="화살비의 8칸 시트: 왼쪽 4칸은 대기, 오른쪽 4칸은 활쏘기" loading="lazy" style="width:100%;max-width:640px;image-rendering:pixelated"><figcaption>코덱스로 만든 화살비. 8칸 모두 발과 얼굴 위치가 같은 픽셀이다.</figcaption></figure>

<tr><th></th><th>제미나이 (기사)</th><th>코덱스 (화살비)</th></tr>
<tr><td>칸마다 원본 픽셀 크기</td><td class="n">4.0~5.4 (제각각)</td><td class="n">7.64~7.72 (고름)</td></tr>
<tr><td>얼굴 위치 차이 (1칸 기준)</td><td class="n">최대 3px</td><td class="n">0</td></tr>
<tr><td>칸 밖으로 잘린 곳</td><td>칼끝, 발밑</td><td class="n">0</td></tr>
</table></div>
<p>"야 그냥 다 코덱스한테 맡기자.. 나머지는.." 그 뒤로는 이미지 세션이 5명씩 만들어 넘기고, UI 세션이 받는 대로 게임에 넣었다. 1등급부터 4등급까지 65명이 같은 날 끝났다.</p>
<h3>이펙트는 픽셀로 맞추지 않기로 했다</h3>
<p>궁극기 24종 가운데 20종이 같은 동그라미 이펙트를 쓰고 있어서, 종류별로 모양을 나누는 표를 만들었다. 새 이펙트 13종을 픽셀로 그리기로 하고 첫 시안까지 넣었다. 그런데 "이펙트까지 픽셀이면 좀 촌스러워질 수도 있겠다." 캐릭터는 픽셀, 이펙트는 부드러운 빛으로 두기로 하고 나머지 12종은 멈췄다. 어색해 보였던 곳은 캐릭터보다 몇 배 큰 네모 조각과 오래 남는 고리였고, 그건 코드로 다듬기로 했다.</p>
<p class="lesson">눈으로는 둘 다 괜찮아 보였다. 65명을 만들 때 손이 얼마나 갈지는 표에서 보였다.</p>

<h2 id="g4" data-tags="dev qa">4. 캐릭터가 깨져 보이는 이유</h2>
<p>24일 밤에 먼저 나온 말은 "전투 시작전이랑 전투 중일때 보면 전투 중이 더 이미지 또렷해"였다. 두 화면의 그리는 방식을 비교해 보니, 전투 전 화면에만 등급 외곽선을 그리는 필터가 4겹 걸려 있었다. 외곽선을 그림에 미리 그려 넣는 방식으로 바꿔 필터를 뺐다.</p>
<p>25일에는 8칸 애니가 들어가면서 "캐릭터 이미지가 뭔가 좀 깨져 보이는데"가 나왔다. 이번 원인은 배율이었다. 64px 그림을 1.35배처럼 정수가 아닌 배율로 키우면, 원본 한 점이 어떤 곳은 화면 1px, 어떤 곳은 2px이 된다. 선 굵기가 들쭉날쭉해진다.</p>
<p>처음 고친 방법은 정수배로 크게 키운 뒤 부드럽게 줄이는 것(sharp-bilinear)이었다. 들쭉날쭉은 사라졌지만 이번엔 "아이콘이랑 캐릭터 이미지랑 선명도가 다르지 않아?" 아이콘은 원본 한 점이 화면 2px 안팎이라 경계가 조금 섞여도 티가 안 났다. 캐릭터는 1.35px라 섞인 1px이 크게 보였다.</p>
<p>정수가 아닌 배율에서는 "또렷하지만 들쭉날쭉"과 "고르지만 흐림" 가운데 하나만 고를 수 있다. 둘 다 피하려면 크기 자체를 정수배로 맞춰야 한다. 그래서 캐릭터 크기를 창 크기에 맞는 정수배로 정하게 바꿨다.</p>
<p>다음은 어느 정수로 맞출지였다. 가까운 정수로 맞추니 내 화면(1920×950)에서 캐릭터가 15% 작아졌다. 큰 쪽으로 올려 보니 "전투에서 캐릭터 이미지 너무 크다." 도구 탭에 크기 버튼을 두고 직접 눌러 비교한 끝에 2배로 정했고, 자동 규칙은 다시 가까운 정수로 돌아갔다.</p>

<h2 id="g5" data-tags="plan">5. 게임과 영웅에 이름이 생겼다</h2>
<p>24일 밤에 게임 이름을 "타이니 배틀 히어로즈"로 정했다. 그때까지 브라우저 탭에는 "전투 테스트베드"라고 나왔다. 실제 영웅 그림 38명을 배경 위에 북적북적하게 세운 타이틀 그림도 만들었다. 지금 게임소개 탭에 있는 그림이다.</p>
<p>영웅 이름은 바위곰, 늑대발톱, 화살비처럼 생김새나 무기 그대로였다. "지금은 너무 직관적이라 사람 이름 같지 않거든." 전투 스타일과 어울리는 단어로 사람 이름을 지었다. 바위곰은 록시, 늑대발톱은 팽, 화살비는 볼란이 됐다.</p>
<p>영어권에서 어색하게 들리는 이름은 끝소리를 다듬었다. 볼리는 볼란, 페더는 페드라, 머디는 매디가 됐다. 성별은 그림을 보고 정하고, 애매한 건 내가 골랐다. 성별을 바꾼 영웅은 이름도 다시 지었다. 65명 가운데 여성 42명, 남성 23명이다.</p>
<p>옛 이름은 버리지 않고 별칭으로 남겼다. 상세 창과 도감에만 작게 나온다. 별칭을 고르는 기준도 생겼다. 쌍검, 매의눈처럼 별명 같은 뜻이 있으면 그대로 둔다. 별칭이 노래나 식물 같은 물건 자체이거나, 소녀 캐릭터를 골렘이라고 부르는 것처럼 그 캐릭터가 아닌 존재를 가리키면 바꾼다. 그래서 진흙골렘은 늪지기가 됐다.</p>

<h2 id="g6" data-tags="plan qa">6. 지는 쪽이 더 받던 것을 고쳤다</h2>
<p>EP.05 끝에서 외부 검수가 "지는 쪽이 더 받는다"를 찾았다고 썼다. 그날 밤 바로 고쳤다. 위로금은 준 피해 비율이 실제로 들어가게 고치고, 최소값을 200G에서 50G로 내렸다. 같은 판에서 지고 종을 다시 울리면 골드를 또 주던 것도 막았다.</p>
<p>QA 세션이 직접 세 판을 돌려 확인했다. 1-1에서 종 3번 울리고 지면 위로금은 50G, 다시 울린 종은 +0G로 나왔다. 그런데 같은 플레이에서 다른 게 보였다. 1-1에서 종 3번으로 받는 골드가 216G(72×3)인데, 클리어 골드는 120G였다. 종 골드가 판을 깬 보상보다 컸다.</p>
<p>그래서 25일에 종 골드를 그 레벨 클리어 골드의 비율로 바꿨다. 첫 번째 종은 20%, 두 번째는 30%, 세 번째는 50%다. 세 번 다 울리면 딱 클리어 골드 한 번만큼 받는다.</p>
<div class="tbl"><table>
<tr><th></th><th>1번째</th><th>2번째</th><th>3번째</th><th>합</th></tr>
<tr><td>Lv1 (클리어 120G)</td><td class="n">24</td><td class="n">36</td><td class="n">60</td><td class="n">120</td></tr>
<tr><td>Lv10 (클리어 300G)</td><td class="n">60</td><td class="n">90</td><td class="n">150</td><td class="n">300</td></tr>
</table></div>
<p>뒤로 갈수록 많이 주는 건, 위험을 더 질수록 더 받아야 하기 때문이다. 봇으로 종을 안 울리는 경우, 늘 울리는 경우, 2번 울리는 경우를 돌려 셋 다 30판을 끝까지 깨는 것을 확인했다.</p>
<p class="lesson">위로금 버그를 고치고 나서야 종 골드 216G가 눈에 들어왔다.</p>

<h2 id="g7" data-tags="plan design">7. 낮, 해 질 녘, 밤</h2>
<p>전투가 길어지면 40초부터 피해가 1초마다 15%씩 커진다. 화면에서는 이게 "광폭화"라는 글자 하나로만 보였다. "광폭화 상태가 되면 배경을 어두운 밤 분위기로." 24일 밤에 배경 위에 어두운 남색을 덮었다. 배경만 어두워지고 캐릭터와 숫자는 밝게 남는다.</p>
<p>25일에는 그 사이에 해 질 녘을 넣었다. 30초부터 배경이 노을로 바뀌고, 40초에 밤이 된다. 이미지 세션이 낮 배경과 같은 지형에 색만 바꾼 그림을 따로 그렸다.</p>
<figure style="margin:12px 0"><img src="img/bg_field_dusk.png" alt="보라에서 주황으로 물든 하늘 아래 낮 배경과 같은 지형의 노을 전장" loading="lazy" style="max-width:100%;image-rendering:pixelated;border-radius:4px"><figcaption>노을 배경. 낮 배경과 지형은 한 칸도 다르지 않고 색만 바꿨다.</figcaption></figure>
<p>밤이 되는 순간에는 전장 가운데에 "밤의 분노가 찾아옵니다…"가 2.8초 동안 뜬다. 위쪽 태그도 "광폭화"에서 "밤의 분노"로 바꿨다.</p>

<h2 id="g8" data-tags="design qa">8. 성급 별이 자리를 세 번 옮겼다</h2>
<p>전장 캐릭터 머리 위에 성급 별(★★★)이 있었다. 너무 높고 캐릭터를 가린다고 해서 HP 막대 앞으로 옮기고 "별 하나 + 안에 숫자"로 바꿨다. 그랬더니 막대 줄이 붐볐다. "성급 아이콘 HP 말고 캐릭터 위로 다시.." 다시 머리 위로 올렸고, 마지막에는 숫자를 빼고 성급만큼 작은 별을 늘어놓았다.</p>
<p>돌아보면 별 줄이 높고 컸던 게 문제였다. 별을 작게 만든 뒤에는 머리 위에 둬도 가리지 않았다. 이 과정은 기획 결정 기록에 남겼다.</p>
<p>같은 날 캐릭터 아이콘 규칙도 정했다. 백팩·상세 창·도감처럼 캐릭터 자체를 보여 주는 큰 아이콘은 상반신으로 자르고 성급을 표시한다. 유물 설명 속 얼굴처럼 작은 아이콘은 전신으로 두고 성급을 뺀다.</p>

<h2 id="g9" data-tags="plan dev">9. 세션이 일곱 개가 됐다</h2>
<p>24일 밤에 기획 세션이 자기를 UI 세션으로 알고 UI 일을 건드린 일이 있었다. 그래서 세션마다 역할 파일을 만들었다. 맡는 일, 고치는 파일, 다른 세션에 넘기는 일을 적었다. 세션은 시작할 때 자기 이름을 확인하고 맞는 파일을 읽는다.</p>
<p>같은 밤에 직접 플레이로 버그와 재미를 보는 QA 세션을 더했다. QA는 다른 주소(포트)에서 게임을 연다. 주소가 다르면 저장 데이터도 따로라, QA가 돌린 판이 내 테스트 저장을 덮어쓰지 않는다. 프로젝트도 git과 GitHub에 올렸다.</p>
<p>25일에는 유튜브 영상을 맡는 홍보 세션을 열었다. 처음엔 게임 플레이 쇼츠를 생각했지만 "게임 영상은 내가 아직 만족이안돼서 데브로그가 맞을듯." 1화 소재는 EP.02의 덩치 코스트다. 아이디어를 내고 2시간 반 만에 되돌린 사건 하나를 5분으로 다룬다. AI와 나눈 대화는 화면 그대로 쓰지 않고 도트 말풍선으로 다시 만든다. 1화의 한 줄도 정했다. "재밌다고, 내 게임에서까지 재밌는 건 아니었다."</p>
<p>채널 이름은 "겜개발자 빅토리 | Bigtory Studio"로 정하고 프로필과 배너도 만들었다. 타이니 배틀 히어로즈 다음 게임도 올릴 채널이라, 게임보다 개발자를 앞에 세웠다.</p>

<h2 id="h1" data-tags="plan qa">1. 때리던 영웅이 밀려났다</h2>
<p>"공격을 하다보면 캐릭터가 밀려. 이유분석좀." 엔진에는 같은 편 영웅끼리 겹치면 서로 떼어 놓는 코드가 있었다. 이 코드가 누가 움직이고 있는지 보지 않고 둘 다 반씩 밀었다. 서서 때리던 영웅이 밀린 경우의 약 74%는 옆을 지나가던 아군 때문이었다.</p>
<p>"롤토체스 게임처럼 이동할 캐릭터가 위아래로 이동해서 다른 캐릭터는 위치 안변하게." 걸어가는 쪽만 위아래로 비켜 가고, 서서 때리는 쪽은 그대로 두게 바꿨다.</p>
<p>그랬더니 다른 문제가 생겼다. 땅 띠가 84px로 좁아서 비킬 틈이 없을 때가 있었다. 비키기만 넣었을 때는 1000명 중 100명이 한 번도 못 때리고 갇혔다. 그래서 겨냥한 적에게 닿지 못하면 사거리 안의 다른 적부터 치게 했다. 도발은 그대로 지킨다.</p>

<h2 id="h2" data-tags="plan design">2. 드래그를 빼고 터치 두 번으로</h2>
<p>"드래그가 좀 문제가 있음. 범위때문에 오작동을 하더라." 영웅 그림이 칸보다 커서 이웃 칸까지 덮는다.</p>
<p>이제는 영웅을 한 번 터치해 고르고, 다음에 터치한 곳으로 보낸다. 빈 칸이면 이동, 다른 영웅이면 합성하거나 자리를 바꾸고, 백팩이면 내린다. 전장에서는 그림이 아니라 눌린 칸을 기준으로 본다. 그래서 상세 창의 올리기·빼기 버튼도 없앴다. 같은 일을 하는 길이 두 개가 되기 때문이다.</p>

<h2 id="h3" data-tags="plan design">3. 홀짝 대신 돈고블린 룰렛</h2>
<p>돈고블린 판은 클리어 골드를 걸고 홀짝을 맞히면 두 배를 받는 내기였다. "돈넣으면 룰렛 굴리는걸로. 굴릴때마다 돈 필요하고. 기회 레벨로." 돌릴 때마다 그 판 클리어 골드만큼 내고, 나온 것을 받거나 포기한다. 리셋은 없다.</p>
<div class="tbl"><table>
<tr><th></th><th>Lv1</th><th>Lv4</th><th>Lv7</th><th>Lv10</th></tr>
<tr><td>한 번 돌리는 값</td><td class="n">120G</td><td class="n">180G</td><td class="n">240G</td><td class="n">300G</td></tr>
<tr><td>돌릴 수 있는 횟수</td><td class="n">1</td><td class="n">2</td><td class="n">3</td><td class="n">3</td></tr>
</table></div>
<p>처음에는 후보를 전투 승리 룰렛처럼 그 판 적 팀에서 뽑았다. 나중에 상점처럼 따로 표를 두고, 같은 판에서는 몇 번을 돌려도 같은 구성이 나오게 바꿨다. "돌리때마다 구성은 동일해 현재 스테이지 안에서는."</p>
<figure style="margin:12px 0"><div style="display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap"><img src="img/ev_dealer.png" alt="실크햇과 턱시도 차림에 지팡이를 팔에 건 고블린 딜러" style="width:189px;image-rendering:pixelated"></div><figcaption>돈고블린 딜러. 코를 길게, 웃을 때 한쪽에 금니, 지팡이는 팔에 걸었다.</figcaption></figure>
<p>고블린도 카지노 딜러로 다시 그렸다. 실크햇과 턱시도에, "코를 좀더 길쭉하게 알지? 그리고 웃으면서 금니 한쪽에 있고." 룰렛 팝업에는 전구 테두리와 레버를 붙였다. 레버를 버튼으로 바꿨다가 "룰렛 저건 그냥 디자인 말한 거였어."라는 말을 듣고, 레버는 장식으로 두고 돌리기 버튼을 되살렸다.</p>

<h2 id="h4" data-tags="plan design">4. 보물상자 판을 미믹 판으로</h2>
<p>보물상자 판은 15초 동안 상자 하나를 때리고, 깎은 비율 구간마다 보상을 받았다. 머리 위에는 "최대! 540G 2유물" 같은 말풍선이 떴다. "보물 상자 바꿀게 이벤트를. 말풍선 빼고. 구간별 보상 주는 것도 처치하는 걸로."</p>
<p>상자 하나 대신 미믹 여러 마리를 세웠다. Lv1~4는 3마리, Lv5부터 4마리, Lv7부터는 그중 1마리가 왕관 미믹이다. 미믹은 때리지 않는다. 4.5초마다 영웅 하나를 느리게 하거나(일반), 밀쳐서 잠깐 기절시킨다(왕관). 20초가 지나면 남은 미믹은 도망가고, 잡은 미믹 몫만 받는다.</p>
<figure style="margin:12px 0"><div style="display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap"><img src="img/mimic.png" alt="갈색 나무 상자 미믹" style="width:111px;image-rendering:pixelated"><img src="img/mimic_g2.png" alt="파란 강철 상자 미믹" style="width:132px;image-rendering:pixelated"><img src="img/mimic_king.png" alt="보라 상자에 금 왕관을 쓴 미믹킹" style="width:156px;image-rendering:pixelated"></div><figcaption>보물상자 3종 색 그대로. 일반은 갈색·파랑, 왕관은 보라 미믹킹에만.</figcaption></figure>
<p>EP.05에서 몹은 영입할 수 없는 이질적인 존재라, 이벤트를 정리할 때 뺄 후보였다. 이번에는 이렇게 말했다. "몹 안 한다고 했는데.. 이게 동작이 없으니까 다시 이 부분은 원복해야겠어." 상자는 맞기만 하고 움직이지 않았다. 몹을 새로 늘리는 대신, 상자가 움직이는 미믹으로 그 자리를 채웠다.</p>

<h2 id="h5" data-tags="plan">5. 방랑상인 상품 수와 할인</h2>
<p>방랑상인은 늘 유물 2개와 영웅 1명, 3개만 팔았다. "방랑상점도 레벨에 의해 상품 개수 늘어나도록." 상품 수를 일반 상점 칸 수와 같게 Lv1 3개에서 Lv7 6개까지 늘렸다. 그중 영웅은 Lv5부터 2명이다.</p>
<p>할인도 상품마다 다르게 했다. 그 레벨 최대 할인율의 절반에서 최대 사이를 5% 단위로 정하고, 하나는 꼭 최대로 둔다. 그래야 화면의 "UP TO 50%"가 늘 맞는다. Lv1(최대 30%)이면 30·20·20%처럼 나온다. 다시 돌리기도 하나 붙였다. 값은 일반 상점 리셋과 같은 50G다.</p>

<h2 id="h6" data-tags="plan design">6. 두 번 나눠 때리는 스킬, 탁탁탁 뜨는 숫자</h2>
<p>"지금은 1스킬 1공격이렇잖아. 피해를 40을 1번 줍니다. > 피해를 20을 2번줍니다." 엔진이 같은 적을 여러 번 때릴 수 있게 하고, 블레이크 화염 일섬을 350%×1에서 175%×2로, 아이비 덩굴 채찍을 300%×1에서 150%×2로 바꿨다. 합은 같다. 치명타는 타격마다 따로 굴러서 한 방 운은 조금 줄었다. 첫 타에 적이 쓰러지면 한 번으로 끝난다.</p>
<p>숫자 연출도 종류별로 나눴다. 연타는 분홍 기울임 글자가 아래에서 생기며 앞 숫자를 밀어 올리고 끝에 합계가 뜬다. 회복은 차오르며 반짝이고, 화상은 주황 불씨가 일렁인다. 녹스는 한 번에 세 번 물어뜯는데, 숫자가 한꺼번에 뜨고 있었다. "탁탁탁 하나씩 한번에 말고." 0.2초 간격으로 동작, 타격 효과, 숫자가 같이 나오게 바꿨다. 얼음 숫자는 반으로 갈라지다가 "띠잉 좌우로" 흔들리고 사라지게 바꿨다.</p>
<p>방패 숫자는 아직 없다. 엔진이 방패가 생길 때 기록을 남기지 않아서 화면이 알 수가 없었다. 기록부터 남기게 했다.</p>

<h2 id="h7" data-tags="design">7. 초월 팝업은 네 번째 시험 중이다</h2>
<p>초월은 제단 판에서 전장 4번 칸에 메인, 6번 칸에 재료 영웅을 세워 하던 방식이다. "초월하기 누르면 해당 팝업이 떠. 메인이랑 재료 하나씩 터치해서." 그리고 "일단 해보고 나서 UX적으로 불편한걸 체크해볼까?"</p>
<p>하루에 네 번 고쳤다. 2차에서는 고를 영웅을 전부 팝업 왼쪽 세로 줄로 뺐다. 백팩 영웅까지 고를 수 있어서다. 가운데에는 메인·재료 단상과 초월 버튼만 두고, 오른쪽에 터치한 영웅의 상세 정보를 붙였다. 4차에서는 화살표를 재료에서 메인 쪽(←)으로 돌리고, 메인은 금색·재료는 파랑으로 나눴다. 다음에 채울 단상 뒤가 반짝이고, 초월이 끝나도 팝업을 닫지 않고 그 자리에서 결과를 보여 준다.</p>
<figure style="margin:12px 0"><img src="img/pedestal.png" alt="룬이 새겨진 팔각 청회색 돌 단상" style="width:288px;max-width:100%;image-rendering:pixelated"><figcaption>룰렛과 초월 팝업에 쓰는 룬 단상. 룬은 결과 등급색으로 빛난다.</figcaption></figure>
<p>아직 확정이 아니다. 예전 방식은 설정 하나로 되돌릴 수 있게 남겨 뒀다. 확정되면 "창은 한 번에 하나" 규칙에 예외를 적어야 한다. 팝업 옆에 상세 창이 같이 뜨기 때문이다.</p>

<h2 id="h8" data-tags="design">8. 눈 1픽셀</h2>
<p>타이라(호랑이) 귀를 손보다가 이런 말이 나왔다. "기본적으로 통일성이 사라졌어 알어?" 이번에는 록시(곰)를 기준 그림으로 같이 넣었다. 픽셀랩과 코덱스를 나란히 놓고 비교했다.</p>
<figure style="margin:12px 0"><img src="img/tiger_compare.png" alt="1 록시, 2 지금 타이라, 3 귀가 토끼처럼 길어진 픽셀랩 결과, 4 코덱스 결과를 나란히 놓은 비교" loading="lazy" style="max-width:100%;image-rendering:pixelated;border-radius:4px"><figcaption>1 기준(록시), 2 지금, 3 픽셀랩, 4 코덱스. 픽셀랩은 귀가 토끼처럼 길게 나왔다. 4번으로 정했다.</figcaption></figure>
<p>옮기는 방법도 바꿨다. 예전에는 코덱스 결과를 높이에 맞춰 줄이다 얼굴과 눈이 뭉개졌다. 이번에는 원본의 도트 한 칸 크기(약 19.7px)를 재서 그 격자 그대로 63칸으로 옮겼다.</p>
<p>로빈(레인저)은 머리 볼륨 때문에 B안을 골랐는데 시선이 어색했다. "너 기준안보면 좌우 보면 좌측이 1픽셀 내려가 있어. 근데 A안은 좌우가 같잖아."</p>
<figure style="margin:12px 0"><div style="display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap"><img src="img/robin_eyeA.png" alt="로빈 눈 A안: 두 눈 높이가 같음" style="width:189px;image-rendering:pixelated"><img src="img/robin_eyeB.png" alt="로빈 눈 B안: 보는 사람 기준 왼쪽 눈이 1픽셀 낮음" style="width:189px;image-rendering:pixelated"></div><figcaption>왼쪽 A(두 눈 높이 같음), 오른쪽 B(보는 쪽 기준 왼쪽 눈이 1픽셀 낮음). B로 정했다.</figcaption></figure>
<p>두 눈 높이가 같으면 정면을 쏘아보는 것처럼 보인다. 보는 사람 기준 왼쪽 눈을 1픽셀 낮추면 기준 그림과 같은 시선이 된다. 이 규칙은 이미지 일지에 적어 뒀다. 애니 8칸은 코덱스가 칸마다 눈을 다르게 그려서, 정지 그림의 눈을 8칸에 옮겨 찍었다.</p>

<h2 id="h9" data-tags="design plan">9. 화면 규칙이 세 개 늘었다</h2>
<p><span class="lead">아이콘 모양.</span> "스킬과 용병은 사각, 유물은 원으로 간다." 패시브 스킬에는 원 테두리를 두지 않는다.</p>
<p><span class="lead">칸 목록은 한 줄에 3개.</span> "항상말하지만 이런경우엔 3개씩이고. 좌측부터 차레대로." 칸 수에 따라 너비가 바뀌지 않게 위치를 고정하고, 아직 안 열린 칸은 자물쇠와 열리는 레벨로 보여 준다. 같은 날 백팩은 최대 8칸에서 7칸으로 줄였다.</p>
<p><span class="lead">큰 아이콘은 얼굴만.</span> 상점에서 "캐릭터 얼굴만 나와야 하는데 이거 통일이 안됨"이 나왔다. 영웅마다 머리 높이가 달라서, 같은 비율로 자르면 얼굴 자리가 들쭉날쭉했다. 그림에서 머리 꼭대기를 자동으로 찾아 위 3%에 두고 2.05배로 보여 주는 방식으로 정했다. 창이나 지팡이 끝은 머리로 치지 않고 건너뛴다.</p>
<p>규칙 말고도 화면이 몇 군데 바뀌었다. 전장 위로 구름 그림자가 50초에 한 번 지나간다. "하늘에 구름이 있어서 바닥이 그림자를 주고 캐릭터도 영향받고." 룰렛 뒤에서 돌던 빛줄기는 빼고, 결과 등급색 도트 별이 반짝이게 했다. 패배 팝업은 돌 간판과 붉은 천으로 새로 그렸고, 따로 있던 게임 오버 창은 없앴다. 내용이 같았기 때문이다.</p>

<p>EP.07을 올린 뒤에도 26일 작업은 밤까지 이어졌고, 27일에는 게임 밖 구조를 크게 손봤다. 두 날을 한 글에 묶었다. 화면 고친 횟수는 이제 git 커밋으로 센다. 그전에는 0으로 잘못 세지고 있었다. 27일 하루 86번이다.</p>

<h2 id="i1" data-tags="plan">1. 늪지대의 기믹을 고르기까지</h2>
<p>1장 하나로 끝나던 게임에 두 번째 챕터를 붙였다. 먼저 챕터마다 무엇을 바꿀지 골랐다. 경제 규칙과 시간 규칙은 뺐다. "이게 챕터에 대한 재미는 아니라고 생각해."</p>
<p>처음엔 "열에 2명까지" 세우는 제약을 냈다가, 밀집 대형 유물이 함정이 되지 않게 "행에 2명"으로 바꿨다. 기획이 분노 규칙으로 "늪이 차올라 내 행이 좁아진다"를 추천했고 거절됐다. "이게 최악이야 왜냐 매번 배치를바꾸라는거잖아." "내 슬롯 칸수 제약은 애매하잖아. 그자리를 피하면 그치?"</p>
<p>그래서 늪은 적 쪽에 깔았다. 늪 칸에 선 적은 살아 있는 동안 공격력이 계속 오른다. 처음 값은 1초마다 5%였는데 27일에 "늪칸효과 5초마다 1%로해.."로 낮췄다. 분노 3단계는 정예 대신 늪을 한 칸 더 깐다. 칸으로 장난치는 건 여기까지다. "칸 변수는 거기까지만 할꺼야. 전투 복잡해져."</p>
<p>이 과정에서 원칙이 둘 생겼다. 판을 진행하는 도중에 내 쪽 배치를 다시 하게 만드는 규칙은 두지 않는다. 내 쪽 칸에 손해만 주는 규칙도 두지 않는다. 내 쪽에 무언가를 걸 때는 손해와 이득을 같이 준다.</p>
<p>기획 세션의 말투도 하나 고쳤다. 단점만 짚다가 이런 말을 들었다. "아니 그게 아니라 단점 애기하면 좋아. 근데 확장도 애기를 해야지. 브레인스토밍이 안되잖아."</p>

<h2 id="i2" data-tags="design">2. 맹그로브, 악어, 개구리 상인</h2>
<figure style="margin:12px 0"><img src="img/swamp_bg.png" alt="맹그로브 나무와 물웅덩이가 있는 늪지대 전장 배경" loading="lazy" style="max-width:100%;image-rendering:pixelated;border-radius:4px"><figcaption>2장 배경. 시안 셋 중 맹그로브를 골랐고, 물가에 진흙 둑을 그렸다.</figcaption></figure>
<p>배경은 시안 세 장 중 맹그로브로 정했다. 뿌리가 거미 다리처럼 보여서 다시 그렸고, 물과 땅 사이 경계에 진흙 둑을 넣었다. 처음엔 1장 초원 앞장식을 같이 쓰고 있어서 늪 전용으로 따로 만들었다. 바닥에는 진흙 얼룩과 젖은 자국을 깔았다. "바닥 너무 밋밋하다.. 울렁울렁뭐 진흝이라도 있거나 땅이 그래야지.."</p>
<figure style="margin:12px 0"><img src="img/foe_swamp.png" alt="왼쪽 1장 용 분노 아이콘, 가운데 악어 눈, 오른쪽 독 거품 두꺼비 시안" loading="lazy" style="max-width:min(100%,576px);image-rendering:pixelated;border-radius:4px"><figcaption>분노 버튼. 왼쪽이 1장의 용, 가운데가 악어, 오른쪽이 두꺼비 시안. 악어로 정했다.</figcaption></figure>
<p>1장 분노가 용이니 2장은 악어다. 챕터 이름도 분노를 상징하는 캐릭터로 지었다. 용의 초원, 악어의 늪지대. 악어는 용과 헷갈리지 않게 뿔과 비늘을 뺐다.</p>
<p>방랑상인 대신 늪지 상인 개구리가 물약을 판다. 2장에서는 방랑상인과 한 그룹으로 묶여 3:7 비율로 나온다. 물약은 24칸 아이콘이라 병 모양만으로는 구분이 안 됐다. "내용물 색상, 병모양, 앞에 스티커? 같은느낌으로."</p>
<figure style="margin:12px 0"><img src="img/potion_all.png" alt="병 모양과 내용물 색, 앞 스티커 문양이 다른 물약 8종" loading="lazy" style="max-width:100%;image-rendering:pixelated;border-radius:4px"><figcaption>물약 8종. 줄이면 문양이 뭉개져서 24칸에 직접 찍었다.</figcaption></figure>
<p>물약 칸과 상인 판매 수는 레벨에 따라 늘게 했다. 물약도 팔 수 있다. "물약도 마시기 판매버튼 둘다 넣어줘 버릴수도잇으니" 값은 산 값의 절반이다.</p>

<h2 id="i3" data-tags="plan design">3. 영구 강화: 줄에서 자유형 망으로</h2>
<p>판이 끝나면 훈장을 받고, 훈장으로 다음 판을 강하게 만든다. 처음 짠 뼈대는 역할별 줄 10개였다. 백팩·상점·이벤트·직업 줄이 있고, 줄 안에서는 순서대로 찍는다. 다 찍으면 81단계였다.</p>
<p>이걸 하루 만에 망으로 바꿨다. "확실히 요즘 스팀 트랜드는 자유형이야" 가운데가 모닥불이고, 찍은 칸 옆 칸만 열린다. 처음엔 찍을 수 있는 칸만 보인다. 시작 모닥불에서 고르는 영웅은 2명에서 1명으로 줄이고, 가운데 칸을 찍으면 1명이 다시 는다. "첨 시작하면 2개고르잖아. 1개만고르게해. 그리고 여기서 찍으면 1개더"</p>
<p>레벨로 열리던 칸·횟수·할인은 망으로 옮겼다. 영웅 등급 확률은 레벨에 남겼다. 영구로 올리면 적도 같이 세지기 때문이다. 영웅 줄은 직업별로 나눴다. "돈은 한정되어 있지만 적의 레벨은 동시에 다 오르잖아"</p>
<p>찍을 때마다 쌓이는 "토탈 레벨"도 있었다. 혜택이 영웅 해금이었는데, 영웅 풀을 챕터별로 정하기로 하면서 혜택이 사라졌다. "그러면 영구강화에서 레벨이 의미가없어 혜택이 없거든." 엔진에서 지웠다.</p>
<h3>아이콘과 강조를 걷어냈다</h3>
<p>칸 아이콘 첫 5개는 이미지 세션이 코드로 하나씩 그렸다. 칸 안에 작게 떠 있었고 그림체가 제각각이었다. 돌아온 말은 "이미지 장난하는 거지?"였다. 같은 외곽선, 같은 세 톤으로 한 세트를 다시 그렸고, 그걸 기준으로 나머지 31개를 한 번에 만들었다.</p>
<figure style="margin:12px 0"><img src="img/upicon_compare.png" alt="위 줄 첫 시안 다섯 개, 가운데와 아래 줄 다시 그린 다섯 개" loading="lazy" style="max-width:min(100%,620px);image-rendering:pixelated;border-radius:4px"><figcaption>위가 첫 시안, 아래가 다시 그린 세트. 맨 아래 줄은 찍은 칸(보라 바탕, 노랑 테두리) 모습.</figcaption></figure>
<p>칸 꾸밈은 반대로 갔다. 그라데이션, 갈래마다 다른 색, 상태 3색 테두리까지 넣었다가 "강조 연출 너무 심해.."를 듣고 하나씩 뺐다. 지금은 안 찍은 칸이 검정 바탕에 흰 테두리, 찍은 칸이 보라 바탕에 노랑 테두리다. "어차피 아이콘이 색이있으니까 이런건 컬러단순화해야겟어"</p>
<p>숫자는 모두 임시다. 칸을 몇 개로 할지가 아직 열려 있다. "요즘엔 노드가 엄청 많은게 유행이래.. 100개더 넘아.. 200개더 나믄다더라.."</p>

<h2 id="i4" data-tags="plan design">4. 난이도와 챕터 고르기</h2>
<p>"난 근데 제약까지가보고싶어." 쉬움·보통·어려움을 만들었다. 적 레벨은 +0·+1·+2, 적 영웅 등급 표는 0·2·4칸 앞당기고, 훈장은 1·1.5·2배다. 1-6 적 평균 레벨이 쉬움 3.7에서 어려움 5.7로 오른다. 봇은 세 난이도 모두 1장을 끝까지 깼다. 승률은 재지 않았다.</p>
<p>[처음부터]를 누르면 챕터 고르기 화면이 나온다. 왼쪽에 큰 맵, 그 안에 EASY·NORMAL·HARD 버튼, 오른쪽에 챕터 버튼과 특징·출현 칸이다. 난이도 표시는 해골 개수로 그리려다 "해골말고. 아 그냥 EASY NORAMRL HHAR 이거 영어로 하지"로 바뀌었다. 난이도 자리는 하루에 네 번, 챕터 버튼 자리는 다섯 번 옮겼다.</p>
<p>챕터마다 등급별로 특별 출현 영웅을 1명씩 정했다. 넣고 보니 풀 밖에 있던 영웅은 한 번도 나오지 않았다. 게임이 영웅을 정해진 풀 24명 안에서만 뽑고 있었다. 풀에 더하고 나서 적의 약 29%가 특별 출현 영웅이 됐다.</p>

<h2 id="i5" data-tags="plan">5. 양탄자: 고르기를 되돌리고, 오해를 두 번 바로잡았다</h2>
<p>새 이벤트를 하나 만들었다. "초월이 스킬을 얹듯이 단상은 캐릭터의 태그 특성을 더 주는게 목적이거든. 이로인해 유물 효과를 더 극대화하지." 칸에 깔개를 하나 깔면, 그 칸에 선 영웅이 종족이나 속성을 하나 더 얻는다.</p>
<figure style="margin:12px 0"><img src="img/rug_preview.png" alt="불·얼음·숲·빛·달 속성과 왕관·활·발바닥·악마 종족 문양 양탄자 9종, 오른쪽은 기사가 올라선 모습" loading="lazy" style="max-width:100%;border-radius:4px"><figcaption>양탄자 9종. 속성은 금 테두리, 종족은 은 테두리. 오른쪽은 영웅이 올라선 모습.</figcaption></figure>
<p>처음엔 종류는 무작위로 받고 깔 칸은 직접 골랐다. 써 보니 "역시 단상 칸에서 랜덤이어야겟어. 넘 어색함." 칸도 룰렛으로 정하게 되돌렸다. 이름도 바꿨다. 보스 칸의 "보스 단상"과 겹쳐서 "양탄자"가 됐다.</p>
<p>몇 개까지 깔 수 있느냐에서 기획이 두 번 틀렸다. 기획이 "최대 2개"를 제안했고, 사용자는 "나머진 너가 말한대로"라고 했다. 하지만 사용자 생각은 칸 수만큼이었다. 그다음엔 "빈 칸"을 "영웅이 없는 칸"으로 잘못 읽었다. "왜자꾸 잇는슬롯만되는거야?" 지금은 9칸까지 깔 수 있고, 칸이 다 찼을 때만 덮을지 묻는다. "양탄자는 9개 다설치가능이야; 한칸에2개할때묻는거지"</p>

<h2 id="i6" data-tags="plan">6. 미믹에게 공격력 1</h2>
<p>EP.07에서 만든 미믹 판을 다시 손봤다. 미믹은 공격 0에 4.5초 타이머로 방해만 했다. "재들도 1의 고ㅗㅇ격 피해주도록 하고." "공속을 처야지 스킬생기자나" 평타로 피해 1을 주고, 평타로 에너지가 차면 방해 스킬을 쓰게 바꿨다.</p>
<p>배치도 정했다. 1열 갈색, 2열 파랑, 3열 가운데 왕관이다. 방해 스킬은 색깔별로 다르다. 갈색 "끈적한 침"은 둔화, 파랑 "먹물 뿜기"는 평타를 50% 빗나가게 하고, 왕관 "뚜껑 박치기"는 밀쳐서 잠깐 기절시킨다. 사거리는 갈색 1칸, 파랑 2칸, 왕관 4칸이다. Lv7 시험 20판에서 첫 방해는 약 4.7초에 나오고, 그 뒤로 약 5초마다 나왔다.</p>

<h2 id="i7" data-tags="plan qa">7. 같은 적에게 몰리면 비집고 밀기만 했다</h2>
<p>EP.07에서 공격하다 밀리던 것을 고친 뒤 다른 게 보였다. "다른캐릭터가 또 그대상을때릴때 사이를비집으면 좀 이상해지던데 계속 밀고 들어오려고만해" 영웅은 대상을 한 번 정하면 죽을 때까지 따라갔다.</p>
<p>규칙 셋을 더했다. 근접 영웅이 대상을 고를 때, 그 적에 이미 붙은 아군 1명마다 40px 더 멀리 있는 것처럼 친다. 0.8초 동안 가까워지지 않으면 다른 적으로 바꾼다. 도발한 적에게 막혀 못 닿으면 1.5초 동안 사거리 안의 다른 적을 친다.</p>

<tr><th>200판</th><th>전</th><th>후</th></tr>
<tr><td>1초 넘게 밀기만 한 경우</td><td class="n">225번 (756초)</td><td class="n">84번 (206초)</td></tr>

<tr><td>평균 전투</td><td class="n">15.3초</td><td class="n">15.5초</td></tr>

<p>남은 긴 경우는 적이 1마리만 남은 경우처럼 바꿀 대상이 없을 때다.</p>

<h2 id="i8" data-tags="dev qa">8. 캐릭터가 또 깨졌다</h2>
<p>"캐릭터가 깨져 이거 해상도인지 카메라인지 구조적인 문제인지 모르겠어." EP.06에서 캐릭터 크기를 정수배로 맞췄는데, 자리마다 따로 점검해 보니 아직 정수가 아닌 곳이 남아 있었다. 양 0.66배, 초월 0.89배, 몹 0.9·1.4·1.7배, 도감 1.07배였다.</p>
<p>근본 원인은 화면 구조였다. 판은 창 크기에 맞춰 부드럽게 늘어나는데 캐릭터만 정수배 단계로 커져서, UI는 그대로인데 캐릭터 크기만 바뀌었다. "캐릭터 크기가 바뀌는게 약간 이슈였던게 UI나 다른건 그대론데 캐릭터만 바뀌잖아 그치?" 그래서 화면 전체를 640×360 기준 정수배로 키우고, 남는 곳은 빈 띠로 뒀다. 1920×1080은 3배로 꽉 차고, 1920×950과 1366×768은 2배다. "응 안짤려서 좋아. 굿굿"</p>

<h2 id="i9" data-tags="design">9. 같은 팝업인데 왜 자꾸 디테일이 빠지나</h2>
<p>룰렛처럼 생긴 팝업이 여섯 종류다. 전투 룰렛, 모닥불, 요정, 돈고블린, 초월, 양탄자. 하나를 고치면 다른 데서 같은 지적이 또 나왔다. "지금 문제없을려고 같은 팝업 구조를 쓰는데 왜 자꾸 디테일한 부분들이 놓쳐지냐고. 왜"</p>
<p>팝업마다 위치를 따로 덮어쓰고 있었고, 기준 글이 없었고, 기획이 말을 잘못 옮긴 적도 있었다. 지적을 한 문서(팝업기준안)로 모아 UI에 넘겼다. 큰 칸 등급 테두리, 장식 위치, 반짝임, 버튼 줄을 적고, 공통 틀 하나에 테마만 바꿔 끼우기로 했다.</p>
<p>그 사이 오간 것이 많다. 폭죽은 색이 세 번 바뀌어 흰색과 연한 노랑이 됐다. "폭죽 색이 너무 색이 강렬하다." 쏘는 때도 받기를 누를 때로 했다가, 결과가 보이는 순간으로 바로잡았다. "결과로 나왔지. 내가 붇는 유무랑 관게없잖아. 폭죽나와야지 그전에." 돈고블린 레버는 다섯 번 모양을 바꾼 끝에 뺐다. "래버 빼줘. 데코"</p>

<h2 id="i10" data-tags="design">10. 건물 대신 무녀, 그리고 양</h2>
<p>초월 판의 제단 건물을 캐릭터로 바꿨다. "초월도 캐릭터로 할게 건물빼고. 이렇게 눈가린 천칭을 들고있는 신비로운 무녀." 사용자가 보낸 참고 그림이 유명한 캐릭터와 닮아서, 눈 가림과 분위기만 가져오고 머리색·옷·눈가리개는 다르게 했다.</p>
<figure style="margin:12px 0"><img src="img/seeress_compare.png" alt="기준 기사 옆에 코덱스로 그린 무녀와 픽셀랩으로 그린 무녀" loading="lazy" style="max-width:min(100%,720px);image-rendering:pixelated;border-radius:4px"><figcaption>왼쪽 기준 기사, 가운데 코덱스 안, 오른쪽 픽셀랩 안. 픽셀랩 안으로 정했다.</figcaption></figure>
<p>코덱스 안의 얼굴을 손으로 고쳤더니 균형이 깨졌다. "기존안 주면서 요청해 얼굴 균형이 안맞아. 오히려 새로해달라고하는게 나을수도." 이번에는 픽셀랩 안을 골랐다. 대기 8칸에서는 천칭이 좌우로 흔들린다.</p>
<p>양탄자 이벤트 캐릭터는 밤하늘 털을 가진 양이다. 오른눈이 높아 위를 보는 것처럼 보였다. "왜 시야가 위를 봐?" 눈을 몇 번 고칠수록 더 어색해졌다. 결국 한 단계 전 눈으로 되돌렸다. "그냥이대로해일단.."</p>

<h2 id="i11" data-tags="plan qa dev">11. 기획이 틀린 곳을 규칙으로 막았다</h2>
<p>27일 기획 일지에는 "오늘 기획이 틀린 것" 칸이 따로 있다. 사용자가 정하기 전에 숫자와 묶기를 정해 넣었다. "수치를니가왜정하냐고" 자리를 옮겨 달라는 말에 모양까지 바꿨다. "나는 버튼을 이동시켜달라고했지 형태롤 바꾸라고는안했어" 이미 정한 것을 다시 묻기도 했다. "말했지 내가? 플레이어레벨 그거 해당하는거 이미."</p>
<p>그래서 작업 규칙에 한 줄을 더했다. 요청이 애매하면 지어내지 말고 멈춰서 묻는다. 같은 방법으로 두 번 실패해도 멈추고 묻는다.</p>
<p>규칙 문서도 정리했다. 세션 일곱 개가 매번 다시 읽는 CLAUDE.md가 18.3KB였다. 화면 규칙 20줄을 화면규칙.md로 그대로 옮기고, 화면을 다루는 세션만 고치기 전마다 다시 읽게 했다. CLAUDE.md는 2.9KB가 됐다. 날마다 쌓이던 백업 파일 746개(160MB)는 지우지 않고 백업 폴더로 옮겼고, 앞으로는 git으로만 되돌린다. "지우지는 않고. 123 오케이." 버튼 효과도 정리했다. 버튼마다 따로 있던 올림·누름·꺼짐 효과 53가지를 공통 3가지로 합쳤다.</p>
<h3>외부 검수: 훈장을 어떻게 줄지가 먼저다</h3>
<p>다른 모델(Fable)에게 두 번째 검수를 맡겼다. 11-24에 짚은 7가지는 모두 고쳐졌거나 지워져 있었다. 새로 찾은 건 대부분 영구 강화의 훈장 쪽이었다. 판을 중간에 새로 시작하면 훈장이 0개인데, 일부러 져서 하트를 0으로 만들면 7~9개를 받는다. 첫 클리어 훈장은 챕터당 한 번뿐이라 쉬움으로 먼저 깨면 24개, 어려움이면 48개다. 36칸을 다 찍으려면 끝까지 깬 판으로 약 30~60판이 든다. 검수의 결론은 이랬다. 판을 접을 때도 줄지, 첫 클리어 난이도를 무엇으로 볼지부터 정해야 영구 강화 숫자를 잡을 수 있다.</p>

<h2 id="n3" data-tags="plan qa">3. 아무도 모르게 켜져 있던 속성 상성</h2>

<p>처음 결과에는 음수가 섞였다. "-로 나오는건 모야?" 판 수를 늘리면 풀릴 줄 알았는데 그대로였다. 판들이 사실상 똑같이 흘러서, 상대를 11%에서 12%로 올리면 승패가 한꺼번에 뒤집혔다. 판마다 체력과 공격력을 ±10% 흔들자 음수가 사라졌다.</p>
<p>스킬 값에서도 같은 함정에 빠졌다. 첫 숫자는 믿을 수 없는 값이었고, 기획은 원인을 도발에 막힌 탓으로 짚었다가 틀렸다. 키츠는 4.2초에 이미 쓰러져 있었다. 짧은 전투가 작은 차이에 너무 민감한 게 원인이었다. 팀원을 무작위로 섞고 ±25%를 흔들어 다시 쟀다. "크게 섞어 재"</p>

<p>영웅끼리의 차이는 아직 크다. 같은 기사 안에서도 −10%와 188%가 함께 있다.</p>

<h2 id="n5" data-tags="design">5. 유성은 크기가 문제인 줄 알았다</h2>
<p>27일에 유물 35종의 이펙트를 만들었다. "유물 효과들 이펙트가 없거든" 다음 날 유성이 걸렸다. "유성 너무 조그맣더라 매태오인데" 크게 키워서 보여 주자 이런 답이 왔다. "유성 모양이 별로고 퍼질 때 연출이 별로야. 원이 우리 픽셀 느낌이 안 나"</p>
<p>크기를 고칠 일이 아니었다. 매끈한 원과 번짐이 도트 그림과 안 맞았다. "내가 지금까지 유물이나 스킬 이펙트 요청했던 것 보면 다 이런 마지막 요청이 있던 것 같아" 유물 이펙트를 전부 도트로 바꾸고, 화면 규칙에 "이펙트는 도트 그림체로"를 적었다. 방어 유물 3종이 파란 원 하나를 같이 쓰던 것도 육각 방벽, 깃발과 방패, 큰 방패 셋으로 나눴다.</p>
<p>궁극기에는 얼굴과 스킬 이름이 뜨는 컷인과 짧은 멈춤을 넣었다. 처음 크기는 "아이콘이 좀 크다"였고, 줄인 뒤에는 "좀더 크게해줘"였다. 전투 중에 이펙트가 터지는 움직임은 아직 눈으로 확인하지 못했다.</p>

<h2 id="n6" data-tags="design">6. 얼굴을 점 수로 정했다</h2>
<p>게일, 볼트, 블룸, 토라를 새로 그렸고, 다음 날 블레이즈, 아이비, 코라를 다시 그렸다. 얼굴이 계속 어긋나자 기준이 점 단위로 내려갔다. "흰자1개 눈동자 2개이어야돼. 좌우 같이." "눈이 끝나는 선에서 얼굴라인도끝나야돼" "시선처리때문에 얼굴이 우측으로 좀 기울어진 상태인 점을 고려해야함." 그래서 왼쪽 눈은 1점 아래, 좌우 짝 머리는 왼쪽을 1점 낮게 그린다.</p>

<p>눈썹을 "1픽셀" 옮겨 달라는 말은 두 번 잘못 읽었다. "점을 추가하는게 아니야."</p>

<h2 id="n7" data-tags="design">7. 록시만 걷는다</h2>

// 분야 꼬리표: 글 안 섹션 제목 옆에만 보인다(목록·필터 없음).
const PARTS = { plan:'기획', dev:'개발', qa:'QA', design:'디자인' };
const chip = k => `<span class="chip">#${PARTS[k]}</span>`;

// 오른쪽 번호 내비: [요소, 이름] 목록을 받아 1·2·3 버튼으로 만들고, 지금 보이는 곳을 표시한다.
const side = document.getElementById('side');
let watch;
function sideNav(items, title){
  watch?.disconnect();
  side.hidden = !items.length;
  side.innerHTML = `<p class="t">${title || ''}</p>` + items.map(([el, label], n) => `<button type="button" title="${esc(label)}"><b>${n + 1}</b><span>${esc(label)}</span></button>`).join('');
  const btns = [...side.querySelectorAll('button')];
  btns.forEach((b, n) => b.onclick = () => items[n][0].scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }));
  watch = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const n = items.findIndex(([el]) => el === e.target);
    btns.forEach((b, k) => b.toggleAttribute('aria-current', k === n));
  }), { rootMargin: '-30% 0px -60% 0px' });
  items.forEach(([el]) => watch.observe(el));
}

  what:[
    { lines:['앞에 놓인 글을 보고 가장 자연스러운 다음 말을 골라 이어 가는 AI다.','답을 통째로 만들지 않고 한 조각씩 덧붙인다.','오늘 날씨가 뒤에 좋다를 붙이고, 다시 처음부터 읽고 다음 조각을 고른다.','휴대폰 키보드의 다음 단어 추천을 계속 누르는 것과 비슷하다.'],
      q1:'왜 다음 말을 고를 수 있나?', why:['방대한 글을 학습하면서 어떤 말 뒤에 어떤 말이 오는지 패턴을 익혔다.'],
      q2:'왜 패턴으로 익혔나?', why2:['컴퓨터는 말의 뜻을 모르고 숫자 계산만 한다.','언어는 너무 복잡해서 사람이 문법과 의미를 규칙으로 다 적어 줄 수 없었다.','대신 실제 글을 엄청나게 보여 주고, 이 말 뒤에는 보통 이 말이 온다는 확률을 스스로 익히게 했다.','다음 말 맞히기는 아무 글에나 정답이 들어 있어서 사람이 채점할 필요가 없었다.','덕분에 인터넷의 글 전체를 교재로 쓸 수 있었다.'],
      q3:'그래서 무엇을 알려 줘야 하나?', so:['많이 본 것은 잘하고, 본 적 없는 것은 모른다.','내 게임의 규칙과 용어, 학습 이후에 생긴 정보는 직접 문서로 알려 줘야 한다.','원하는 결과를 예시로 하나 보여 주면 그 패턴을 따라 한다.','긴 설명보다 예시 하나가 잘 통할 때가 많다.'] },
    { lines:['회사와 모델마다 성능, 비용, 속도가 다르다.','회사들은 모델을 크기별로 나눠 내놓는다.'],
      q1:'왜 모델마다 다른가?', why:['모델이 클수록 답 한 조각을 만들 때마다 계산을 많이 한다.','똑똑한 대신 비싸고 느리다.','무엇을 학습시켰는지도 회사마다 달라서 잘하는 분야가 갈린다.'],
      q2:'왜 클수록 계산이 많나?', why2:['모델이 크다는 건 학습으로 맞춰 둔 숫자가 많다는 뜻이다.','답 한 조각마다 그 숫자를 거의 다 거쳐 계산해서, 숫자가 많을수록 계산이 늘어난다.'],
      q3:'그래서 모델을 어떻게 고르나?', so:['높은 모델만 쓰면 사용 한도가 일찍 바닥난다.','수십 번 반복하는 수정에서는 기다리는 시간이 쌓인다.','오타 고치기나 파일 정리는 작은 모델로도 결과가 같다.','깊이 생각할 일은 큰 모델에, 많고 단순한 일은 작은 모델에 맡긴다.'] },
    { lines:['답하기 전에 생각하는 추론 모델도 원리는 같다.'],
      q1:'왜 추론 모델도 같은가?', why:['생각하는 과정도 다음 말을 한 조각씩 이어 써서 만든다.'],
      q3:'그래서 생각 깊이는 언제 높이나?', so:['생각하는 글도 토큰이라, 오래 생각할수록 느리고 사용량이 늘어난다.','생각 깊이는 기획처럼 따져 볼 게 많은 일에만 높인다.'] },
    { lines:['틀린 말도 맞는 말처럼 자신 있게 한다.'],
      q1:'왜 틀린 말을 자신 있게 하나?', why:['답을 고를 때 사실인지 확인하는 단계가 없다.','모르는 내용이어도 멈추지 않고 자연스러운 답을 끝까지 만들어 낸다.'],
      q2:'왜 확인 단계가 없나?', why2:['다음에 올 말을 맞히도록 배웠지, 맞는 말을 하도록 배운 게 아니다.','사실 여부는 학습 목표에 없었다.'],
      q3:'그래서 어떻게 확인하나?', so:['내가 모르는 분야의 답은 공식 문서나 다른 모델로 한 번 더 확인한다.','검수는 만든 모델과 다른 모델에 맡긴다.','같은 모델은 틀리는 지점도 비슷해서 자기 실수를 잘 못 찾는다.'] },
    { lines:['대화가 끝나면 나눈 내용을 기억하지 못한다.'],
      q1:'왜 대화를 기억하지 못하나?', why:['대화에서 알게 된 것은 모델에 저장되지 않는다.','대화 중에는 지금까지 나눈 글을 매번 처음부터 다시 읽을 뿐인데, 그게 기억하는 것처럼 보인다.'],
      q2:'왜 모델에 저장하지 않나?', why2:['모델 하나를 수많은 사람이 같이 쓴다.','대화마다 모델이 배우면 내 이야기가 남의 답에 섞여 나올 수 있다.','누가 일부러 틀린 내용을 가르쳐 모델을 망칠 수도 있다.','새로 학습시키는 일 자체도 큰 장비로 오래 걸려서 대화마다 할 수 없다.','도서관 책에 메모를 못 하게 하는 것과 같다.'],
      q3:'그래서 무엇을 남기나?', so:['정한 것과 규칙은 파일에 남긴다.','CLAUDE.md와 메모리가 책 옆에 두는 내 노트다.'] },
    { lines:['더 좋은 모델을 써도 틀리고 잊는 성질은 남는다.','모르면 모른다고 말하게 다듬어서 틀리는 횟수는 줄었지만, 없어지지는 않는다.'],
      q1:'왜 좋은 모델도 틀리고 잊나?', why:['모델이 좋아져도 다음 말을 고르는 원리는 그대로다.'],
      q2:'왜 원리는 그대로인가?', why2:['모델이 좋아지는 방법은 원리를 바꾸는 게 아니라, 같은 원리 위에서 더 많이 학습시키고 더 크게 키우고 다듬는 것이다.'],
      q3:'그래서 무엇부터 갖추나?', so:['모델 등급을 올리기 전에 근거 문서와 기록, 검수부터 갖춘다.'] },
  ],
  use:[
    ['본 적 없는 건 모른다, 예시는 잘 따라 한다','우리 게임만의 규칙과 기준은 문서로 준다. 그림은 말로 설명하기보다 기준 그림 하나를 같이 준다.'],
    ['틀린 말도 자신 있게 한다','AI가 낸 수치는 바로 반영하지 않고 봇 시뮬레이션으로 확인한다. 게임 전체 검수는 다른 모델에 맡긴다.'],
    ['대화가 끝나면 잊는다','결정과 되돌린 기획은 파일에 남기고, 버전은 git으로 관리한다.'],
    ['모델마다 비용과 속도가 다르다','기획은 큰 모델에 생각 깊이를 높게, UI와 페이지 반복 수정은 가볍고 빠른 모델로, 검수는 다른 모델로 맡긴다.'],
  ],
  useNote:['토큰에 큰돈을 쓴다고 꼭 비효율은 아니다.','쓴 돈보다 얻는 게 크면 효율적이다.','회사는 사람의 시간이 토큰보다 비싸고, 개인은 정해진 한도 안에서 써야 해서 기준이 다르다.'],
  cmds:[
    ['/model','모델을 바꾼다. 뒤에 아무것도 안 붙이면 고르는 창이 뜬다.','반복 수정은 가벼운 모델로, 설계는 큰 모델로 바꿀 때 쓴다.'],
    ['/effort','생각 깊이를 정한다. low부터 max까지, 또는 auto로 고른다.','기획처럼 따져 볼 게 많을 때 올리고, 단순 작업에는 내린다.'],
    ['/fast','빠른 모드를 켜고 끈다.','속도가 중요한 작업일 때 쓴다.'],
  ],
  cmdNote:['지금 쓰는 모델들은 생각을 끌 수 없고, 깊이만 조절한다.','데스크톱 앱에서는 모델과 생각 깊이를 앱 화면에서 바꾸는 쪽이 확실하다.'],
  tips:[["확인된 것과 추측을 나눠서 답해 줘. 추측이면 근거도 같이 적어 줘.","틀린 말도 맞는 말처럼 자신 있게 하니, 어느 쪽인지 스스로 표시하게 한다."],["이 답에서 틀렸을 가능성이 있는 부분부터 짚어 줘.","확인하는 단계가 없으니, 확인할 곳을 먼저 찾게 해서 검토 시간을 줄인다."],["이 작업에 가벼운 모델로 충분한지, 큰 모델이 필요한지 이유와 함께 알려 줘.","모델마다 비용과 속도가 다르니, 일에 맞는 모델을 고르는 근거를 받는다."]],
  mine:[
    ['AI가 git을 쓰면 로컬에서 확인하기 어렵다고 해서 그대로 믿었다.','index 파일을 391개까지 복사해 가며 버전을 관리했다.','확인해 보니 사실이 아니었다.'],
    ['공격 자세 그림을 만들 때 영웅마다 키가 제각각으로 나왔다.','확정된 36칸 그림을 28배로 키운 기준 그림을 같이 주자 키가 맞춰졌다(EP.03).'],
    ['게임 전체 검수를 다른 모델(Fable)에 맡겼다.','지는 쪽이 이기는 쪽보다 더 받는 경제 구멍을 찾았다(EP.05).'],
    ['게임 개발 세션 6개 중 검수만 Fable이고, 나머지 다섯은 같은 모델과 같은 생각 깊이를 쓴다.','역할별로 나누면 나아지는지는 아직 재 보지 않았다.'],
  ] },
{ name:'토큰', one:'LLM이 글을 읽고 쓰는 단위',
  what:[
    { lines:['LLM이 글을 읽고 쓰는 단위다.','글자 하나도, 단어 하나도 아닌 그 사이 크기의 조각이다.'],
      q1:'왜 조각으로 자르나?', why:['컴퓨터는 숫자만 다룬다.','글을 조각으로 잘라 조각마다 번호를 붙여 계산한다.'],
      q2:'왜 글자나 단어가 아니라 조각인가?', why2:['글자로 자르면 조각이 너무 많아 계산이 길어진다.','단어로 자르면 단어 종류가 끝없이 많아진다.','자주 나오는 덩어리는 한 조각으로, 드문 말은 잘게 자르는 중간 방식을 쓴다.'],
      q3:'그래서 무엇이 달라지나?', so:['자주 쓰이는 말일수록 적은 토큰으로 처리된다.'] },
    { lines:['읽고 쓴 토큰 수가 곧 비용이고 사용량이다.'],
      q1:'왜 토큰 수가 비용인가?', why:['답을 한 조각 만들 때마다 계산을 한 번씩 한다.','내가 보낸 글도 토큰으로 바꿔 전부 읽는다.','채팅으로 보낸 요청도, 자동으로 들어가는 CLAUDE.md도 모두 읽는 글이다.'],
      q3:'그래서 무엇을 줄이나?', so:['답을 길게 받을수록, 많이 읽힐수록 사용량이 는다.','필요 없는 파일과 긴 설명은 읽히지 않는다.'] },
    { lines:['대화가 길어질수록 같은 질문도 비싸진다.'],
      q1:'왜 길수록 비싸지나?', why:['답할 때마다 지금까지의 대화를 처음부터 다시 읽는다.','대화가 길면 짧은 질문 하나에도 앞의 글 전체가 토큰으로 계산된다.'],
      q2:'왜 매번 다시 읽나?', why2:['모델은 대화를 저장하지 않는다.','기억하는 것처럼 보이려면 앞의 글을 매번 함께 넣어 줘야 한다.'],
      q3:'그래서 언제 새 대화를 여나?', so:['주제가 바뀌면 새 대화를 연다.','정한 내용은 파일로 남기고, 새 대화에서는 그 파일만 읽힌다.'] },
    { lines:['한 번에 읽을 수 있는 양도 토큰으로 정해져 있다.'],
      q1:'왜 한계가 있나?', why:['모델이 한 번에 계산할 수 있는 길이에 한계가 있다.'],
      q3:'그래서 넘치면 어떻게 되나?', so:['오래된 대화부터 요약된다.','큰 파일은 통째로 주지 않고 필요한 부분만 읽힌다.'] },
    { lines:['같은 글도 모델과 언어에 따라 토큰 수가 다르다.'],
      q1:'왜 언어마다 다른가?', why:['모델마다 글을 자르는 방식이 다르다.','학습한 글에 영어가 많아서, 영어는 큰 덩어리로, 한국어는 더 잘게 잘리는 편이다.'],
      q3:'그래서 무엇을 알아 두나?', so:['같은 내용이면 한국어가 토큰을 더 쓰는 경우가 많다.'] },
    { lines:['이미지도 토큰이 된다.'],
      q1:'왜 이미지도 토큰인가?', why:['이미지도 작은 조각으로 잘라 숫자로 바꿔 읽는다.','그림이 클수록 조각이 많아진다.'],
      q3:'그래서 스크린샷은 어떻게 주나?', so:['필요한 부분만 잘라서 준다.'] },
    { lines:['클리어는 대화를 비우고, 컴팩트는 대화를 요약해서 이어 간다.'],
      q1:'왜 둘 다 토큰을 줄이나?', why:['다음 질문부터 다시 읽을 앞의 글이 줄어든다.','클리어는 아무것도 들고 가지 않고, 컴팩트는 요약본만 들고 간다.'],
      q2:'요약하려면 전체를 읽는데 왜 줄어드나?', why2:['전체는 요약할 때 한 번만 읽는다.','그 뒤로는 짧은 요약본만 읽어서, 대화가 길게 이어질수록 아끼는 양이 커진다.'],
      q3:'그래서 언제 무엇을 쓰나?', so:['앞의 대화가 필요 없는 새 작업이면 클리어를 쓴다.','같은 작업을 이어 가야 하면 컴팩트를 쓴다.','요약에서 세부 숫자나 문장이 빠질 수 있으니, 중요한 건 미리 파일에 남긴다.'] },
    { lines:['토큰 절약 플러그인은 덜 읽히거나 덜 쓰게 만든다.'],
      q1:'왜 그렇게 하면 줄어드나?', why:['토큰은 읽은 양과 쓴 양만큼 쓰인다.','둘 중 하나만 줄여도 사용량이 준다.'],
      q2:'어떤 방식으로 줄이나?', why2:['파일을 통째로 읽히지 않고 필요한 부분만 찾아 읽게 한다.','명령 실행 결과처럼 긴 출력을 잘라서 넘긴다.','길어진 대화를 요약한다.','짧게 답하라는 지시를 넣는다.','찾아보는 일은 작은 모델에 맡기고 결과만 받는다.','자르고 찾는 일은 일반 프로그램이 해서 토큰을 쓰지 않는다.'],
      q3:'그래서 무엇을 조심하나?', so:['덜 읽히면 필요한 내용까지 빠질 수 있다.','너무 짧게 답하게 하면 설명이 부족해진다.','절약한 만큼 결과가 나빠지지 않았는지 같은 일로 비교해 본다.'] },
  ],
  use:[
    ['읽힌 만큼 쓴다','세션에 프로젝트 폴더 전체를 읽히지 않는다. 일에 필요한 파일만 지정해 준다.'],
    ['대화가 길수록 비싸진다','역할별로 세션을 나눈다. 하루 작업이 끝나면 개발일지에 남기고, 다음 날은 새 대화로 시작한다.'],
    ['세션끼리 주고받는 말도 토큰이다','세션 간 알림은 끝났을 때 한 번만 짧게 보낸다.'],
    ['이미지는 크다','화면 확인용 스크린샷은 문제 부분만 잘라 준다.'],
