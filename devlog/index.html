    ['방치형 RPG의 화면 규칙은 같은 지적이 반복돼서 CLAUDE.md에 적었다.','버튼은 무조건 사각형, 도감 필터 칩은 예외처럼 강도와 예외를 같은 줄에 적었다.'],
    ['지금은 세션 6개가 CLAUDE.md 하나를 같이 읽는다.','화면 규칙을 따로 떼어 낼지는 아직 정하지 않았다.'],
    ['이력서 폴더는 스펙요약.md만 근거로 쓰게 했다.','경력을 지어내지 못하게 막기 위해서였다.'],
    ['이 공부 일지의 왜?, 그래서? 형식을 메모리에 적어 두자, 다음 답부터 그 형식으로 나왔다.'],
    ['페이지에 쓴 문장이 대화를 본 사람만 이해할 수 있게 쓰인 적이 있다.','프롬프트도 같아서, 내 머릿속 맥락은 적어 주지 않으면 AI가 모른다.'],
  ] },
{ name:'문맥 관리', one:'한 번에 볼 범위에 무엇을 넣고 뺄지', useTitle:'문맥 관리를 잘 하려면',
  what:[{"lines":["문맥(컨텍스트)은 LLM이 한 번에 보는 글 전체다.","문맥을 담는 그릇을 컨텍스트 창(context window)이라 하고, 모델마다 담을 수 있는 최대 토큰 수가 정해져 있다."],"q1":"무엇이 문맥에 들어가나?","why":["기본 지시와 CLAUDE.md, 메모리가 맨 앞에 들어간다.","지금까지 나눈 대화가 그 뒤를 잇는다.","읽은 파일 내용과 명령 실행 결과도 모두 들어간다."],"q3":"그래서 무엇을 알아 두나?","so":["파일 하나를 읽히면 그 내용 전체가 문맥을 차지한다.","내가 보낸 말보다 도구가 가져온 글이 훨씬 클 때가 많다."]},{"lines":["문맥이 길어지면 답의 질이 떨어진다."],"q1":"왜 떨어지나?","why":["볼 글이 많을수록 지금 필요한 내용을 찾기 어려워진다.","글이 길어질수록 한 부분에 가는 주의가 줄어, 다 읽고도 흘려듣게 된다."],"q2":"그럼 어디를 가장 흘려듣나?","why2":["긴 글의 맨 앞과 맨 끝은 비교적 잘 보고, 가운데를 놓치기 쉽다는 연구 결과가 있다.","오래 이어진 대화라면 중간쯤에 말로 정한 규칙이 가장 묻히기 쉽다."],"q3":"그래서 어떻게 하나?","so":["한 세션에는 한 가지 일만 맡긴다.","꼭 지킬 규칙은 대화 중간에 말로 두지 말고 CLAUDE.md에 적는다.","길어지면 컴팩트하거나 새로 연다."]},{"lines":["문맥이 넘치면 앞부분이 요약된다."],"q1":"왜 요약되나?","why":["한 번에 볼 수 있는 양에 한계가 있다.","한계에 가까워지면 오래된 대화부터 요약해 자리를 만든다."],"q3":"그래서 무엇을 남기나?","so":["요약에서 세부 숫자와 문장이 빠질 수 있다.","꼭 필요한 결정은 대화가 아니라 파일에 적는다.","CLAUDE.md와 메모리는 요약 뒤에도 다시 들어간다."]},{"lines":["서브에이전트는 문맥을 따로 쓴다."],"q1":"왜 문맥이 아껴지나?","why":["서브에이전트는 자기 문맥에서 파일을 읽고 찾아본다.","메인 대화에는 결과 요약만 돌아온다."],"q3":"그래서 언제 맡기나?","so":["많이 읽어야 하지만 결론만 필요한 일을 맡긴다.","웹 페이지 읽기나 문서 찾아보기 같은 일이다."]},{"lines":["필요한 것만 골라 넣는 것이 문맥 관리다."],"q1":"왜 골라 넣나?","why":["넘치면 중요한 것을 흘려듣는다."],"q2":"골라 넣으면 빠진 건 어떻게 되나?","why2":["모르는 내용이어도 멈추지 않고 지어낼 수 있다.","처음에는 꼭 필요한 것만 넣고, 나머지는 찾는 길을 알려 준다.","필요해진 순간에 필요한 파일만 읽게 하면 넘치지 않는다."],"q3":"그래서 어떻게 고르나?","so":["근거가 부족하면 지어내지 말고 물어보라고 규칙으로 적는다.","파일은 통째로 주지 말고 필요한 부분만 지정한다.","늘 필요한 건 CLAUDE.md에, 가끔 필요한 건 스킬에 둔다."]}],
  use:[["읽힌 글이 모두 문맥이다","기획 세션에는 data.js 전체 대신 바꿀 부분만 지정한다."],["길어지면 흘려듣는다","기획, UI, 이미지처럼 세션을 역할별로 나눈다."],["넘치면 요약된다","되돌린 기획은 기획결정기록.md에 남긴다."],["빠진 건 지어낸다","기획 요청을 받으면 기획결정기록.md를 먼저 찾아보게 한다."],["서브에이전트는 문맥을 따로 쓴다","게임 전체 검수처럼 많이 읽는 일은 따로 맡기고 결과만 받는다."]],
  cmds:[["/context","지금 문맥이 얼마나 찼고 무엇이 차지하는지 보여 준다.","답이 앞 내용을 놓치는 것 같을 때 먼저 확인한다."],["/compact","대화를 요약하고 요약본으로 이어 간다. 뒤에 무엇을 중심으로 요약할지 적을 수 있다.","같은 작업을 이어 가야 하는데 대화가 길어졌을 때 쓴다."]],
  tips:[["근거가 부족하면 지어내지 말고 나한테 물어봐.","골라 넣으면 빠진 내용을 지어낼 수 있으니, 모를 때 할 일을 정해 준다."],["이 조사는 서브에이전트로 맡기고 결론만 알려 줘.","많이 읽는 일을 따로 맡겨서 메인 대화의 문맥을 깨끗하게 둔다."],["/compact 이번 세션에서 정한 화면 규칙 중심으로 요약해.","요약에서 세부가 빠질 수 있으니, 남길 내용을 직접 지정한다."]],
  mine:[["이 공부 대화는 길어져서 자동으로 한 번 요약됐다.","요약 뒤에도 메모리에 적어 둔 형식 규칙은 그대로 지켜졌다."],["명령어 목록은 서브에이전트에게 공식 문서를 찾아보게 하고, 결과 표만 받았다.","문서 여러 쪽을 메인 대화에 넣지 않았다."],["게임 개발은 세션 6개로 나눴다.","같은 CLAUDE.md를 읽지만, 대화는 세션마다 따로다."],["이력서 폴더 CLAUDE.md에는 근거가 부족하면 사용자에게 질문하라고 적혀 있다."]] },
{ name:'메모리', one:'새 대화에서도 이어지는 약속',
  what:[{"lines":["새 대화를 열면 앞 대화에서 한 말은 모른다.","메모리 파일에 저장해 둔 약속만 새 대화에서도 안다."],"q1":"왜 대화는 넘어가지 않나?","why":["모델은 대화를 저장하지 않는다.","대화도 글이지만 그 대화 안에만 있고, 끝나거나 요약되면 사라진다."],"q2":"그럼 메모리는 어디에 남나?","why2":["대화와 별도로 메모리 폴더에 md 파일로 저장한다.","약속 하나에 파일 하나를 두고, 목차 파일(MEMORY.md)이 새 대화를 시작할 때 자동으로 읽힌다."],"q3":"그래서 무엇을 남기나?","so":["짧게 답하기처럼 함께 정한 약속을 남긴다.","내 경력이나 프로젝트 상황처럼 다음에도 알아야 할 사실을 남긴다."]},{"lines":["메모리와 CLAUDE.md는 둘 다 자동으로 읽히지만 쓰임이 다르다."],"q1":"무엇이 다른가?","why":["CLAUDE.md는 프로젝트 폴더 안에 있는 규칙 문서라 사람이 직접 열고 고친다.","메모리는 Claude 쪽 설정 폴더에 있고, 주로 AI가 대화하며 쓰고 고친다."],"q3":"그래서 무엇을 어디에 두나?","so":["모두가 지킬 프로젝트 규칙은 CLAUDE.md에 둔다.","나와 일하는 방식과 피드백은 메모리에 둔다."]},{"lines":["메모리는 매 답마다 다시 읽힌다."],"q1":"왜 매번 읽히나?","why":["모델은 답할 때마다 대화 전체를 처음부터 다시 읽는다.","메모리는 그 대화 맨 앞에 붙어 있어서 같이 읽히고, 요약된 뒤에도 다시 들어간다."],"q3":"그래서 무엇을 빼나?","so":["파일이나 코드에 이미 있는 내용은 남기지 않는다.","이번 대화에서만 필요한 내용도 남기지 않는다."]},{"lines":["틀린 기억은 지워야 한다."],"q1":"왜 지워야 하나?","why":["남아 있는 기억은 매번 사실처럼 읽힌다.","틀린 기억이 남으면 같은 실수를 계속한다."],"q3":"그래서 어떻게 관리하나?","so":["약속이 바뀌면 기존 파일을 고쳐 쓴다.","보이지 않는 곳에 쌓이니, 가끔 목록을 확인하고 겹치거나 낡은 것을 정리한다."]}],
  use:[["대화는 남지 않는다","기획 결정은 기획결정기록.md에, 그날 한 일은 개발일지에 남긴다."],["규칙과 약속은 자리가 다르다","게임 규칙은 CLAUDE.md에, 답변 방식과 피드백은 메모리에 둔다."],["틀린 기억은 계속 틀린다","규칙을 바꾸면 메모리의 예전 기록도 같이 고친다."]],
  tips:[["이건 앞으로도 기억해 줘.","대화는 남지 않으니, 다음에도 필요한 약속은 메모리 파일로 옮기게 한다."],["지금 메모리에 무엇이 저장돼 있는지 보여 줘.","메모리는 매번 읽히니, 무엇이 읽히고 있는지 가끔 확인한다."],["이 기억은 이제 틀렸으니 고쳐 줘.","틀린 기억은 계속 사실처럼 읽히니 바로 고친다."]],
  mine:[["짧게 답하기, 따옴표 쓰지 않기 같은 답변 방식을 메모리에 남겼다.","새 대화에서도 같은 방식으로 답했다."],["이 공부 일지의 형식도 메모리에 남겼다.","빈 칸을 비워 두기로 했다가 빼기로 바꿨을 때, 기존 파일을 고쳐 썼다."],["방향을 정해 줄 때마다 메모리 파일이 하나씩 생기거나 고쳐졌다.","확인해 보니 이 프로젝트에만 메모리 파일이 9개 있었다."]] },
{ name:'스킬', one:'필요할 때만 불러오는 작업 설명서',
  what:[{"lines":["스킬은 그 일을 할 때만 불러오는 작업 설명서다."],"q1":"왜 필요할 때만 부르나?","why":["CLAUDE.md는 매번 읽혀서 길수록 토큰이 든다.","가끔 하는 일의 절차까지 넣으면 매번 낭비다."],"q2":"그럼 언제 불러올지는 어떻게 아나?","why2":["스킬마다 이름과 한 줄 설명은 늘 문맥에 들어 있다.","맡은 일이 그 설명과 맞으면 그때 본문을 불러온다.","필요한 절차를 필요해진 순간에 찾아 읽는다는 점이 에이전트의 장점이다."],"q3":"그래서 무엇을 스킬로 만드나?","so":["자주 하지만 매번 하지는 않는 반복 작업을 만든다.","절차가 길고 매번 같은 일일수록 좋다."]},{"lines":["스킬도 프롬프트라 확률을 높일 뿐이다."],"q1":"왜 확실하지 않나?","why":["스킬 본문도 결국 모델이 읽는 글이다.","따를 확률이 높아질 뿐, 반드시 지키게 하지는 못한다."],"q3":"그래서 꼭 지킬 건 어떻게 하나?","so":["절대 어기면 안 되는 규칙은 훅으로 검사한다."]},{"lines":["스킬과 서브에이전트는 다르다."],"q1":"무엇이 다른가?","why":["스킬은 내가 꺼내 보는 설명서라, 읽은 내용이 내 문맥에 쌓인다.","서브에이전트는 대신 일하러 보내는 다른 AI라, 결과만 돌아온다."],"q3":"그래서 언제 무엇을 쓰나?","so":["방법만 알면 바로 할 수 있는 일은 스킬로 한다.","많이 읽어야 하는데 결론만 필요한 일은 서브에이전트에 맡긴다."]},{"lines":["플러그인은 남이 만들어 둔 스킬 묶음이다."],"q1":"무엇이 들어 있나?","why":["스킬, 명령어, 훅 같은 것을 한 번에 설치하도록 묶어 둔다."],"q3":"그래서 무엇을 조심하나?","so":["켜 두면 그 스킬 설명도 매번 문맥에 들어간다.","안 쓰는 플러그인은 끈다.","남이 만든 지시라 결과가 내 기준에 맞는지 확인한다."]},{"lines":["스킬은 직접 만들 수 있다."],"q1":"어떻게 만드나?","why":["스킬 폴더에 SKILL.md 파일을 두고, 맨 위에 이름과 언제 쓸지를 적는다.","그 아래에 절차를 적는다."],"q2":"왜 언제 쓸지 한 줄이 중요한가?","why2":["그 한 줄을 보고 불러올지 정한다.","설명이 흐리면 필요할 때 안 불리거나, 필요 없을 때 불린다."],"q3":"그래서 언제 만드나?","so":["같은 절차를 여러 번 설명하고 있다면 스킬로 만들 때다."]}],
  use:[["필요할 때만 읽힌다","이미지 요청문 쓰는 절차, 봇 시뮬레이션 돌리는 절차를 스킬로 만든다."],["한 줄 설명이 부를 때를 정한다","캐릭터 이미지를 만들 때 쓴다처럼 언제 쓰는지 분명히 적는다."],["확률만 높인다","36칸 격자, 48색 팔레트 같은 그림 규격은 스킬에 적고, 결과는 비교 그림으로 확인한다."],["플러그인도 문맥을 쓴다","안 쓰는 플러그인은 끈다."]],
  tips:[["이 절차를 스킬로 만들어 줘. 언제 쓰는지 한 줄 설명도 같이 정해 줘.","반복 절차는 필요할 때만 읽히게 하고, 부를 때를 분명히 한다."],["지금 켜져 있는 스킬과 플러그인 목록을 보여 줘.","켜 둔 만큼 설명이 문맥에 들어가니 가끔 확인한다."],["anti-ai-writing으로 이 글을 다듬어 줘.","설명이 맞아떨어지기를 기다리지 않고, 이름으로 바로 불러온다."]],
  mine:[["anti-ai-writing과 Copyedit 플러그인을 설치해 공부 일지를 다듬었다.","설치한 대화에서는 바로 안 보였고, 새로 열린 대화에서야 스킬이 보였다."],["두 플러그인을 비교해 보니, 공부 일지에는 anti-ai 하나로 충분했다.","Copyedit은 오타가 치명적인 지원서용으로 남겨 두었다."],["아직 직접 만든 스킬은 없다.","캐릭터 이미지 만드는 절차가 첫 후보다."]] },
{ name:'에이전트', one:'목표를 받아 스스로 끝까지 처리하는 AI', part:'2부. 에이전트가 어떻게 움직이나',
  fig:"<svg viewBox=\"0 0 680 300\" role=\"img\" aria-label=\"에이전트 구조: 에이전트 안에 하네스가 있고, 하네스 안에 프롬프트, 도구, 작업 루프, 메모리, 훅, 허락 묻기와 goal이 나란히 있다. 하네스의 포탈을 거쳐 바깥의 LLM과 오간다.\" style=\"width:100%;height:auto;display:block;margin:8px 0 18px;font-family:var(--sans)\"><rect x=\"8\" y=\"8\" width=\"470\" height=\"284\" rx=\"8\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\"/><text x=\"24\" y=\"34\" fill=\"var(--accent)\" font-size=\"16\" font-weight=\"700\">에이전트</text><rect x=\"24\" y=\"46\" width=\"438\" height=\"232\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--moss)\" stroke-dasharray=\"6 4\"/><text x=\"40\" y=\"70\" fill=\"var(--moss)\" font-size=\"13\" font-weight=\"600\">하네스 · 내 컴퓨터 (Claude Code)</text><g font-size=\"13\" text-anchor=\"middle\"><rect x=\"40\" y=\"84\" width=\"130\" height=\"58\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"105\" y=\"108\" fill=\"var(--fg)\" font-weight=\"600\">프롬프트</text><text x=\"105\" y=\"128\" fill=\"var(--muted)\" font-size=\"11\">CLAUDE.md · 스킬</text><rect x=\"178\" y=\"84\" width=\"130\" height=\"58\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"243\" y=\"108\" fill=\"var(--fg)\" font-weight=\"600\">도구 (손)</text><text x=\"243\" y=\"128\" fill=\"var(--muted)\" font-size=\"11\">읽기 · 고치기 · MCP</text><rect x=\"316\" y=\"84\" width=\"130\" height=\"58\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"381\" y=\"108\" fill=\"var(--fg)\" font-weight=\"600\">작업 루프 (습관)</text><text x=\"381\" y=\"128\" fill=\"var(--muted)\" font-size=\"11\">결과 보고 다음 일</text><rect x=\"40\" y=\"150\" width=\"130\" height=\"58\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"105\" y=\"174\" fill=\"var(--fg)\" font-weight=\"600\">메모리 (약속)</text><text x=\"105\" y=\"194\" fill=\"var(--muted)\" font-size=\"11\">새 대화에 이어 줌</text><rect x=\"178\" y=\"150\" width=\"130\" height=\"58\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"243\" y=\"174\" fill=\"var(--fg)\" font-weight=\"600\">훅</text><text x=\"243\" y=\"194\" fill=\"var(--muted)\" font-size=\"11\">정해진 순간에 검사</text><rect x=\"316\" y=\"150\" width=\"130\" height=\"58\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"381\" y=\"174\" fill=\"var(--fg)\" font-weight=\"600\">허락 묻기 · /goal</text><text x=\"381\" y=\"194\" fill=\"var(--muted)\" font-size=\"11\">경계와 끝나는 기준</text></g><circle cx=\"462\" cy=\"244\" r=\"13\" fill=\"var(--accent)\"/><text x=\"440\" y=\"249\" fill=\"var(--fg)\" font-size=\"12\" text-anchor=\"end\">포탈</text><path d=\"M476 236 L528 222\" stroke=\"var(--accent)\" stroke-width=\"2\" fill=\"none\"/><path d=\"M528 222 l-9 -3 l3 8 z\" fill=\"var(--accent)\"/><path d=\"M528 262 L476 252\" stroke=\"var(--moss)\" stroke-width=\"2\" fill=\"none\"/><path d=\"M476 252 l9 -2 l-4 8 z\" fill=\"var(--moss)\"/><text x=\"500\" y=\"212\" fill=\"var(--muted)\" font-size=\"10.5\" text-anchor=\"middle\">보냄: 대화·문서·결과</text><text x=\"500\" y=\"282\" fill=\"var(--muted)\" font-size=\"10.5\" text-anchor=\"middle\">받음: 다음에 할 일</text><rect x=\"530\" y=\"196\" width=\"142\" height=\"84\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--fg)\" stroke-width=\"1.5\"/><text x=\"601\" y=\"230\" fill=\"var(--fg)\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\">LLM (두뇌)</text><text x=\"601\" y=\"252\" fill=\"var(--muted)\" font-size=\"11.5\" text-anchor=\"middle\">Anthropic 서버</text></svg>",
  what:[{"lines":["에이전트는 목표를 받으면 스스로 단계를 나눠 끝까지 처리하는 AI다."],"q1":"LLM과 무엇이 다른가?","why":["LLM은 글을 받아 답을 쓰는 데서 끝난다.","에이전트는 파일을 읽고, 고치고, 결과를 확인하고, 다시 고치는 일까지 직접 한다."],"q2":"어떻게 직접 하나?","why2":["LLM 바깥에 도구와 작업 루프를 붙였기 때문이다.","LLM은 다음에 할 일을 글로 요청하고, 하네스가 도구로 실제 실행한다.","작업 루프는 결과를 다시 LLM에게 보여 주고, 끝날 때까지 이 과정을 반복시킨다."],"q3":"그래서 무엇을 주나?","so":["한 줄씩 지시하지 않고, 목표와 어디서 멈출지를 준다."]},{"lines":["같은 LLM이라도 무엇을 쥐여 주느냐에 따라 다른 에이전트가 된다."],"q1":"무엇을 쥐여 주나?","why":["프롬프트는 어떻게 일할지 알려 준다.","도구는 무엇을 할 수 있는지 정한다.","메모리는 앞에서 정한 약속을 이어 준다."],"q2":"LLM은 어디에 있나?","why2":["LLM은 Anthropic 서버에 있고, 하네스는 내 컴퓨터에서 돌아간다.","하네스가 대화와 문서, 도구 결과를 모아 보내면, LLM이 다음에 할 일을 정해 돌려보낸다.","에이전트에서 LLM을 뺀 나머지 장치 전체를 하네스라고 한다."],"q3":"그래서 무엇을 다듬나?","so":["방치형 게임용과 수집형 게임용 에이전트의 차이는 LLM이 아니라 문서와 도구에서 난다.","모델을 바꾸기 전에 쥐여 준 문서와 도구부터 다듬는다."]},{"lines":["에이전트는 혼자 여러 단계를 진행해서, 경계를 정해 줘야 한다."],"q1":"왜 경계가 필요한가?","why":["한 번 맡기면 중간에 묻지 않고 여러 일을 이어서 한다.","방향이 틀리면 여러 단계가 한꺼번에 틀어진다."],"q3":"그래서 무엇을 정하나?","so":["해도 되는 일과 먼저 물어봐야 하는 일을 나눠 적는다.","되돌리기 어려운 일은 하기 전에 묻게 한다."]},{"lines":["판단은 에이전트가 하지만, 판단 기준은 사람이 준다."],"q1":"왜 맡기기만 하면 안 되나?","why":["고르는 에이전트도 LLM이라 판단이 틀릴 수 있다.","일을 해 보기 전에는 얼마나 어려운지 알기 어렵다."],"q3":"그래서 무엇을 적어 두나?","so":["픽셀 그림은 픽셀랩처럼 어떤 일에 어떤 도구를 쓸지 적어 둔다.","기획은 큰 모델에 맡기는 식으로 모델 배정 기준도 적어 둔다."]}],
  use:[["목표를 받아 스스로 진행한다","화면 하나를 고칠 때 목표와 그대로 둘 것을 함께 준다."],["쥐여 준 것에 따라 달라진다","기획, UI, 이미지 세션마다 다른 문서와 도구를 준다."],["경계가 필요하다","되돌리기, 전체 교체, 삭제는 하기 전에 묻게 한다."],["판단 기준은 사람이 준다","그림 종류마다 쓸 도구를 규칙으로 정한다."]],
  cmds:[["/plan","실행하기 전에 계획부터 세우게 한다.","여러 단계를 맡기기 전에 방향을 먼저 확인할 때 쓴다."],["/goal","끝나는 기준을 정하면, 기준이 채워질 때까지 다음 작업을 알아서 이어 간다. 판정은 다른 모델이 대화를 보고 한다.","여러 번 고쳐야 끝나는 일을 한 번에 맡길 때 쓴다."]],
  tips:[["이 작업의 목표는 상점 화면 정리이고, 버튼이 모두 사각형이 되면 끝이야. 그 전까지 알아서 진행해 줘.","목표와 끝나는 기준을 주면 한 줄씩 지시하지 않아도 끝까지 간다."],["시작하기 전에 어떻게 할지 한 줄로 먼저 말해 줘.","여러 단계를 혼자 진행하니, 방향이 틀렸으면 시작 전에 잡는다."],["파일을 지우거나 되돌리는 일은 하기 전에 물어봐.","되돌리기 어려운 일에 경계를 둔다."]],
  mine:[["게임잡 공고를 보여 달라고 하자, 이미지를 내려받고 잘라서 읽고 공고.md로 정리하는 일까지 스스로 했다."],["방치형 RPG CLAUDE.md에는 되돌리기, 전체 교체, 삭제는 하기 전에 먼저 물으라고 적었다.","방법이 정해지지 않은 요청은 이렇게 하려고 해요라고 먼저 말하게 했다."]] },
{"name":"동작 원리","one":"요청이 하네스와 LLM 사이를 오가며 처리되는 순서","fig":"<svg viewBox=\"0 0 680 250\" role=\"img\" aria-label=\"동작 원리: 내 요청을 하네스가 정리해 LLM에게 보낸다. LLM은 생각해서 글로 답한다. 하네스가 답에 도구 요청이 있는지 본다. 있으면 도구를 실행하고 결과를 붙여 다시 LLM에게 보낸다. 없으면 화면에 보여 주고 끝난다.\" style=\"width:100%;height:auto;display:block;margin:8px 0 18px;font-family:var(--sans)\"><defs><marker id=\"lp-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--muted)\"/></marker></defs><g font-size=\"13\" text-anchor=\"middle\"><rect x=\"8\" y=\"30\" width=\"100\" height=\"58\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"58\" y=\"54\" fill=\"var(--fg)\" font-weight=\"600\">나</text><text x=\"58\" y=\"74\" fill=\"var(--muted)\" font-size=\"11\">요청</text><rect x=\"150\" y=\"30\" width=\"140\" height=\"58\" rx=\"4\" fill=\"var(--panel)\" stroke=\"var(--moss)\" stroke-dasharray=\"6 4\"/><text x=\"220\" y=\"54\" fill=\"var(--moss)\" font-weight=\"600\">하네스</text><text x=\"220\" y=\"74\" fill=\"var(--muted)\" font-size=\"11\">정리해서 보냄</text><rect x=\"332\" y=\"30\" width=\"140\" height=\"58\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--accent)\" stroke-width=\"2\"/><text x=\"402\" y=\"54\" fill=\"var(--accent)\" font-weight=\"700\">LLM (두뇌)</text><text x=\"402\" y=\"74\" fill=\"var(--muted)\" font-size=\"11\">생각해서 글로 답함</text><rect x=\"514\" y=\"30\" width=\"158\" height=\"58\" rx=\"4\" fill=\"var(--panel)\" stroke=\"var(--moss)\" stroke-dasharray=\"6 4\"/><text x=\"593\" y=\"54\" fill=\"var(--moss)\" font-weight=\"600\">하네스</text><text x=\"593\" y=\"74\" fill=\"var(--muted)\" font-size=\"11\">도구 요청이 있나?</text><rect x=\"514\" y=\"170\" width=\"158\" height=\"58\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"593\" y=\"194\" fill=\"var(--fg)\" font-weight=\"600\">화면</text><text x=\"593\" y=\"214\" fill=\"var(--muted)\" font-size=\"11\">없으면 보여 주고 끝</text><rect x=\"250\" y=\"170\" width=\"160\" height=\"58\" rx=\"4\" fill=\"var(--panel)\" stroke=\"var(--moss)\" stroke-dasharray=\"6 4\"/><text x=\"330\" y=\"194\" fill=\"var(--moss)\" font-weight=\"600\">도구 (손)</text><text x=\"330\" y=\"214\" fill=\"var(--muted)\" font-size=\"11\">하네스가 실제로 실행</text></g><g stroke=\"var(--muted)\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#lp-a)\"><path d=\"M108 59H148\"/><path d=\"M290 59H330\"/><path d=\"M472 59H512\"/><path d=\"M593 88V168\"/><path d=\"M560 88L412 168\"/><path d=\"M250 199H220V90\"/></g><g font-size=\"11\" fill=\"var(--muted)\"><text x=\"600\" y=\"132\">없다</text><text x=\"470\" y=\"122\">있다</text><text x=\"212\" y=\"140\" text-anchor=\"end\">결과를 붙여</text><text x=\"212\" y=\"156\" text-anchor=\"end\">다시 보냄</text></g></svg>","what":[{"lines":["내 요청은 하네스를 거쳐 LLM에게 가고, LLM의 답도 하네스를 거쳐 화면에 나온다."],"q1":"왜 하네스를 거치나?","why":["LLM은 Anthropic 서버에 있고, 내 컴퓨터와 화면은 하네스가 맡는다.","하네스가 요청을 모아 보내고, 돌아온 답을 화면에 그린다."],"q3":"그래서 무엇을 알아 두나?","so":["요청 하나에도 LLM은 여러 번 불린다.","도구를 쓸 때마다 결과를 붙여 다시 부르기 때문이다."]},{"lines":["LLM은 생각하고 지시하며, 실행은 하네스가 한다."],"q1":"왜 LLM이 직접 실행하지 않나?","why":["LLM이 생각한 결과는 글로만 나온다.","파일이 필요하다고 판단하면 어떤 도구를 무슨 값으로 쓸지 정해, 정해진 형식의 글로 요청한다.","하네스가 그 글을 받아 내 컴퓨터에서 실제로 파일을 연다."],"q3":"그래서 무엇이 가능해지나?","so":["하네스가 실행하기 전에 사람에게 허락을 물을 수 있다."]},{"lines":["LLM은 부를 때마다 대화 전체를 처음부터 다시 읽는다."],"q1":"왜 다시 읽나?","why":["LLM은 앞에서 부른 일을 기억하지 못한다.","그래서 하네스가 대화, 문서, 도구 결과를 매번 통째로 다시 보낸다."],"q3":"그래서 무엇을 조심하나?","so":["앞 단계에서 읽은 큰 파일은 그 뒤 모든 호출에 따라 들어간다."]},{"lines":["하네스는 LLM이 읽기 좋게 정리해서 보낸다."],"q1":"무엇을 정리하나?","why":["사용자 말, 도구 결과, CLAUDE.md에 출처 꼬리표를 붙인다.","쓸 수 있는 도구 목록과 사용법을 함께 넣는다.","너무 긴 결과는 자르고, 대화가 차면 컴팩트로 요약한다."],"q3":"그래서 사람은 무엇을 하나?","so":["하네스는 그릇을 정리할 뿐이고, 안에 들어갈 문서는 사람이 쓴다."]},{"lines":["LLM이 도구 요청 없이 글만 돌려주면 작업이 끝난다."],"q1":"왜 거기서 멈추나?","why":["하네스는 도구 요청이 없으면 더 할 일이 없다고 본다."],"q3":"그래서 무엇을 주나?","so":["끝나는 기준을 주지 않으면 LLM이 다 했다고 판단한 지점에서 멈춘다.","/goal은 이 멈추는 순간에 검사를 끼워 넣어, 기준이 채워질 때까지 다시 돌린다."]},{"lines":["LLM은 사용자가 바꿀 수 없고, 손댈 수 있는 것은 전부 하네스 쪽이다."],"q1":"왜 LLM은 못 바꾸나?","why":["학습으로 맞춰 둔 숫자는 서버에 있고, 학습이 끝나면 굳는다.","/model과 /effort도 LLM을 고치는 게 아니라, 어떤 두뇌를 얼마나 생각하게 부를지 정한다."],"q3":"그래서 무엇을 다듬나?","so":["프롬프트, 메모리, 스킬, 훅, 도구를 다듬는다.","플러그인은 이것들을 묶어 하네스에 끼우는 부품이다."]}],"use":[["여러 번 불린다","큰 작업은 화면 하나, 시스템 하나 단위로 나눠 맡긴다."],["매번 다시 읽는다","큰 데이터 테이블은 필요한 시트나 구간만 읽게 한다."],["실행은 하네스가 한다","빌드, 삭제 같은 명령은 허락을 받고 실행하게 한다."],["글만 돌려주면 끝난다","테스트 통과와 화면 확인까지가 끝이라고 기준을 적어 준다."],["손댈 곳은 하네스다","결과가 마음에 안 들면 모델을 바꾸기 전에 CLAUDE.md와 스킬부터 고친다."]],"cmds":[["/context","지금 대화가 얼마나 찼는지 본다.","매번 다시 읽히는 양을 확인할 때 쓴다."],["/goal","멈추는 순간마다 기준을 검사한다.","한 번 멈춰서는 끝나지 않는 일에 쓴다."],["/model, /effort","부를 두뇌와 생각 깊이를 고른다.","LLM 쪽에서 고를 수 있는 것은 이 둘뿐이다."]],"tips":[["파일을 다 읽지 말고 필요한 부분만 찾아서 읽어 줘.","읽은 내용은 그 뒤 모든 호출에 따라 들어가므로 적게 읽을수록 가볍다."],["끝났다고 하기 전에 실제로 실행해서 확인해 줘.","확인 단계가 있어야 글만 돌려주고 멈추지 않는다."]],"mine":[["퀴즈 기능을 한 번 요청하자 파일 읽기, 코드 쓰기, 점검 스크립트 실행, 게시가 차례로 이어졌다.","게시가 거절되자 최신본을 읽고 다시 합친 뒤 올렸다."],["이 세션에는 ponytail 플러그인이 세션 시작 때 훅으로 규칙을 넣고 있다."]]},
{"name":"도구 호출","one":"하네스가 알려 준 도구 중에서 LLM이 골라 요청하고, 하네스가 실행해 결과를 돌려주는 과정","fig":"<svg viewBox=\"0 0 680 270\" role=\"img\" aria-label=\"도구 호출: 하네스가 도구 목록을 알린다. LLM이 도구와 값을 골라 글로 요청한다. 하네스는 형식과 허용 규칙만 확인하고, 맞고 틀림은 모른다. 하네스가 실행하고 성공이든 실패든 결과를 붙인다. LLM이 결과를 읽고 판단해 다시 요청하거나, 도구 요청 없이 최종 답을 낸다.\" style=\"width:100%;height:auto;display:block;margin:8px 0 18px;font-family:var(--sans)\"><defs><marker id=\"tc-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--muted)\"/></marker></defs><rect x=\"0\" y=\"20\" width=\"680\" height=\"90\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><rect x=\"0\" y=\"140\" width=\"680\" height=\"90\" fill=\"var(--panel)\" stroke=\"var(--line)\"/><g font-size=\"13\" font-weight=\"700\"><text x=\"10\" y=\"70\" fill=\"var(--moss)\">하네스</text><text x=\"10\" y=\"190\" fill=\"var(--accent)\">LLM</text></g><g font-size=\"13\" text-anchor=\"middle\"><rect x=\"82\" y=\"37\" width=\"118\" height=\"56\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--moss)\" stroke-dasharray=\"6 4\"/><text x=\"141\" y=\"60\" fill=\"var(--fg)\" font-weight=\"600\">① 도구 목록</text><text x=\"141\" y=\"79\" fill=\"var(--muted)\" font-size=\"11\">이름·하는 일·입력값</text><rect x=\"290\" y=\"37\" width=\"150\" height=\"56\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--moss)\" stroke-dasharray=\"6 4\"/><text x=\"365\" y=\"60\" fill=\"var(--fg)\" font-weight=\"600\">③ 규칙 확인</text><text x=\"365\" y=\"79\" fill=\"var(--muted)\" font-size=\"11\">맞고 틀림은 모름</text><rect x=\"500\" y=\"37\" width=\"170\" height=\"56\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--moss)\" stroke-dasharray=\"6 4\"/><text x=\"585\" y=\"60\" fill=\"var(--fg)\" font-weight=\"600\">④ 실행, 결과 붙임</text><text x=\"585\" y=\"79\" fill=\"var(--muted)\" font-size=\"11\">성공이든 실패든</text><rect x=\"170\" y=\"157\" width=\"150\" height=\"56\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--accent)\" stroke-width=\"2\"/><text x=\"245\" y=\"180\" fill=\"var(--fg)\" font-weight=\"600\">② 도구·값 골라 요청</text><text x=\"245\" y=\"199\" fill=\"var(--muted)\" font-size=\"11\">정해진 형식의 글</text><rect x=\"420\" y=\"157\" width=\"180\" height=\"56\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--accent)\" stroke-width=\"2\"/><text x=\"510\" y=\"180\" fill=\"var(--fg)\" font-weight=\"600\">⑤ 결과 읽고 판단</text><text x=\"510\" y=\"199\" fill=\"var(--muted)\" font-size=\"11\">error가 보이면 실패</text></g><g stroke=\"var(--muted)\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#tc-a)\"><path d=\"M150 93L205 155\"/><path d=\"M280 157L330 95\"/><path d=\"M440 65H498\"/><path d=\"M585 93L550 155\"/><path d=\"M420 185H322\"/><path d=\"M510 213V258H600\"/></g><g font-size=\"11\" fill=\"var(--muted)\"><text x=\"371\" y=\"178\" text-anchor=\"middle\">다시 요청</text><text x=\"606\" y=\"262\">최종 답 › 나</text><text x=\"518\" y=\"244\">도구 요청이 없으면</text></g></svg>","what":[{"lines":["도구는 하네스에 붙어 있고, 하네스는 그 목록을 LLM에게 알려 준다."],"q1":"목록에는 무엇이 적혀 있나?","why":["도구마다 이름, 하는 일, 받는 입력값이 적혀 있다.","예를 들어 Read는 파일을 읽고, Edit은 파일을 고치고, PowerShell은 윈도우 명령을 실행한다."],"q3":"그래서 무엇이 정해지나?","so":["LLM은 목록에 없는 도구를 부를 수 없다.","MCP나 플러그인을 붙이면 목록에 도구가 늘어난다."]},{"lines":["어떤 도구를 무슨 값으로 쓸지는 LLM이 정한다."],"q1":"무엇을 보고 정하나?","why":["내 요청과 도구 설명을 함께 읽고 추론한다."],"q2":"설명이 부족하면 어떻게 되나?","why2":["비슷한 도구 중 엉뚱한 것을 고르거나, 써야 할 때 안 쓴다."],"q3":"그래서 무엇을 적나?","so":["도구를 직접 만들면 언제 쓰는지까지 설명에 적는다."]},{"lines":["하네스는 규칙에 맞는지만 확인하고 실행한다."],"q1":"무엇을 확인하나?","why":["목록에 있는 도구인지, 입력값 형식이 맞는지 본다.","사람이 정한 허용·거부 규칙이나 훅 검사에 걸리는지 본다."],"q2":"고른 도구가 맞는지는 확인하나?","why2":["하네스는 확인하지 못한다.","형식이 맞고 허용된 일이면, 엉뚱한 파일을 고치라는 요청도 그대로 실행한다."],"q3":"그래서 무엇을 정하나?","so":["삭제나 push처럼 되돌리기 어려운 일은 실행 전에 묻게 둔다."]},{"lines":["도구 결과는 사람에게 오지 않고 LLM에게 돌아간다."],"q1":"왜 LLM에게 가나?","why":["하네스는 성공이든 실패든 결과를 대화에 붙여 LLM을 다시 부른다.","사람에게 오는 것은 LLM이 도구 요청 없이 내놓은 최종 답뿐이다."],"q3":"그래서 무엇을 알아 두나?","so":["이 반복은 LLM이 도구 요청을 멈출 때까지 이어진다.","큰 결과는 그 뒤 모든 호출에 따라 들어가므로, 필요한 부분만 돌려받게 한다."]},{"lines":["실패를 알아보는 것도 LLM이다."],"q1":"어떻게 알아보나?","why":["같은 LLM이 결과 글을 다시 읽다가 error나 FAILED 같은 말을 보면 실패라고 판단한다.","실패를 따로 판정하는 장치는 없다."],"q3":"그래서 무엇을 만들어 두나?","so":["틀려도 결과 글에 티가 안 나면 아무도 모른다.","틀리면 오류가 찍히도록 테스트와 훅을 미리 만들어 둔다."]}],"use":[["목록에 있는 도구만 부른다","유니티 에디터를 직접 다루게 하려면 그 일을 하는 도구를 먼저 붙인다."],["LLM이 설명을 보고 고른다","데이터 테이블 검사 스크립트를 도구로 만들면 언제 쓰는지까지 설명에 적는다."],["하네스는 맞고 틀림을 모른다","에셋 삭제와 git push는 실행 전에 묻게 두고, 읽기와 테스트 실행은 허용한다."],["결과는 LLM에게 돌아간다","빌드 로그는 전체 말고 오류 줄만 돌려받는다."],["티 나는 실패만 알아본다","밸런스 수치를 넣은 뒤 범위 검사 스크립트를 돌려, 틀린 칸이 오류로 찍히게 한다."]],"cmds":[["/permissions","도구별 허용·거부 규칙을 보고 고친다.","매번 묻는 도구를 허용하거나, 위험한 도구를 막을 때 쓴다."],["Shift+Tab","권한 모드를 바꾼다.","수정할 때마다 물을지, 계획만 세울지 고를 때 쓴다."]],"tips":[["로그는 전체 말고 오류 줄만 찾아서 보여 줘.","결과는 그 뒤 모든 호출에 따라 들어간다."],["고친 뒤에는 테스트를 돌려서 결과까지 확인해 줘.","실패가 결과 글에 찍혀야 LLM이 알아본다."],["서로 상관없는 파일은 한 번에 읽어 줘.","도구 요청을 한 답에 모으면 LLM을 부르는 횟수가 준다."]],"mine":[["페이지 게시가 거절되자 그 오류가 도구 결과로 돌아왔다.","Claude는 그 결과를 읽고 최신본을 다시 읽어 합친 뒤 올렸다."]]},
{"name":"MCP","one":"바깥 프로그램이 만든 도구를 하네스에 붙이는 표준 규격","fig":"<svg viewBox=\"0 0 680 240\" role=\"img\" aria-label=\"MCP: 하네스 안에 기본 도구가 있고, 브라우저 서버, 드라이브 서버, 직접 만든 서버가 MCP라는 같은 규격으로 하네스에 붙는다. 붙은 도구는 기본 도구와 함께 도구 목록에 들어가고, LLM이 그 목록을 보고 고른다.\" style=\"width:100%;height:auto;display:block;margin:8px 0 18px;font-family:var(--sans)\"><defs><marker id=\"mc-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--muted)\"/></marker></defs><g font-size=\"13\" text-anchor=\"middle\"><rect x=\"8\" y=\"92\" width=\"120\" height=\"56\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--accent)\" stroke-width=\"2\"/><text x=\"68\" y=\"115\" fill=\"var(--accent)\" font-weight=\"700\">LLM (두뇌)</text><text x=\"68\" y=\"134\" fill=\"var(--muted)\" font-size=\"11\">목록 보고 고름</text><rect x=\"170\" y=\"14\" width=\"220\" height=\"212\" rx=\"4\" fill=\"var(--panel)\" stroke=\"var(--moss)\" stroke-dasharray=\"6 4\"/><text x=\"280\" y=\"38\" fill=\"var(--moss)\" font-weight=\"600\">하네스</text><rect x=\"190\" y=\"54\" width=\"180\" height=\"52\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"280\" y=\"76\" fill=\"var(--fg)\" font-weight=\"600\">기본 도구</text><text x=\"280\" y=\"94\" fill=\"var(--muted)\" font-size=\"11\">Read · Edit · PowerShell</text><rect x=\"190\" y=\"150\" width=\"180\" height=\"56\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"280\" y=\"173\" fill=\"var(--fg)\" font-weight=\"600\">도구 목록</text><text x=\"280\" y=\"192\" fill=\"var(--muted)\" font-size=\"11\">기본 도구 + 붙인 도구</text><rect x=\"500\" y=\"14\" width=\"172\" height=\"56\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"586\" y=\"37\" fill=\"var(--fg)\" font-weight=\"600\">브라우저 서버</text><text x=\"586\" y=\"56\" fill=\"var(--muted)\" font-size=\"11\">열기 · 클릭 · 읽기</text><rect x=\"500\" y=\"92\" width=\"172\" height=\"56\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"586\" y=\"115\" fill=\"var(--fg)\" font-weight=\"600\">드라이브 서버</text><text x=\"586\" y=\"134\" fill=\"var(--muted)\" font-size=\"11\">찾기 · 읽기 · 만들기</text><rect x=\"500\" y=\"170\" width=\"172\" height=\"56\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\" stroke-dasharray=\"3 3\"/><text x=\"586\" y=\"193\" fill=\"var(--fg)\" font-weight=\"600\">직접 만든 서버</text><text x=\"586\" y=\"212\" fill=\"var(--muted)\" font-size=\"11\">예: 봇 시뮬레이션</text></g><g stroke=\"var(--muted)\" stroke-width=\"1.5\" fill=\"none\"><path d=\"M128 120H168\" marker-start=\"url(#mc-a)\" marker-end=\"url(#mc-a)\"/><path d=\"M280 106V148\" marker-end=\"url(#mc-a)\"/><path d=\"M500 42H450V178H372\" marker-end=\"url(#mc-a)\"/><path d=\"M500 120H450\"/><path d=\"M500 198H450\"/></g><g font-size=\"11\" fill=\"var(--muted)\"><text x=\"400\" y=\"128\" font-weight=\"600\" fill=\"var(--moss)\">MCP</text><text x=\"400\" y=\"143\">같은 규격</text></g></svg>","what":[{"lines":["MCP는 도구를 하네스에 붙이는 표준 계약서이고, MCP 서버는 서비스 하나의 도구를 묶어 주는 업체다."],"q1":"왜 표준 계약서가 필요한가?","why":["계약서가 없으면 Claude Code나 Claude 앱처럼 하네스마다 연결을 따로 만들어야 한다.","규격에 맞춘 서버 하나는 MCP를 지원하는 여러 하네스에 그대로 붙는다."],"q3":"그래서 무엇부터 하나?","so":["필요한 도구가 없으면 이미 만들어진 MCP 서버가 있는지 먼저 찾는다.","GitHub, Figma처럼 서비스 회사가 직접 낸 서버도 많다."]},{"lines":["붙인 도구는 LLM에게 기본 도구와 똑같이 보이고, 고르는 쪽은 여전히 LLM이다."],"q1":"어떻게 보이나?","why":["기본 도구처럼 이름, 하는 일, 입력값으로 목록에 들어간다.","이 세션에서 이름이 mcp__로 시작하는 도구들이 MCP로 붙은 것이다."],"q2":"업체가 알아서 판단하지는 않나?","why2":["서버는 주문받은 일만 처리한다.","스스로 판단하는 일꾼은 서브에이전트다."],"q3":"그래서 무엇을 보나?","so":["설명이 부실한 서버의 도구는 잘 안 쓰이거나 엉뚱하게 쓰인다."]},{"lines":["서버를 많이 붙일수록 매번 보내는 글이 길어지고, 서버는 내 권한으로 일한다."],"q1":"왜 둘 다 조심하나?","why":["도구 목록은 LLM을 부를 때마다 함께 보내는 글에 들어간다.","서버는 내 계정으로 파일을 고치거나 글을 올릴 수 있다.","서버가 가져온 웹페이지나 메일 속에 숨겨 둔 지시가 섞여 들어올 수 있다."],"q2":"도구 설명까지 매번 다 보내나?","why2":["Claude Code는 도구가 많으면 이름만 먼저 보내고, 설명은 필요할 때 불러온다."],"q3":"그래서 무엇을 정하나?","so":["쓰지 않는 서버는 꺼 둔다.","믿을 수 있는 곳의 서버만 붙이고, 무언가를 바꾸는 도구는 실행 전에 묻게 둔다."]},{"lines":["직접 만들 수 있지만, 한 프로젝트에서만 쓸 거라면 스크립트와 CLAUDE.md로 충분하다."],"q1":"무엇을 정하면 만들 수 있나?","why":["도구 이름과 하는 일, 받는 입력값, 언제 쓰는지 적은 설명을 정하면 코드는 Claude가 쓴다.","공식 SDK가 파이썬과 타입스크립트로 나와 있다."],"q3":"그래서 언제 만드나?","so":["여러 프로젝트나 여러 하네스에서 쓰거나, 바깥 서비스에 연결할 때 만든다."]}],"use":[["표준 규격","유니티나 블렌더용 MCP 서버가 있는지 찾아 붙이면 에디터를 직접 다루게 할 수 있다."],["목록이 길어진다","그날 작업에 필요한 서버만 켠다."],["내 권한으로 일한다","git push나 스토어 업로드처럼 밖으로 나가는 도구는 허용 목록에서 뺀다."],["직접 만든다","봇 시뮬레이션은 지금은 스크립트로 두고, 다음 게임에서도 쓰게 되면 MCP 서버로 감싼다."]],"cmds":[["/mcp","연결된 서버와 연결 상태를 보고, 로그인이 필요하면 한다.","MCP 도구가 안 보이거나 안 될 때 쓴다."],["claude mcp add","터미널에서 MCP 서버를 추가한다.","새 서버를 붙일 때 쓴다."],["/context","도구 목록이 대화에서 차지하는 양을 본다.","서버를 많이 붙였을 때 쓴다."]],"tips":[["이 일에 맞는 MCP 서버가 있는지 먼저 찾아보고, 없으면 스크립트로 해 줘.","이미 만들어진 서버를 붙이는 게 새로 만드는 것보다 빠르다."],["이 MCP 서버가 주는 도구를 나열하고, 무언가를 바꾸는 도구는 따로 표시해 줘.","바꾸는 도구를 알아야 허용할 범위를 정할 수 있다."]],"mine":[["이 세션의 도구 목록에는 이름이 mcp__로 시작하는 도구가 수십 개 있다.","그중 상당수는 이름만 올라와 있다가, 쓸 때 설명을 불러온다."]]},
{"name":"서브에이전트","one":"에이전트가 일을 떼어 맡기려고 부르는 에이전트","fig":"<svg viewBox=\"0 0 680 230\" role=\"img\" aria-label=\"서브에이전트: 나는 메인 에이전트와 대화한다. 메인 LLM이 일을 떼어 서브에이전트 A와 B에게 지시문을 보낸다. 서브에이전트는 지시문만 아는 자기 컨텍스트 창에서 일하고, 메인에게 요약만 돌려준다. A와 B는 동시에 돌 수 있다.\" style=\"width:100%;height:auto;display:block;margin:8px 0 12px;font-family:var(--sans)\"><defs><marker id=\"sb-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--muted)\"/></marker></defs><g font-size=\"13\" text-anchor=\"middle\"><rect x=\"8\" y=\"87\" width=\"90\" height=\"56\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"53\" y=\"120\" fill=\"var(--fg)\" font-weight=\"600\">나</text><rect x=\"140\" y=\"30\" width=\"200\" height=\"170\" rx=\"4\" fill=\"var(--panel)\" stroke=\"var(--accent)\" stroke-width=\"2\"/><text x=\"240\" y=\"56\" fill=\"var(--accent)\" font-weight=\"700\">메인 에이전트</text><text x=\"240\" y=\"75\" fill=\"var(--muted)\" font-size=\"11\">LLM + 하네스</text><text x=\"240\" y=\"112\" fill=\"var(--fg)\" font-size=\"12\">컨텍스트: 나와 나눈 대화 전체</text><text x=\"240\" y=\"140\" fill=\"var(--fg)\" font-size=\"12\">맡길지는 메인 LLM이 판단</text><text x=\"240\" y=\"168\" fill=\"var(--fg)\" font-size=\"12\">판단과 마무리는 메인이</text><rect x=\"470\" y=\"20\" width=\"202\" height=\"78\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--moss)\" stroke-dasharray=\"6 4\"/><text x=\"571\" y=\"44\" fill=\"var(--moss)\" font-weight=\"600\">서브에이전트 A</text><text x=\"571\" y=\"64\" fill=\"var(--muted)\" font-size=\"11\">컨텍스트: 지시문만</text><text x=\"571\" y=\"82\" fill=\"var(--muted)\" font-size=\"11\">도구: 읽기만 (예)</text><rect x=\"470\" y=\"132\" width=\"202\" height=\"78\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--moss)\" stroke-dasharray=\"6 4\"/><text x=\"571\" y=\"156\" fill=\"var(--moss)\" font-weight=\"600\">서브에이전트 B</text><text x=\"571\" y=\"176\" fill=\"var(--muted)\" font-size=\"11\">컨텍스트: 지시문만</text><text x=\"571\" y=\"194\" fill=\"var(--muted)\" font-size=\"11\">A와 동시에 돌 수 있음</text></g><g stroke=\"var(--muted)\" stroke-width=\"1.5\" fill=\"none\"><path d=\"M98 115H138\" marker-start=\"url(#sb-a)\" marker-end=\"url(#sb-a)\"/><path d=\"M340 52H468\" marker-end=\"url(#sb-a)\"/><path d=\"M468 70H342\" marker-end=\"url(#sb-a)\"/><path d=\"M340 164H468\" marker-end=\"url(#sb-a)\"/><path d=\"M468 182H342\" marker-end=\"url(#sb-a)\"/></g><g font-size=\"11\" fill=\"var(--muted)\" text-anchor=\"middle\"><text x=\"404\" y=\"46\">지시문</text><text x=\"404\" y=\"86\">요약만</text><text x=\"404\" y=\"158\">지시문</text><text x=\"404\" y=\"198\">요약만</text></g></svg><div class=\"tbl\"><table><tr><th></th><th>에이전트(메인)</th><th>서브에이전트</th></tr><tr><td>누가 일을 주나</td><td><ul class=\"ln\"><li>내가 준다.</li></ul></td><td><ul class=\"ln\"><li>메인 LLM이 준다.</li></ul></td></tr><tr><td>무엇을 알고 시작하나</td><td><ul class=\"ln\"><li>나와 나눈 대화 전체를 안다.</li></ul></td><td><ul class=\"ln\"><li>메인이 써 준 지시문만 안다.</li></ul></td></tr><tr><td>결과를 누구에게 주나</td><td><ul class=\"ln\"><li>나에게 준다.</li></ul></td><td><ul class=\"ln\"><li>메인에게 요약만 준다.</li></ul></td></tr><tr><td>쓸 수 있는 도구</td><td><ul class=\"ln\"><li>하네스에 붙은 도구를 다 쓴다.</li></ul></td><td><ul class=\"ln\"><li>역할에 맞게 좁혀 둘 수 있다.</li></ul></td></tr></table></div>","what":[{"lines":["서브에이전트는 에이전트가 부르는 에이전트다."],"q1":"에이전트와 무엇이 같고 무엇이 다른가?","why":["LLM과 하네스로 되어 있고, 도구를 고르며 반복하는 것은 같다.","다른 것은 누가 일을 주고, 무엇을 알고 시작하고, 결과를 누구에게 주느냐다."],"q2":"MCP 서버, 스킬, 세션과는 무엇이 다른가?","why2":["MCP 서버는 주문받은 일만 하지만, 서브에이전트는 도구를 스스로 골라 가며 끝까지 한다.","스킬은 메인이 같은 대화 안에서 꺼내 읽는 절차서다.","세션은 내가 직접 말을 거는 에이전트다."]},{"lines":["맡길지 말지는 메인 LLM이 정한다."],"q1":"어떻게 정하나?","why":["하네스가 도구 목록에 서브에이전트 목록과 각각 언제 쓰는지를 넣어 보낸다.","메인 LLM이 그 설명을 읽고, 맡길지 직접 할지 정한다.","서브에이전트를 부르는 것도 도구 호출의 한 종류다."],"q3":"그래서 사람은 무엇을 하나?","so":["기준을 써 준다.","서브에이전트 설명에 언제 쓰는지 적거나, CLAUDE.md에 규칙을 두거나, 그때그때 서브에이전트로 해 달라고 말한다."]},{"lines":["서브에이전트는 메인과 따로 자기 컨텍스트 창을 가진다."],"q1":"왜 따로 두나?","why":["메인이 파일을 많이 읽으면, 읽은 내용이 그 뒤 모든 호출에 따라 들어간다.","서브에이전트는 자기 창에서 읽고, 메인에게는 요약만 돌려준다.","서로 상관없는 일은 여러 서브에이전트가 동시에 처리한다."],"q3":"그래서 무엇을 맡기나?","so":["많이 읽어야 하지만 결론만 필요한 일을 맡긴다.","판단과 마무리는 대화 전체를 아는 메인이 한다."]},{"lines":["서브에이전트는 부를 때마다 기본 비용이 들어서, 메인이 바로 할 수 있는 작은 일을 넘기면 오히려 손해다."],"q1":"왜 기본 비용이 드나?","why":["부를 때마다 새 창이 열리고, 하네스가 기본 지시와 도구 목록을 새로 넣는다.","서브에이전트도 여러 번 호출하면서 그 창을 매번 다시 읽는다."],"q2":"이어서 말을 걸면 새 창이 안 열리나?","why2":["이어 가면 같은 창 안에 대화가 쌓이고, 부를 때마다 그 내용을 통째로 다시 읽는다."],"q3":"그래서 언제 넘기나?","so":["도구 몇 번이면 끝날 일은 메인이 직접 한다.","많이 읽고 그 뒤에도 대화가 길게 이어질 때 넘긴다."]},{"lines":["서브에이전트는 메인이 써 준 지시문만 보고 일한다."],"q1":"왜 지시문만 아나?","why":["메인 대화를 복사해 받지 않고, 메인이 필요하다고 판단한 것만 지시문으로 받는다.","빠진 내용은 모르니 관련 파일을 처음부터 다시 읽는다."],"q2":"요약이 틀리면 어떻게 되나?","why2":["메인은 돌아온 요약을 그대로 믿기 쉽다.","중요한 결론은 파일 위치나 숫자 같은 근거를 같이 받는다."],"q3":"그래서 무엇을 적어 주나?","so":["목표, 이미 아는 것, 범위, 돌려받을 형식을 적어 준다."]},{"lines":["서브에이전트는 파일로 직접 만들 수 있다."],"q1":"무엇을 적나?","why":[".claude/agents 폴더에 이름, 언제 쓰는지 설명, 쓸 수 있는 도구, 모델, 지시문을 적은 파일을 둔다."],"q3":"그래서 무엇이 좋아지나?","so":["반복해서 맡기는 역할은 매번 같은 기준으로 일한다.","도구를 읽기만으로 좁히면, 고치면 안 되는 일꾼이 파일을 건드리지 못한다.","단순한 검색은 가벼운 모델로 돌릴 수 있지만, 어떤 일에 어떤 모델을 쓸지는 사람이 정한다."]}],"use":[["자기 창에서 읽고 요약만 준다","1-1부터 1-10까지 봇 결과 로그 분석은 맡기고 결론만 받는다."],["작은 일은 손해다","data.js 숫자 하나 고치는 일은 메인이 직접 한다."],["지시문만 안다","맡길 때 기획결정기록.md처럼 먼저 읽을 파일을 지목한다."],["파일로 만든다","QA 검수자를 .claude/agents에 만들고, 도구는 읽기와 화면 보기만 준다."],["동시에 돌린다","영웅 밸런스 검토를 등급마다 나눠 동시에 돌린다."]],"cmds":[["/agents","서브에이전트 목록을 보고, 새로 만들거나 고친다.","반복해서 맡길 역할을 만들 때 쓴다."]],"tips":[["이 조사는 서브에이전트에게 맡기고, 결론과 근거 파일 위치만 받아 와 줘.","읽은 내용이 메인 창에 쌓이지 않는다."],["서브에이전트에게 맡길 때 목표, 범위, 돌려받을 형식을 적어서 보내 줘.","서브에이전트는 메인 대화를 모른다."]],"mine":[["이 세션의 도구 목록에는 Explore, Plan, claude-code-guide 같은 서브에이전트가 설명과 함께 올라와 있다."],["게임 프로젝트는 서브에이전트가 아니라 세션 일곱 개로 나눴다.","각 세션과 내가 직접 대화하며 확인해야 했기 때문이다."]]},
{"name":"작업 루프","one":"에이전트가 일을 끝낼 때까지 도는 반복, 사람은 입구와 출구를 설계한다","fig":"<svg viewBox=\"0 0 680 240\" role=\"img\" aria-label=\"작업 루프: 사람이 입구에서 요청, 확인 방법, 끝 기준, 중간 지점을 정한다. 루프는 살펴보기, 하기, 확인하기를 반복한다. 출구는 LLM이 도구 요청을 멈출 때, 사람이 Esc로 멈출 때, 기준이 채워질 때, 중간 지점에서 보고할 때다.\" style=\"width:100%;height:auto;display:block;margin:8px 0 18px;font-family:var(--sans)\"><defs><marker id=\"lo-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--muted)\"/></marker></defs><g font-size=\"13\" text-anchor=\"middle\"><rect x=\"8\" y=\"76\" width=\"150\" height=\"88\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"83\" y=\"102\" fill=\"var(--fg)\" font-weight=\"600\">입구 (사람)</text><text x=\"83\" y=\"124\" fill=\"var(--muted)\" font-size=\"11\">요청 · 확인 방법</text><text x=\"83\" y=\"142\" fill=\"var(--muted)\" font-size=\"11\">끝 기준 · 중간 지점</text><rect x=\"210\" y=\"20\" width=\"120\" height=\"48\" rx=\"4\" fill=\"var(--panel)\" stroke=\"var(--accent)\" stroke-width=\"2\"/><text x=\"270\" y=\"49\" fill=\"var(--fg)\" font-weight=\"600\">살펴보기</text><rect x=\"380\" y=\"20\" width=\"120\" height=\"48\" rx=\"4\" fill=\"var(--panel)\" stroke=\"var(--accent)\" stroke-width=\"2\"/><text x=\"440\" y=\"49\" fill=\"var(--fg)\" font-weight=\"600\">하기</text><rect x=\"295\" y=\"172\" width=\"120\" height=\"48\" rx=\"4\" fill=\"var(--panel)\" stroke=\"var(--accent)\" stroke-width=\"2\"/><text x=\"355\" y=\"201\" fill=\"var(--fg)\" font-weight=\"600\">확인하기</text><text x=\"355\" y=\"118\" fill=\"var(--muted)\" font-size=\"12\">반복 한 번</text><text x=\"355\" y=\"135\" fill=\"var(--muted)\" font-size=\"11\">(iteration)</text><rect x=\"540\" y=\"40\" width=\"132\" height=\"160\" rx=\"4\" fill=\"var(--bg)\" stroke=\"var(--line)\"/><text x=\"606\" y=\"64\" fill=\"var(--fg)\" font-weight=\"600\">출구</text></g><g font-size=\"11\" fill=\"var(--muted)\"><text x=\"552\" y=\"92\">도구 요청 없음</text><text x=\"552\" y=\"118\">Esc로 멈춤</text><text x=\"552\" y=\"144\">기준 충족 (/goal)</text><text x=\"552\" y=\"170\">중간 지점 보고</text></g><g stroke=\"var(--muted)\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#lo-a)\"><path d=\"M158 110L208 56\"/><path d=\"M330 44H378\"/><path d=\"M450 68L395 170\"/><path d=\"M310 172L265 70\"/><path d=\"M415 196H500L538 160\"/></g></svg>","what":[{"lines":["작업 루프(agent loop)는 LLM이 도구 요청을 멈출 때까지 하네스가 LLM을 거듭 부르는 반복이다."],"q1":"반복 한 번에 무엇이 들어가나?","why":["하네스가 컨텍스트를 정리해 LLM을 부르고, LLM이 도구를 고르고, 하네스가 실행해 결과를 붙인다.","이 한 번을 반복(iteration) 한 번, 또는 스텝이라고 부른다."],"q3":"그래서 사람은 무엇을 하나?","so":["반복 하나하나를 지시하지 않고, 루프의 입구와 출구를 설계한다."]},{"lines":["반복마다 확인 단계를 넣으면 루프가 스스로 고친다."],"q1":"왜 확인 단계가 있어야 하나?","why":["결과가 글로 찍혀야 LLM이 다음 반복에서 읽고 고친다.","확인 없이 하기만 반복하면 LLM이 다 했다고 판단한 곳에서 멈춘다."],"q3":"그래서 무엇을 같이 주나?","so":["테스트, 봇 시뮬레이션, 검수 기준처럼 결과가 글로 찍히는 확인 방법을 준다."]},{"lines":["끝 기준과 중간 지점은 사람이 정한다."],"q1":"왜 사람이 정하나?","why":["기준이 없으면 LLM이 다 했다고 판단한 곳에서 멈춘다.","방향이 맞는지는 결과를 본 사람이 판단한다."],"q3":"그래서 어떻게 적나?","so":["1-1부터 1-10까지 맞추되, 1-3까지 끝나면 멈추고 승률 표를 보여 달라고 적는다.","/goal을 쓰면 기준이 채워질 때까지 다시 돌린다."]},{"lines":["반복이 짧을수록 정확하지만, 서로 이어진 일은 쪼개지 않는다."],"q1":"왜 짧을수록 정확한가?","why":["반복마다 컨텍스트 전체를 다시 읽으니 길어질수록 비싸다.","컨텍스트 창이 차면 컴팩트로 요약되어 앞 내용을 놓친다."],"q2":"그러면 잘게 쪼갤수록 좋은가?","why2":["밸런스처럼 서로 이어진 일은 쪼개면 전체 곡선을 모른 채 맞추게 된다.","서로 상관없는 일만 쪼개거나 나눠 맡긴다."],"q3":"그래서 언제 끊나?","so":["컨텍스트가 차서 앞 내용을 놓치기 시작하면 끊는다."]},{"lines":["같은 실수를 되풀이하면 사람이 끊는다."],"q1":"왜 사람이 끊어야 하나?","why":["같은 방법으로 몇 번 실패하면 루프가 스스로 빠져나오지 못할 때가 있다."],"q3":"그래서 어떻게 하나?","so":["같은 오류가 두 번 나면 Esc로 멈추고 방향을 다시 준다."]}],"use":[["확인이 있어야 고친다","밸런스를 바꾸면 봇 시뮬레이션까지 돌려 승률을 보고 끝내게 한다."],["끝 기준과 중간 지점","1-3까지 끝나면 멈추고 승률 표를 보여 달라고 적는다."],["이어진 일은 쪼개지 않는다","밸런스 곡선은 한 요청으로 두고, 영웅 그림은 등급별로 나눠 맡긴다."],["같은 실수를 되풀이한다","같은 빌드 오류가 두 번 나면 멈추고 원인부터 묻는다."]],"cmds":[["Esc","지금 돌고 있는 루프를 멈춘다.","엉뚱한 방향으로 가거나 같은 실수를 되풀이할 때 쓴다."],["Shift+Tab (계획 모드)","실행 없이 살펴보기와 계획까지만 돌린다.","큰 일을 맡기기 전에 방향부터 맞출 때 쓴다."],["/goal","기준이 채워질 때까지 루프를 다시 돌린다.","한 번 멈춰서는 끝나지 않는 일에 쓴다."],["/loop","같은 요청을 정해진 간격마다 되풀이한다.","작업 루프와 이름만 비슷하다. 어떤 일이 끝나는 순간에 맞추려면 훅이나 세션 알림을 쓴다."]],"tips":[["고치기 전에 관련 파일부터 살펴보고 계획을 말해 줘.","살펴보기가 빠지면 엉뚱한 곳을 고치는 반복이 늘어난다."],["같은 방법으로 두 번 실패하면 멈추고 나한테 물어봐.","루프가 스스로 빠져나오지 못하는 걸 막는다."],["무기 색이 옷과 겹치지 않는지, 폭이 기사보다 넓지 않은지 2번 검수하고 보고해.","검수 기준을 적어 두면 매번 같은 눈으로 확인한다."]],"mine":[["이미지 작업은 2번 검수하고 보고하라고 맡긴다.","검수는 확인 단계, 2번은 끝 기준, 보고는 중간 지점이다."],["도구 호출 항목을 넣던 중 스크립트가 찾을 문장을 못 찾았다는 오류를 냈다.","Claude는 오류를 읽고 파일 끝 모양을 확인한 뒤, 찾을 문장을 고쳐 다시 돌렸다."]]},
];

// 항목끼리 이어지는 흐름. 각 항목 맨 위에 자기가 속한 흐름을 보여 준다.
// w: 칸 사이 연결 비중. h 높음(⇒), m 중간(→), l 낮음(⇢).
const FLOWS = [
  { name:'기억 흐름', nodes:['LLM','토큰','문맥 관리','메모리'], w:['h','h','m'] },
  { name:'확률 흐름', nodes:['LLM','결과 변동성','프롬프트','스킬','훅','검증'], w:['h','h','h','l','m'] },
];
const ARROW = { h:['⇒','연결 높음'], m:['→','연결 중간'], l:['⇢','연결 낮음'] };

// 받침에 따라 은/는, 을/를을 고른다. 한글이 아니면(LLM 등) 받침 있는 쪽.
const jo = (w, withB, noB) => { const c = w.charCodeAt(w.length - 1); return w + (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 === 0 ? noB : withB); };

function vibe(){
  const ready = n => STUDY.some(s => s.name === n && !s.soon);
  const flow = t => FLOWS.filter(f => f.nodes.includes(t.name)).map(f => `<div class="flow"><span class="fl">${f.name}</span>${f.nodes.map(n =>
    n === t.name ? `<b>${esc(n)}</b>` : ready(n) ? `<a href="#vibe" data-go="${esc(n)}">${esc(n)}</a>` : `<span>${esc(n)}</span>`).reduce((acc, x, k) => acc + (k ? `<i class="${f.w[k - 1]}" title="${ARROW[f.w[k - 1]][1]}">${ARROW[f.w[k - 1]][0]}</i>` : '') + x, '')}</div>`).join('');
  // 마침표로 끝나는 문장마다 한 줄, 앞에 ▪.
  const ul = a => `<ul class="ln">${a.flatMap(x => x.split(/(?<=\.)\s+/)).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const slot = (label, a) => a ? `<div class="slot"><b>${label}</b>${ul(a)}</div>` : '';
  const item = t => t.soon
    ? `<div class="term soon"><div class="sum"><b>${esc(t.name)}</b><span>${esc(t.one)} · 준비 중</span></div></div>`
    : `<details class="term" data-name="${esc(t.name)}"${t.open ? ' open' : ''}><summary><b>${esc(t.name)}</b><span>${esc(t.one)}</span></summary><div class="tb">
      ${flow(t)}
      ${t.fig || ''}
      <h3>${esc(jo(t.name, '은', '는'))} 무엇인지</h3>
      ${t.what.map(c => `<div class="claim">${ul(c.lines)}<div class="why">${slot(c.q1, c.why)}${c.why2 ? `<div class="deep">${slot(c.q2, c.why2)}</div>` : ''}${slot(c.q3, c.so)}</div></div>`).join('')}
      <h3>${esc(t.useTitle || jo(t.name, '을', '를') + ' 잘 쓰려면')}</h3>
      <div class="tbl"><table><tr><th>${esc(t.name)}의 성질</th><th>게임 개발에 적용</th></tr>${t.use.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${ul([b])}</td></tr>`).join('')}</table></div>
      ${t.useNote ? ul(t.useNote) : ''}
      ${t.cmds ? `<h3>명령어</h3>
      <div class="tbl"><table><tr><th>명령어</th><th>하는 일</th><th>언제 쓰나</th></tr>${t.cmds.map(([c, d, w]) => `<tr><td><code>${esc(c)}</code></td><td>${ul([d])}</td><td>${ul([w])}</td></tr>`).join('')}</table></div>
      ${t.cmdNote ? ul(t.cmdNote) : ''}` : ''}
      ${t.tips ? `<h3>추천 프롬프트</h3>
      <div class="tips">${t.tips.map(([p, why]) => `<div class="tip"><div class="code"><pre>${esc(p)}</pre><button type="button" class="cp">복사</button></div>${ul([why])}</div>`).join('')}</div>` : ''}
      <h3>나의 경험</h3>
      <div class="mine">${t.mine.map(s => `<div class="note">${ul(s)}</div>`).join('')}</div>
    </div></details>`;
  view.innerHTML = `
  <p class="px eyebrow">Vibe Coding</p>
  <h1>바이브코딩</h1>
  <p class="lede">AI와 함께 만들며 배운 것을 적는다. 뜻만 외우지 않고, 왜 그런지와 그래서 내 작업에서 어떻게 쓰는지까지 본다.</p>
  <section id="quiz" class="quiz"></section>
  ${STUDY.map(t => (t.part ? `<h2>${esc(t.part)}</h2>` : '') + item(t)).join('')}`;
  qzRender(); qzInit();
  view.querySelectorAll('.tip .cp').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.previousElementSibling.textContent); b.textContent = '복사됨'; }
    catch { b.textContent = '직접 선택해 주세요'; }
    setTimeout(() => b.textContent = '복사', 1500);
  });
  // 흐름에서 다른 항목을 누르면 그 항목을 펼치고 그리로 이동한다.
  view.querySelectorAll('[data-go]').forEach(a => a.onclick = e => {
    e.preventDefault();
    const d = [...view.querySelectorAll('details.term')].find(x => x.dataset.name === a.dataset.go);
    if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
}

// 퀴즈 상태: 정답률(stats)과 오답 노트(wrong). 개인 저장(db의 data/users/<id>)이 되면 거기에, 아니면 이 브라우저에만.
const QZ = { mode:'mc', filter:'전체', cur:null, store:{ stats:{}, wrong:{} }, where:'local', ref:null, saving:Promise.resolve(), sample:null, inited:false };
const QZ_KEY = 'bigtory-quiz-v1';
function qzLocalLoad(){ try { const s = JSON.parse(localStorage.getItem(QZ_KEY) || 'null'); if (s && s.stats) QZ.store = s; } catch {} }
function qzSave(){
  if (QZ.where === 'db' && QZ.ref) {
    const body = JSON.parse(JSON.stringify(QZ.store));
    QZ.saving = QZ.saving.then(() => QZ.ref.set(body)).catch(() => { QZ.where = 'local'; qzStatus(); });
  }
  try { localStorage.setItem(QZ_KEY, JSON.stringify(QZ.store)); } catch {}
}
async function qzInit(){
  if (QZ.inited) return; QZ.inited = true;
  qzLocalLoad();
  const c = window.claude;
  if (!c || !c.use) { qzStatus(); return; }
  try {
    const [db, user, sample] = await Promise.all([c.use('db'), c.use('user'), c.use('sample')]);
    QZ.sample = sample || null;
    const id = user ? await user.id() : null;
    if (db && id) {
      QZ.ref = db.doc('data/users/' + id + '/quiz');
      const snap = await QZ.ref.get();
      const d = snap.exists ? snap.data() : null;
      if (d && d.stats) QZ.store = JSON.parse(JSON.stringify(d));
      else if (Object.keys(QZ.store.stats).length) await QZ.ref.set(JSON.parse(JSON.stringify(QZ.store)));
      QZ.where = 'db';
    }
  } catch { QZ.where = 'local'; }
  qzRender();
}
function qzRecord(q, ok, mine){
  const s = QZ.store.stats[q.item] || (QZ.store.stats[q.item] = { n:0, ok:0 });
  s.n++; if (ok) s.ok++;
  if (ok) delete QZ.store.wrong[q.id]; else QZ.store.wrong[q.id] = { mine: String(mine).slice(0, 500), at: Date.now() };
  qzSave(); qzStats();
}
function qzPool(){
  const items = QZ.filter === '전체' ? null : QZ.filter;
  return QUIZ.filter(q => q.t === QZ.mode && (!items || q.item === items));
}
function qzNext(){
  const pool = qzPool(); if (!pool.length) { QZ.cur = null; return; }
  // 직전 문제는 피하고, 틀린 적 있는 문제를 조금 더 자주 낸다.
  const w = pool.filter(q => q !== QZ.cur).flatMap(q => QZ.store.wrong[q.id] ? [q, q] : [q]);
  QZ.cur = (w.length ? w : pool)[Math.floor(Math.random() * (w.length || pool.length))];
}
function qzStatus(){
  const el = document.getElementById('qzWhere'); if (!el) return;
  el.textContent = QZ.where === 'db' ? '기록은 내 계정에만 저장된다.' : '기록은 이 브라우저에만 저장된다.';
}
function qzStats(){
  const el = document.getElementById('qzStats'); if (!el) return;
  const items = [...new Set(QUIZ.map(q => q.item))];
  el.innerHTML = items.map(it => {
    const s = QZ.store.stats[it] || { n:0, ok:0 }, p = s.n ? Math.round(s.ok / s.n * 100) : null;
    const weak = p !== null && s.n >= 2 && p < 60;
    return `<button type="button" class="qs${weak ? ' weak' : ''}${QZ.filter === it ? ' on' : ''}" data-it="${esc(it)}"><b>${esc(it)}</b><i style="width:${p ?? 0}%"></i><span>${p === null ? '아직 안 풂' : p + '% (' + s.ok + '/' + s.n + ')'}${weak ? ' · 약함' : ''}</span></button>`;
  }).join('');
  el.querySelectorAll('[data-it]').forEach(b => b.onclick = () => { QZ.filter = QZ.filter === b.dataset.it ? '전체' : b.dataset.it; if (QZ.mode !== 'note') qzNext(); qzRender(); });
}
function qzRender(){
  const box = document.getElementById('quiz'); if (!box) return;
  const items = ['전체', ...new Set(QUIZ.map(q => q.item))];
  const nWrong = Object.keys(QZ.store.wrong).length;
  box.innerHTML = `<h2 style="margin-top:28px">퀴즈</h2>
  <div class="qz-bar" role="group" aria-label="문제 종류">${[['mc','객관식'],['sa','주관식'],['note','오답 노트 ' + nWrong]].map(([k, t]) => `<button type="button" data-mode="${k}" aria-pressed="${QZ.mode === k}">${t}</button>`).join('')}</div>
  <div class="qz-filter" role="group" aria-label="항목 거르기">${items.map(it => `<button type="button" data-f="${esc(it)}" aria-pressed="${QZ.filter === it}">${esc(it)}</button>`).join('')}</div>
  <div id="qzBody" class="qz-body"></div>
  <p class="qz-sub">항목별 정답률 <small>(누르면 그 항목만 낸다. 두 번 이상 풀고 60% 아래면 약함)</small></p>
  <div id="qzStats" class="qz-stats"></div>
  <p id="qzWhere" class="qz-where"></p>`;
  box.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { QZ.mode = b.dataset.mode; if (QZ.mode !== 'note') qzNext(); qzRender(); });
  box.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { QZ.filter = b.dataset.f; if (QZ.mode !== 'note') qzNext(); qzRender(); });
  qzStats(); qzStatus();
  if (QZ.mode === 'note') qzNote(); else { if (!QZ.cur || QZ.cur.t !== QZ.mode || (QZ.filter !== '전체' && QZ.cur.item !== QZ.filter)) qzNext(); qzShow(); }
}
function qzShow(){
  const body = document.getElementById('qzBody'), q = QZ.cur;
  if (!q) { body.innerHTML = '<p class="qz-sub">이 조건에 맞는 문제가 없다.</p>'; return; }
  const head = `<p class="qz-q"><span class="chip">${esc(q.item)}</span> ${esc(q.q)}</p>`;
  if (q.t === 'mc') {
    body.innerHTML = head + `<div class="qz-ch">${q.c.map((c, i) => `<button type="button" data-i="${i}">${i + 1}. ${esc(c)}</button>`).join('')}</div><div class="qz-res"></div><button type="button" class="qz-next" hidden>다음 문제</button>`;
    const res = body.querySelector('.qz-res'), next = body.querySelector('.qz-next');
    body.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
      const i = +b.dataset.i, ok = i === q.a;
      body.querySelectorAll('[data-i]').forEach(x => { x.disabled = true; if (+x.dataset.i === q.a) x.classList.add('right'); });
      if (!ok) b.classList.add('wrongc');
      res.innerHTML = `<p class="${ok ? 'ok' : 'no'}">${ok ? '정답' : '오답'}</p><p>${esc(q.why)}</p>`;
      qzRecord(q, ok, (i + 1) + '. ' + q.c[i]);
      next.hidden = false;
    });
    next.onclick = () => { qzNext(); qzShow(); };
  } else {
    body.innerHTML = head + `<textarea class="qz-in" rows="4" placeholder="내 말로 써 본다"></textarea>
    <div class="qz-row"><button type="button" class="qz-grade">${QZ.sample ? 'AI 채점' : '모범 답 보기'}</button><button type="button" class="qz-next">다음 문제</button></div><div class="qz-res"></div>`;
    const ta = body.querySelector('.qz-in'), res = body.querySelector('.qz-res'), grade = body.querySelector('.qz-grade');
    body.querySelector('.qz-next').onclick = () => { qzNext(); qzShow(); };
    const model = () => `<p class="qz-sub">모범 답</p><p>${esc(q.model)}</p><p class="qz-sub">핵심</p><ul class="ln">${q.keys.map(k => `<li>${esc(k)}</li>`).join('')}</ul>`;
    const selfGrade = () => {
      res.innerHTML = model() + `<div class="qz-row"><button type="button" data-self="1">맞았다</button><button type="button" data-self="0">틀렸다</button></div>`;
      res.querySelectorAll('[data-self]').forEach(b => b.onclick = () => { qzRecord(q, b.dataset.self === '1', ta.value); res.querySelectorAll('[data-self]').forEach(x => x.disabled = true); });
    };
    grade.onclick = async () => {
      const ans = ta.value.trim();
      if (!ans) { ta.focus(); return; }
      if (!QZ.sample) { selfGrade(); return; }
      grade.disabled = true; res.innerHTML = '<p class="qz-sub">채점하는 중...</p>';
      try {
        const r = await QZ.sample.json(
          'AI 공부 퀴즈를 채점한다. 질문, 꼭 들어가야 할 핵심, 학습자 답을 보고 판단한다. 표현이 달라도 뜻이 같으면 맞힌 것으로 본다. '
          + '다음 JSON 하나로만 답한다: {"score": 0~100 정수, "hit": ["맞힌 핵심"], "miss": ["빠진 핵심"], "comment": "한두 문장 피드백, ~다 평서체"}\n\n'
          + '질문: ' + q.q + '\n핵심: ' + q.keys.join(' / ') + '\n학습자 답: ' + ans.slice(0, 2000),
          { modelTier: 'quick', cache: false });
        const score = Math.max(0, Math.min(100, Math.round(Number(r && r.score) || 0))), ok = score >= 70;
        res.innerHTML = `<p class="${ok ? 'ok' : 'no'}"></p><p class="qz-c"></p><div class="qz-hm"></div>` + model();
        res.querySelector('p').textContent = (ok ? '맞음 · ' : '아쉬움 · ') + score + '점';
        res.querySelector('.qz-c').textContent = String(r && r.comment || '');
        const hm = res.querySelector('.qz-hm');
        for (const [lab, arr] of [['맞힌 점', r && r.hit], ['빠진 점', r && r.miss]]) {
          if (!Array.isArray(arr) || !arr.length) continue;
          const p = document.createElement('p'); p.className = 'qz-sub'; p.textContent = lab; hm.append(p);
          const ul = document.createElement('ul'); ul.className = 'ln';
          for (const x of arr) { const li = document.createElement('li'); li.textContent = String(x); ul.append(li); }
          hm.append(ul);
        }
        qzRecord(q, ok, ans);
      } catch (e) {
        if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e && e.code)) QZ.sample = null;
        selfGrade();
        res.insertAdjacentHTML('afterbegin', `<p class="qz-sub">${e && e.code === 'rate_limited' ? 'AI 채점이 잠시 막혔다. 모범 답과 비교해 직접 고른다.' : 'AI 채점을 쓸 수 없어 직접 고른다.'}</p>`);
      } finally { grade.disabled = false; }
    };
  }
}
function qzNote(){
  const body = document.getElementById('qzBody');
  const list = QUIZ.filter(q => QZ.store.wrong[q.id] && (QZ.filter === '전체' || q.item === QZ.filter));
  if (!list.length) { body.innerHTML = '<p class="qz-sub">틀린 문제가 없다.</p>'; return; }
  body.innerHTML = list.map(q => `<div class="qz-note"><p class="qz-q"><span class="chip">${esc(q.item)}</span> ${esc(q.q)}</p>
    <p class="qz-sub">내 답</p><p class="mine"></p>
    <p class="qz-sub">${q.t === 'mc' ? '정답' : '모범 답'}</p><p>${esc(q.t === 'mc' ? (q.a + 1) + '. ' + q.c[q.a] + ' · ' + q.why : q.model)}</p>
    <div class="qz-row"><button type="button" data-retry="${q.id}">다시 풀기</button><button type="button" data-done="${q.id}">이제 안다</button></div></div>`).join('');
  body.querySelectorAll('.qz-note').forEach((n, i) => n.querySelector('.mine').textContent = QZ.store.wrong[list[i].id].mine || '');
  body.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => { const q = QUIZ.find(x => x.id === b.dataset.retry); QZ.mode = q.t; QZ.filter = q.item; QZ.cur = q; qzRender(); });
  body.querySelectorAll('[data-done]').forEach(b => b.onclick = () => { delete QZ.store.wrong[b.dataset.done]; qzSave(); qzRender(); });
}
